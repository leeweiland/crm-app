<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Automations — CRM</title>
<link rel="stylesheet" href="/crm-design-system.css"/>
<style>
  .toolbar { display: flex; align-items: center; margin-bottom: 18px; }
  .active-toggle { width: 38px; height: 20px; border-radius: 12px; background: var(--pra-border); position: relative; cursor: pointer; display: inline-block; border: none; }
  .active-toggle.on { background: var(--pra-blue); }
  .active-toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .active-toggle.on::after { transform: translateX(18px); }
</style>
</head>
<body>
<div class="pra-root">
  <div class="app-shell">
    <div class="app-sidebar" id="appSidebar"></div>
    <div class="app-main">
      <div class="toolbar">
        <div class="pra-h1" style="flex:1">Automations</div>
        <button class="pra-btn" id="newAutomationBtn">+ New Automation</button>
      </div>
      <div class="pra-panel" style="overflow-x:auto">
        <table class="data-table">
          <thead><tr><th>Name</th><th>Trigger</th><th>Active</th><th>Total Emails</th><th>Currently Enrolled</th><th>Total Enrolled</th><th>Last Edited</th><th></th></tr></thead>
          <tbody id="automationsBody"><tr><td colspan="8" class="pra-muted">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<script src="/crm-nav.js"></script>
<script>
function escapeHtml(s) { const d = document.createElement('div'); d.textContent = String(s ?? ''); return d.innerHTML; }
function fmtDate(iso) { return iso ? new Date(iso).toLocaleString() : ''; }
const TRIGGER_LABELS = { list_subscribe: 'Subscribes to list', tag_added: 'Tag added', email_opened: 'Email opened', email_clicked: 'Email link clicked' };

async function loadAutomations() {
  const r = await fetch('/api/automations');
  const body = document.getElementById('automationsBody');
  if (!r.ok) { body.innerHTML = '<tr><td colspan="8" class="pra-muted">Could not load.</td></tr>'; return; }
  const { automations } = await r.json();
  if (!automations.length) { body.innerHTML = '<tr><td colspan="8" class="pra-muted">No automations yet.</td></tr>'; return; }
  body.innerHTML = automations.map(a => `
    <tr>
      <td class="clickable" onclick="location.href='/automation-builder.html?id=${a.id}'" style="cursor:pointer;color:var(--pra-blue)">${escapeHtml(a.name)}</td>
      <td class="pra-muted">${TRIGGER_LABELS[a.trigger?.type] || ''}</td>
      <td><button class="active-toggle${a.active ? ' on' : ''}" data-id="${a.id}" data-active="${a.active}"></button></td>
      <td>${Object.values(a.steps || {}).filter(s => s.type === 'send_email').length}</td>
      <td>${a.enrolledCount}</td>
      <td>${a.totalEnrolled}</td>
      <td class="pra-muted">${fmtDate(a.updatedAt)}</td>
      <td style="white-space:nowrap">
        <a class="pra-btn pra-btn-ghost pra-btn-sm" href="/automation-report.html?id=${a.id}" onclick="event.stopPropagation()">View Report</a>
        <button class="pra-btn pra-btn-ghost pra-btn-sm" data-dup="${a.id}">Copy</button>
        <button class="pra-btn pra-btn-sm pra-btn-danger" data-del="${a.id}">Delete</button>
      </td>
    </tr>
  `).join('');
  document.querySelectorAll('.active-toggle').forEach(btn => btn.onclick = async () => {
    const next = btn.dataset.active !== 'true';
    await fetch(`/api/automations/${btn.dataset.id}/active`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ active: next }) });
    loadAutomations();
  });
  document.querySelectorAll('[data-dup]').forEach(btn => btn.onclick = async () => {
    const r = await fetch(`/api/automations/${btn.dataset.dup}/duplicate`, { method: 'POST' });
    const d = await r.json();
    if (r.ok) location.href = '/automation-builder.html?id=' + d.automation.id;
  });
  document.querySelectorAll('[data-del]').forEach(btn => btn.onclick = async () => {
    if (!confirm('Delete this automation?')) return;
    await fetch('/api/automations/' + btn.dataset.del, { method: 'DELETE' });
    loadAutomations();
  });
}
document.getElementById('newAutomationBtn').onclick = async () => {
  const r = await fetch('/api/automations', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: 'Untitled Automation' }) });
  const d = await r.json();
  if (r.ok) location.href = '/automation-builder.html?id=' + d.automation.id;
};
loadAutomations();
</script>
</body>
</html>

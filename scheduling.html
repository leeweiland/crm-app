<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Scheduling — CRM</title>
<link rel="stylesheet" href="/crm-design-system.css"/>
<style>
  .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .tabs { display: flex; gap: 6px; margin-bottom: 18px; }
  .tab-btn { background: transparent; border: 1px solid var(--pra-border); color: var(--pra-dim); font-family: var(--font-primary); font-weight: 700; font-size: .82rem; padding: 8px 16px; border-radius: 8px; cursor: pointer; }
  .tab-btn.active { color: var(--pra-blue); border-color: var(--pra-blue); background: var(--pra-blue-dim); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .status-pill { font-size: .68rem; text-transform: uppercase; padding: 3px 10px; border-radius: 10px; }
  .status-confirmed { background: rgba(57,255,20,0.15); color: var(--pra-green); }
  .status-cancelled { background: rgba(255,59,59,0.15); color: var(--pra-red); }
  .conn-pill { font-size: .7rem; padding: 4px 10px; border-radius: 20px; border: 1px solid var(--pra-border); color: var(--pra-dim); margin-left: auto; }
  .conn-pill.on { color: var(--pra-green); border-color: rgba(57,255,20,0.35); }
  .conn-pill.off { color: var(--pra-red); border-color: rgba(255,59,59,0.35); }
  .link-row { display: flex; align-items: center; gap: 8px; font-size: .78rem; color: var(--pra-dim); }
  .link-row code { background: rgba(255,255,255,0.05); padding: 2px 6px; border-radius: 4px; }
  .week-row { display: grid; grid-template-columns: 110px 90px 1fr 1fr; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--pra-border); }
  .week-row:last-child { border-bottom: none; }
  .week-row input[type=time] { width: 100%; }
  .toggle-switch { width: 38px; height: 22px; border-radius: 12px; background: var(--pra-panel-2); border: 1px solid var(--pra-border); position: relative; cursor: pointer; flex-shrink: 0; }
  .toggle-switch::after { content: ''; position: absolute; width: 16px; height: 16px; border-radius: 50%; background: var(--pra-dim); top: 2px; left: 2px; transition: left .15s, background .15s; }
  .toggle-switch.on { border-color: var(--pra-blue); }
  .toggle-switch.on::after { left: 18px; background: var(--pra-blue); }
</style>
</head>
<body>
<div class="pra-root">
  <div class="app-shell">
    <div class="app-sidebar" id="appSidebar"></div>
    <div class="app-main">
      <div class="toolbar">
        <div class="pra-h1" style="flex:1">Scheduling</div>
        <span class="conn-pill" id="calConnPill">Checking calendar…</span>
      </div>
      <div class="tabs">
        <button class="tab-btn active" data-tab="bookings">Bookings</button>
        <button class="tab-btn" data-tab="eventTypes">Event Types</button>
        <button class="tab-btn" data-tab="availability">Availability</button>
      </div>

      <!-- ── Bookings ── -->
      <div class="tab-panel active" id="tab-bookings">
        <div class="pra-panel" style="overflow-x:auto">
          <table class="data-table">
            <thead><tr><th>When</th><th>Contact</th><th>Event Type</th><th>Status</th><th></th></tr></thead>
            <tbody id="bookingsBody"><tr><td colspan="5" class="pra-muted">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>

      <!-- ── Event Types ── -->
      <div class="tab-panel" id="tab-eventTypes">
        <div class="toolbar" style="margin-bottom:14px">
          <div class="pra-muted" style="font-size:.82rem;flex:1">Each event type gets its own public booking page at <code>/book/&lt;slug&gt;</code>.</div>
          <button class="pra-btn" id="newEventTypeBtn">+ New Event Type</button>
        </div>
        <div class="pra-panel" style="overflow-x:auto">
          <table class="data-table">
            <thead><tr><th>Name</th><th>Duration</th><th>Buffer</th><th>Location</th><th>Active</th><th>Booking Link</th><th></th></tr></thead>
            <tbody id="eventTypesBody"><tr><td colspan="7" class="pra-muted">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>

      <!-- ── Availability ── -->
      <div class="tab-panel" id="tab-availability">
        <div class="pra-panel" style="padding:20px;max-width:640px">
          <div class="pra-muted" style="font-size:.82rem;margin-bottom:16px">Weekly hours, in <b id="availTz">America/Anchorage</b>. Shared across every event type.</div>
          <div id="weekEditor"></div>
          <div class="field" style="margin-top:16px;max-width:260px">
            <label class="pra-label">Minimum notice (minutes)</label>
            <input class="pra-input" type="number" id="minNotice" min="0" step="15"/>
          </div>
          <button class="pra-btn" id="saveAvailabilityBtn" style="margin-top:16px">Save Availability</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Event type modal -->
<div class="modal-backdrop" id="etModal">
  <div class="pra-panel modal-box" style="max-width:600px;max-height:88vh;overflow-y:auto">
    <div class="pra-h2" style="margin-bottom:16px" id="etModalTitle">New Event Type</div>
    <div class="field"><label class="pra-label">Name</label><input class="pra-input" id="etName"/></div>
    <div class="field"><label class="pra-label">Description</label><textarea class="pra-textarea" id="etDescription" rows="2"></textarea></div>
    <div class="field-row">
      <div class="field"><label class="pra-label">Duration (minutes)</label><input class="pra-input" type="number" id="etDuration" min="5" step="5" value="30"/></div>
      <div class="field"><label class="pra-label">Buffer (minutes)</label><input class="pra-input" type="number" id="etBuffer" min="0" step="5" value="0"/></div>
    </div>
    <div class="field-row">
      <div class="field"><label class="pra-label">Location</label>
        <select class="pra-select" id="etLocationType">
          <option value="zoom">Zoom</option>
          <option value="phone">Phone call</option>
          <option value="in_person">In person</option>
          <option value="custom">Custom</option>
        </select>
      </div>
      <div class="field"><label class="pra-label">Location detail</label><input class="pra-input" id="etLocationDetail" placeholder="Zoom link, address, etc."/></div>
    </div>
    <div class="field"><label class="pra-label">On booking, set contact status to</label>
      <select class="pra-select" id="etStatus"><option value="">Don't change status</option></select>
    </div>

    <hr style="border-color:var(--pra-border);margin:20px 0"/>
    <div class="pra-h2" style="margin-bottom:10px;font-size:1rem">Booking Page Branding</div>
    <div class="field-row">
      <div class="field"><label class="pra-label">Brand name</label><input class="pra-input" id="etBrandName" placeholder="Pacific Rim Athletics"/></div>
      <div class="field"><label class="pra-label">Logo URL</label><input class="pra-input" id="etLogoUrl" placeholder="https://…"/></div>
    </div>
    <div class="field-row">
      <div class="field"><label class="pra-label">Background color</label>
        <div style="display:flex;gap:8px;align-items:center"><input type="color" id="etBackgroundColor" value="#ffffff"/><input class="pra-input" id="etBackgroundColorHex" value="#ffffff"/></div>
      </div>
      <div class="field"><label class="pra-label">Text color</label>
        <div style="display:flex;gap:8px;align-items:center"><input type="color" id="etTextColor" value="#0a0a0a"/><input class="pra-input" id="etTextColorHex" value="#0a0a0a"/></div>
      </div>
      <div class="field"><label class="pra-label">Accent color</label>
        <div style="display:flex;gap:8px;align-items:center"><input type="color" id="etAccentColor" value="#009bff"/><input class="pra-input" id="etAccentColorHex" value="#009bff"/></div>
      </div>
    </div>
    <div class="field"><label class="pra-label">Redirect URL after booking (leave blank to show the built-in confirmation screen)</label><input class="pra-input" id="etRedirectUrl" placeholder="https://pacificrimathletics.com/thank-you"/></div>

    <div class="btn-row" style="display:flex;gap:10px;margin-top:16px">
      <button class="pra-btn" id="saveEtBtn" style="flex:1">Save</button>
      <button class="pra-btn pra-btn-ghost" onclick="closeModal('etModal')">Cancel</button>
    </div>
  </div>
</div>

<script src="/crm-nav.js"></script>
<script>
function escapeHtml(s) { const d = document.createElement('div'); d.textContent = String(s ?? ''); return d.innerHTML; }
function fmtWhen(iso) { return new Date(iso).toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' }); }
function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }

document.querySelectorAll('.tab-btn').forEach(btn => btn.onclick = () => {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
});

async function loadStatus() {
  const r = await fetch('/api/scheduling/admin/status');
  const d = await r.json();
  const pill = document.getElementById('calConnPill');
  pill.textContent = d.calendarConnected ? 'Google Calendar connected' : 'Google Calendar not connected (internal-only conflict checking)';
  pill.className = 'conn-pill ' + (d.calendarConnected ? 'on' : 'off');
}

// ── Bookings ──────────────────────────────────────────────────────────────
async function loadBookings() {
  const body = document.getElementById('bookingsBody');
  const r = await fetch('/api/scheduling/admin/bookings');
  if (!r.ok) { body.innerHTML = '<tr><td colspan="5" class="pra-muted">Could not load bookings.</td></tr>'; return; }
  const { bookings } = await r.json();
  if (!bookings.length) { body.innerHTML = '<tr><td colspan="5" class="pra-muted">No bookings yet.</td></tr>'; return; }
  const upcoming = [...bookings].sort((a, b) => new Date(b.startAt) - new Date(a.startAt));
  body.innerHTML = upcoming.map(b => `
    <tr>
      <td>${fmtWhen(b.startAt)}</td>
      <td>${escapeHtml(b.name)}<br/><span class="pra-muted" style="font-size:.76rem">${escapeHtml(b.email)}</span></td>
      <td>${escapeHtml(b.eventType?.name || '—')}</td>
      <td><span class="status-pill status-${b.status}">${b.status}</span></td>
      <td>${b.status === 'confirmed' ? `<button class="pra-btn pra-btn-sm pra-btn-danger" data-cancel="${b.id}">Cancel</button>` : ''}</td>
    </tr>
  `).join('');
  document.querySelectorAll('[data-cancel]').forEach(btn => btn.onclick = async () => {
    if (!confirm('Cancel this booking?')) return;
    await fetch('/api/scheduling/admin/bookings/' + btn.dataset.cancel + '/cancel', { method: 'POST' });
    loadBookings();
  });
}

// ── Event types ───────────────────────────────────────────────────────────
let editingEtId = null;
async function loadEventTypes() {
  const body = document.getElementById('eventTypesBody');
  const r = await fetch('/api/scheduling/admin/event-types');
  const { eventTypes } = await r.json();
  if (!eventTypes.length) { body.innerHTML = '<tr><td colspan="7" class="pra-muted">No event types yet — click "+ New Event Type".</td></tr>'; return; }
  body.innerHTML = eventTypes.map(et => `
    <tr>
      <td>${escapeHtml(et.name)}</td>
      <td>${et.durationMinutes} min</td>
      <td>${et.bufferMinutes} min</td>
      <td>${escapeHtml(et.location?.type || '')}</td>
      <td>${et.active ? 'Yes' : 'No'}</td>
      <td><div class="link-row"><code>/book/${escapeHtml(et.slug)}</code><a class="pra-link" href="/book/${escapeHtml(et.slug)}" target="_blank">Open</a></div></td>
      <td style="white-space:nowrap">
        <button class="pra-btn pra-btn-ghost pra-btn-sm" data-edit="${et.id}">Edit</button>
        <button class="pra-btn pra-btn-sm pra-btn-danger" data-del="${et.id}">Delete</button>
      </td>
    </tr>
  `).join('');
  document.querySelectorAll('[data-edit]').forEach(btn => btn.onclick = () => openEtModal(eventTypes.find(e => e.id === btn.dataset.edit)));
  document.querySelectorAll('[data-del]').forEach(btn => btn.onclick = async () => {
    if (!confirm('Delete this event type? Existing bookings are kept.')) return;
    await fetch('/api/scheduling/admin/event-types/' + btn.dataset.del, { method: 'DELETE' });
    loadEventTypes();
  });
}
let allStatuses = [];
async function loadStatuses() {
  const r = await fetch('/api/statuses');
  if (!r.ok) return;
  allStatuses = (await r.json()).statuses;
  const select = document.getElementById('etStatus');
  select.innerHTML = '<option value="">Don\'t change status</option>' + allStatuses.map(s => `<option value="${s.id}">${escapeHtml(s.label)}</option>`).join('');
}

// Keeps each <input type=color> in sync with its adjacent hex text field --
// either one can be edited and the other follows.
function linkColorInputs(colorId, hexId) {
  const colorEl = document.getElementById(colorId), hexEl = document.getElementById(hexId);
  colorEl.oninput = () => { hexEl.value = colorEl.value; };
  hexEl.oninput = () => { if (/^#[0-9a-fA-F]{6}$/.test(hexEl.value)) colorEl.value = hexEl.value; };
}
linkColorInputs('etBackgroundColor', 'etBackgroundColorHex');
linkColorInputs('etTextColor', 'etTextColorHex');
linkColorInputs('etAccentColor', 'etAccentColorHex');

function openEtModal(et) {
  editingEtId = et ? et.id : null;
  document.getElementById('etModalTitle').textContent = et ? 'Edit Event Type' : 'New Event Type';
  document.getElementById('etName').value = et?.name || '';
  document.getElementById('etDescription').value = et?.description || '';
  document.getElementById('etDuration').value = et?.durationMinutes ?? 30;
  document.getElementById('etBuffer').value = et?.bufferMinutes ?? 0;
  document.getElementById('etLocationType').value = et?.location?.type || 'zoom';
  document.getElementById('etLocationDetail').value = et?.location?.detail || '';
  document.getElementById('etStatus').value = et?.statusId || '';
  const b = et?.branding || {};
  document.getElementById('etBrandName').value = b.brandName ?? 'Pacific Rim Athletics';
  document.getElementById('etLogoUrl').value = b.logoUrl || '';
  document.getElementById('etBackgroundColor').value = b.backgroundColor || '#ffffff';
  document.getElementById('etBackgroundColorHex').value = b.backgroundColor || '#ffffff';
  document.getElementById('etTextColor').value = b.textColor || '#0a0a0a';
  document.getElementById('etTextColorHex').value = b.textColor || '#0a0a0a';
  document.getElementById('etAccentColor').value = b.accentColor || '#009bff';
  document.getElementById('etAccentColorHex').value = b.accentColor || '#009bff';
  document.getElementById('etRedirectUrl').value = b.redirectUrl || '';
  openModal('etModal');
}
document.getElementById('newEventTypeBtn').onclick = () => openEtModal(null);
document.getElementById('saveEtBtn').onclick = async () => {
  const payload = {
    name: document.getElementById('etName').value.trim(),
    description: document.getElementById('etDescription').value.trim(),
    durationMinutes: Number(document.getElementById('etDuration').value) || 30,
    bufferMinutes: Number(document.getElementById('etBuffer').value) || 0,
    location: { type: document.getElementById('etLocationType').value, detail: document.getElementById('etLocationDetail').value.trim() },
    statusId: document.getElementById('etStatus').value,
    branding: {
      brandName: document.getElementById('etBrandName').value.trim(),
      logoUrl: document.getElementById('etLogoUrl').value.trim(),
      backgroundColor: document.getElementById('etBackgroundColorHex').value.trim() || '#ffffff',
      textColor: document.getElementById('etTextColorHex').value.trim() || '#0a0a0a',
      accentColor: document.getElementById('etAccentColorHex').value.trim() || '#009bff',
      redirectUrl: document.getElementById('etRedirectUrl').value.trim(),
    },
  };
  if (!payload.name) { showToast('Name is required', true); return; }
  const url = editingEtId ? '/api/scheduling/admin/event-types/' + editingEtId : '/api/scheduling/admin/event-types';
  const r = await fetch(url, { method: editingEtId ? 'PATCH' : 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
  if (!r.ok) { showToast('Failed to save', true); return; }
  closeModal('etModal');
  showToast('Saved');
  loadEventTypes();
};

// ── Availability ──────────────────────────────────────────────────────────
const DAY_LABELS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
let availabilityState = null;
async function loadAvailability() {
  const r = await fetch('/api/scheduling/admin/availability');
  const { availability } = await r.json();
  availabilityState = availability;
  document.getElementById('availTz').textContent = availability.timezone;
  document.getElementById('minNotice').value = availability.minNoticeMinutes;
  renderWeekEditor();
}
function renderWeekEditor() {
  const wrap = document.getElementById('weekEditor');
  wrap.innerHTML = DAY_LABELS.map((label, i) => {
    const rule = availabilityState.weekly[String(i)];
    const on = !!rule;
    return `
      <div class="week-row">
        <div>${label}</div>
        <div class="toggle-switch ${on ? 'on' : ''}" data-day="${i}"></div>
        <input class="pra-input" type="time" data-start="${i}" value="${rule?.start || '09:00'}" ${on ? '' : 'disabled'}/>
        <input class="pra-input" type="time" data-end="${i}" value="${rule?.end || '17:00'}" ${on ? '' : 'disabled'}/>
      </div>
    `;
  }).join('');
  wrap.querySelectorAll('[data-day]').forEach(sw => sw.onclick = () => {
    const day = sw.dataset.day;
    const isOn = sw.classList.toggle('on');
    availabilityState.weekly[day] = isOn ? { start: '09:00', end: '17:00' } : null;
    renderWeekEditor();
  });
  wrap.querySelectorAll('[data-start]').forEach(inp => inp.onchange = () => {
    availabilityState.weekly[inp.dataset.start].start = inp.value;
  });
  wrap.querySelectorAll('[data-end]').forEach(inp => inp.onchange = () => {
    availabilityState.weekly[inp.dataset.end].end = inp.value;
  });
}
document.getElementById('saveAvailabilityBtn').onclick = async () => {
  availabilityState.minNoticeMinutes = Number(document.getElementById('minNotice').value) || 0;
  const r = await fetch('/api/scheduling/admin/availability', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(availabilityState) });
  showToast(r.ok ? 'Availability saved' : 'Failed to save', !r.ok);
};

loadStatus();
loadStatuses();
loadBookings();
loadEventTypes();
loadAvailability();
</script>
</body>
</html>

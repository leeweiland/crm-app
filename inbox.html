<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Inbox — CRM</title>
<link rel="stylesheet" href="/crm-design-system.css"/>
<style>
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; border-bottom: 1px solid var(--pra-border); flex-wrap: wrap; align-items: center; }
  .tab-btn { background: none; border: none; color: var(--pra-dim); font-family: var(--font-primary); font-weight: 700; font-size: .84rem; padding: 10px 14px; cursor: pointer; border-bottom: 2px solid transparent; }
  .tab-btn.active { color: var(--pra-white); border-bottom-color: var(--pra-blue); }

  /* ── Flat list (Tasks / Reminders) ── */
  .inbox-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .inbox-toolbar select { max-width: 160px; }
  .bulk-actions { display: flex; align-items: center; gap: 8px; }
  .inbox-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--pra-border); }
  .inbox-item:last-child { border-bottom: none; }
  .item-check { flex-shrink: 0; cursor: pointer; width: 16px; height: 16px; }
  .item-icon { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: .8rem; flex-shrink: 0; }
  .item-icon.task, .item-icon.reminder { background: rgba(255,193,7,0.15); color: #ffc107; }
  .item-body { flex: 1; min-width: 0; }
  .item-name { font-size: .88rem; }
  .item-preview { font-size: .8rem; color: var(--pra-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-time { font-size: .74rem; color: var(--pra-dim); white-space: nowrap; }
  .item-done-btn { background: none; border: 1px solid var(--pra-border); color: var(--pra-dim); border-radius: 6px; width: 28px; height: 28px; cursor: pointer; flex-shrink: 0; font-size: .8rem; }
  .item-done-btn:hover { border-color: var(--pra-green); color: var(--pra-green); }
  .inbox-row { cursor: pointer; transition: background .1s; }
  .inbox-row:hover { background: rgba(255,255,255,0.03); }

  /* ── Chat shell ── */
  .chat-shell { display: flex; height: calc(100vh - 190px); min-height: 420px; border: 1px solid var(--pra-border); border-radius: 10px; overflow: hidden; }
  .chat-sidebar { width: 300px; flex-shrink: 0; background: var(--pra-panel); display: flex; flex-direction: column; min-width: 0; }
  /* Drag handle between the conversation list and the chat panel -- the
     border that used to sit on .chat-sidebar itself moved onto this, since
     the handle needs its own hit area (6px) wider than a 1px visual line. */
  .chat-resize-handle { width: 6px; flex-shrink: 0; cursor: col-resize; position: relative; background: transparent; }
  .chat-resize-handle::after { content: ''; position: absolute; top: 0; bottom: 0; left: 2px; width: 1px; background: var(--pra-border); }
  .chat-resize-handle:hover::after, .chat-resize-handle.dragging::after { left: 0; width: 6px; background: var(--pra-blue); opacity: .5; }
  .chat-sidebar-search { padding: 10px; border-bottom: 1px solid var(--pra-border); flex-shrink: 0; }
  .convo-list { flex: 1; overflow-y: auto; }

  .convo-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--pra-border); cursor: pointer; }
  .convo-row:hover { background: rgba(255,255,255,0.03); }
  .convo-row.selected { background: var(--pra-blue-dim); border-left: 3px solid var(--pra-blue); padding-left: 9px; }
  .convo-row.pinned { background: rgba(0,155,255,0.04); }
  /* Outer glow color is set inline per row (--status-glow, from the
     contact's CRM status -- see STATUS_GLOW below); background flips to
     the brightest neon green specifically for an unresponded thread,
     overriding the status color so "needs a reply" always reads at a
     glance regardless of what status the lead is in. */
  .convo-avatar { box-shadow: 0 0 0 2px var(--status-glow, transparent), 0 0 9px 2px var(--status-glow-soft, transparent); transition: box-shadow .15s, background .15s; }
  .convo-avatar.has-unread { background: #39ff14; color: #0a0a0d; }
  #chatStatusSelect { box-shadow: 0 0 0 2px var(--status-glow, transparent), 0 0 9px 2px var(--status-glow-soft, transparent); transition: box-shadow .15s; }
  .convo-meta { flex: 1; min-width: 0; }
  .convo-top { display: flex; align-items: baseline; gap: 6px; }
  .convo-pinned-mark { flex-shrink: 0; color: var(--pra-blue); display: inline-flex; margin-right: 4px; }
  .convo-pinned-mark svg { width: 11px; height: 11px; }
  .convo-name { font-weight: 700; font-size: .86rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .convo-preview { font-size: .78rem; font-weight: 400; color: var(--pra-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; display: flex; align-items: center; gap: 4px; }
  .convo-preview .bubble-ticks { display: inline-flex; flex-shrink: 0; }
  .convo-side { flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
  .convo-time { font-size: .68rem; color: var(--pra-dim); white-space: nowrap; }
  .convo-time.has-unread { color: #39ff14; font-weight: 700; }
  .convo-actions-row { display: flex; align-items: center; gap: 1px; }
  .convo-icon-btn { width: 22px; height: 22px; border-radius: 5px; border: none; background: transparent; color: var(--pra-dim); cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: .5; flex-shrink: 0; }
  .convo-icon-btn:hover { opacity: 1; }
  .convo-icon-btn.on { opacity: 1; }
  .convo-icon-btn.pin-btn.on { color: var(--pra-blue); }
  .convo-icon-btn.star-btn.on { color: #ffd54a; }
  .convo-icon-btn svg { width: 14px; height: 14px; }
  .convo-unread-badge { background: #39ff14; color: #0a0a0d; font-family: var(--font-secondary); font-size: .68rem; font-weight: 700; min-width: 18px; height: 18px; border-radius: 9px; display: flex; align-items: center; justify-content: center; padding: 0 5px; }
  .convo-add-btn { margin-top: 4px; }

  /* ── Mobile: single-pane, same pattern as chat-app's chat.html ── */
  @media (max-width: 900px) {
    .chat-shell { height: calc(100vh - 160px); }
    .chat-sidebar { width: 100% !important; }
    .chat-resize-handle { display: none; }
    #chatView.thread-open .chat-sidebar { display: none; }
    #chatView:not(.thread-open) .chat-panel { display: none; }
    .chat-back-btn { display: inline-flex !important; }
  }
  .chat-back-btn { display: none; background: none; border: none; color: var(--pra-white); font-size: 1.3rem; cursor: pointer; padding: 0 2px 0 0; flex-shrink: 0; }

  .chat-panel { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--pra-black-soft); }
  .chat-panel-header { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--pra-border); flex-shrink: 0; }
  .chat-panel-name-row { display: flex; align-items: baseline; gap: 8px; }
  .chat-panel-name { font-weight: 700; font-size: .95rem; color: var(--pra-white); text-decoration: none; cursor: pointer; }
  .chat-panel-name:hover { color: var(--pra-blue); text-decoration: underline; }
  .chat-panel-created { font-size: .72rem; font-weight: 400; color: var(--pra-dim); white-space: nowrap; }
  .chat-panel-sub { font-size: .74rem; color: var(--pra-dim); }
  .chat-empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--pra-dim); font-size: .88rem; }

  .chat-thread { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .bubble-row { display: flex; }
  .bubble-row.outbound { justify-content: flex-end; }
  .bubble-row.inbound { justify-content: flex-start; }
  /* max-width belongs on this wrapper, not .sms-bubble itself -- a
     percentage max-width on a descendant of an auto-width flex item can't
     resolve during the item's own intrinsic-size pass, so the flex item
     (and therefore the bubble) silently fills the entire row instead of
     shrinking to its content, which made every outbound bubble render
     flush left like an inbound one despite the correct blue color/class. */
  .bubble-content { max-width: 62%; }
  .sms-bubble { max-width: 100%; padding: 9px 13px; border-radius: 14px; font-size: .87rem; font-weight: 400; line-height: 1.4; white-space: pre-wrap; }
  .bubble-row.outbound .sms-bubble { background: var(--pra-blue); color: #fff; border-bottom-right-radius: 3px; }
  .bubble-row.inbound .sms-bubble { background: var(--pra-panel-2); color: var(--pra-dim); border: 1px solid var(--pra-border); border-bottom-left-radius: 3px; }
  .bubble-time { font-size: .64rem; color: var(--pra-dim); margin-top: 3px; }
  .bubble-row.outbound .bubble-time { text-align: right; }

  .email-bubble { width: 100%; max-width: 90%; border: 1px solid var(--pra-border); border-radius: 10px; overflow: hidden; cursor: pointer; }
  .bubble-row.outbound .email-bubble { margin-left: auto; border-color: rgba(0,155,255,0.4); }
  .email-bubble-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--pra-panel-2); }
  .email-bubble-icon { flex-shrink: 0; }
  .email-bubble-subject { font-weight: 700; font-size: .85rem; color: var(--pra-dim); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .email-bubble-preview { font-size: .8rem; font-weight: 400; color: var(--pra-dim); padding: 8px 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .email-bubble.expanded .email-bubble-preview { display: none; }
  .email-bubble-body { display: none; background: #fff; }
  .email-bubble.expanded .email-bubble-body { display: block; }
  .email-bubble-body iframe { width: 100%; min-height: 260px; border: none; display: block; }
  .email-bubble-meta { display: flex; align-items: center; gap: 10px; padding: 6px 14px; font-size: .68rem; font-weight: 400; color: var(--pra-dim); border-top: 1px solid var(--pra-border); flex-wrap: wrap; }

  .note-bubble { border: 1px solid var(--pra-border); border-radius: 10px; overflow: hidden; }
  .note-bubble-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--pra-panel-2); font-weight: 700; font-size: .85rem; }
  .note-bubble-body { font-size: .8rem; color: var(--pra-dim); padding: 8px 14px; white-space: pre-wrap; border-top: 1px solid var(--pra-border); }
  .note-bubble .bubble-time { padding: 0 14px 10px; }
  .track-badge { display: inline-flex; align-items: center; gap: 3px; font-size: .66rem; font-weight: 700; padding: 2px 8px; border-radius: 9px; background: rgba(255,255,255,0.05); color: var(--pra-dim); }
  .track-badge.on { background: rgba(57,255,20,0.16); color: #39ff14; box-shadow: 0 0 6px rgba(57,255,20,0.35); }

  .track-summary { display: flex; align-items: center; gap: 12px; padding: 8px 18px; border-bottom: 1px solid var(--pra-border); font-size: .74rem; color: var(--pra-dim); flex-shrink: 0; }
  .track-summary b { color: var(--pra-white); }
  .track-summary .on { color: #39ff14; }

  .compose-bar { border-top: 1px solid var(--pra-border); padding: 12px 16px; flex-shrink: 0; }
  .compose-channel-toggle { display: inline-flex; border: 1px solid var(--pra-border); border-radius: 8px; overflow: hidden; margin-bottom: 8px; }
  .compose-channel-toggle button { background: none; border: none; color: var(--pra-dim); font-size: .76rem; font-weight: 700; padding: 5px 12px; cursor: pointer; }
  .compose-channel-toggle button.active { background: var(--pra-blue-dim); color: var(--pra-blue); }
  .compose-row { display: flex; gap: 8px; align-items: flex-end; }
  .compose-row textarea { flex: 1; resize: none; min-height: 40px; max-height: 140px; }
  .compose-hint { font-size: .74rem; color: var(--pra-red); margin-top: 4px; }

  /* Native date/time pickers render a black-on-black calendar icon on a
     dark background otherwise -- color-scheme flips both to the light
     variant so the icon and popover are visible (same fix as chat-app). */
  #chatTaskDate, #chatTaskTime { color-scheme: dark; color: #fff; }

  /* ── Chat sidebar: filter/sort row ── */
  .chat-sidebar-filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 10px 10px; flex-shrink: 0; }
  .chat-sidebar-filters select { flex: 1; min-width: 84px; font-size: .76rem; padding: 6px 8px; }

  /* ── Right-click / long-press context menu on chat rows ── */
  .context-menu { position: fixed; z-index: 400; min-width: 170px; background: var(--pra-panel-2); border: 1px solid var(--pra-border); border-radius: 8px; padding: 5px; box-shadow: 0 8px 28px rgba(0,0,0,0.5); display: none; }
  .context-menu.show { display: block; }
  .context-menu button { display: flex; align-items: center; width: 100%; padding: 8px 10px; background: none; border: none; color: var(--pra-white); font-family: var(--font-primary); font-size: .83rem; text-align: left; border-radius: 5px; cursor: pointer; }
  .context-menu button:hover { background: rgba(255,255,255,0.06); }
  .context-menu button.danger { color: var(--pra-red); }

  /* ── Chat panel header: + Task control ── */
  .chat-panel-task-btn { flex-shrink: 0; }

  /* ── Contact details overlay (opened from the chat panel's name link) ── */
  .tag-pill { display: inline-flex; align-items: center; gap: 6px; font-size: .74rem; padding: 4px 10px; border-radius: 14px; background: var(--pra-blue-dim); color: var(--pra-blue); margin: 0 6px 6px 0; }
  .tag-pill button { background: none; border: none; color: inherit; cursor: pointer; font-size: .8rem; padding: 0; }
  .ov-sub-label { font-family: var(--font-secondary); font-size: .66rem; text-transform: uppercase; letter-spacing: .06em; color: var(--pra-dim); margin: 16px 0 8px; }
</style>
</head>
<body>
<div class="pra-root">
  <div class="app-shell">
    <div class="app-sidebar" id="appSidebar"></div>
    <div class="app-main">
      <div class="pra-h1" style="margin-bottom:16px">Inbox</div>
      <div class="tabs">
        <button class="tab-btn active" data-tab="primary">Inbox</button>
        <button class="tab-btn" data-tab="tasks">Tasks</button>
        <button class="tab-btn" data-tab="reminders">Reminders</button>
      </div>

      <!-- Tasks / Reminders: existing flat list -->
      <div id="flatListView" style="display:none">
        <div class="inbox-toolbar">
          <select class="pra-select" id="viewSelect">
            <option value="new">New</option>
            <option value="past">Past</option>
            <option value="all">All</option>
          </select>
          <select class="pra-select" id="sortSelect">
            <option value="desc">Newest first</option>
            <option value="asc">Oldest first</option>
            <option value="name">Name (A-Z)</option>
          </select>
          <div style="flex:1"></div>
          <div class="bulk-actions" id="bulkActions" style="display:none">
            <span class="pra-muted" style="font-size:.8rem" id="selectedCount"></span>
            <button class="pra-btn pra-btn-ghost pra-btn-sm" id="bulkDoneBtn">Mark Done</button>
          </div>
        </div>
        <div class="pra-panel" id="itemsPanel"></div>
      </div>

      <!-- Primary / Emails / Messages: chat-style UI -->
      <div id="chatView" class="chat-shell">
        <div class="chat-sidebar">
          <div class="chat-sidebar-search"><input class="pra-input" id="convoSearchInput" placeholder="Search name…"/></div>
          <div class="chat-sidebar-filters">
            <select class="pra-select" id="convoFilterSelect">
              <option value="all">All</option>
              <option value="unresponded">Unresponded</option>
              <option value="done">Done</option>
              <option value="archived">Archived</option>
            </select>
            <select class="pra-select" id="convoChannelSelect">
              <option value="">Email &amp; SMS</option>
              <option value="email">Email</option>
              <option value="sms">SMS</option>
            </select>
            <select class="pra-select" id="convoSortSelect">
              <option value="newest">Newest first</option>
              <option value="oldest">Oldest first</option>
            </select>
          </div>
          <div class="convo-list" id="chatSidebarList"></div>
        </div>
        <div class="chat-resize-handle" id="chatResizeHandle" title="Drag to resize"></div>
        <div class="chat-panel" id="chatPanel">
          <div class="chat-empty">Select a conversation</div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="confirmPotentialModal">
  <div class="pra-panel modal-box">
    <div class="pra-h2" style="margin-bottom:16px">Confirm Contact</div>
    <div class="pra-muted" id="confirmPotentialFrom" style="font-size:.82rem;margin-bottom:14px"></div>
    <div class="field-row">
      <div class="field"><label class="pra-label">First name</label><input class="pra-input" id="confirmFirst"/></div>
      <div class="field"><label class="pra-label">Last name</label><input class="pra-input" id="confirmLast"/></div>
    </div>
    <div class="btn-row" style="display:flex;gap:10px;margin-top:14px">
      <button class="pra-btn" id="saveConfirmBtn" style="flex:1">Create Contact</button>
      <button class="pra-btn pra-btn-ghost" onclick="closeModal('confirmPotentialModal')">Cancel</button>
    </div>
  </div>
</div>

<div class="context-menu" id="convoContextMenu">
  <button type="button" id="ctxDoneBtn">Mark Done</button>
  <button type="button" id="ctxArchiveBtn">Archive</button>
  <button type="button" id="ctxBlacklistBtn">Blacklist</button>
  <button type="button" class="danger" id="ctxDeleteBtn">Delete Conversation</button>
</div>

<div class="modal-backdrop" id="deleteConvoModal">
  <div class="pra-panel modal-box">
    <div class="pra-h2" style="margin-bottom:14px">Delete Conversation</div>
    <div style="background:rgba(255,59,59,0.12);border:1px solid var(--pra-red);border-radius:8px;padding:14px;margin-bottom:16px;display:flex;gap:10px;align-items:flex-start">
      <span style="font-size:1.5rem;line-height:1">⚠️</span>
      <div style="font-size:.85rem;color:var(--pra-white)">
        <strong style="color:var(--pra-red)">This cannot be undone.</strong><br/>
        Are you sure you want to permanently delete the entire conversation with <strong id="deleteConvoName"></strong>? Every email and text message in this thread will be erased.
      </div>
    </div>
    <div class="btn-row" style="display:flex;gap:10px">
      <button class="pra-btn" style="flex:1;background:var(--pra-red);border-color:var(--pra-red)" id="confirmDeleteConvoBtn">Yes, delete it</button>
      <button class="pra-btn pra-btn-ghost" onclick="closeModal('deleteConvoModal')">Cancel</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="chatTaskModal">
  <div class="pra-panel modal-box">
    <div class="pra-h2" style="margin-bottom:16px">New Task</div>
    <div class="pra-muted" id="chatTaskFor" style="font-size:.82rem;margin-bottom:14px"></div>
    <div class="field"><label class="pra-label">Type</label><select class="pra-select" id="chatTaskType"><option value="task">Task</option><option value="reminder">Reminder</option></select></div>
    <div class="field"><label class="pra-label">Title</label><input class="pra-input" id="chatTaskTitle"/></div>
    <div class="field-row">
      <div class="field"><label class="pra-label">Date</label><input class="pra-input" type="date" id="chatTaskDate"/></div>
      <div class="field"><label class="pra-label">Time</label><input class="pra-input" type="time" id="chatTaskTime"/></div>
    </div>
    <div class="btn-row" style="display:flex;gap:10px;margin-top:14px">
      <button class="pra-btn" id="saveChatTaskBtn" style="flex:1">Save</button>
      <button class="pra-btn pra-btn-ghost" onclick="closeModal('chatTaskModal')">Cancel</button>
    </div>
  </div>
</div>

<!-- Contact details overlay -- opened by clicking a contact's name in the
     chat panel header, instead of navigating away to contact-detail.html.
     Click the dimmed backdrop (outside the box) to dismiss, same as reading
     it and moving on. -->
<div class="modal-backdrop" id="contactOverlayModal">
  <div class="pra-panel modal-box" style="max-width:520px;max-height:88vh;overflow-y:auto">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px">
      <div class="pra-h2" id="contactOverlayName" style="flex:1;min-width:0">Contact</div>
      <a class="pra-btn pra-btn-ghost pra-btn-sm" id="ovFullPageLink" href="#">Open Full Page</a>
      <button type="button" class="pra-btn pra-btn-ghost pra-btn-sm" onclick="closeModal('contactOverlayModal')">Close</button>
    </div>
    <div class="field-row">
      <div class="field"><label class="pra-label">First name</label><input class="pra-input" id="ovFirst"/></div>
      <div class="field"><label class="pra-label">Last name</label><input class="pra-input" id="ovLast"/></div>
    </div>
    <div class="field"><label class="pra-label">Account / Company</label><input class="pra-input" id="ovAccount"/></div>
    <div class="field-row">
      <div class="field"><label class="pra-label">Email</label><input class="pra-input" type="email" id="ovEmail"/></div>
      <div class="field"><label class="pra-label">Phone</label><input class="pra-input" id="ovPhone"/></div>
    </div>
    <div class="ov-sub-label">Tags</div>
    <div id="ovTagsWrap"></div>
    <select class="pra-select" id="ovAddTagSelect" style="margin-top:8px"><option value="">+ Add a tag...</option></select>
    <div class="ov-sub-label">Lists</div>
    <div id="ovListsWrap"></div>
    <select class="pra-select" id="ovAddListSelect" style="margin-top:8px"><option value="">+ Add to a list...</option></select>
    <div class="field-row" style="margin:16px 0 0">
      <label class="pra-label" style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="ovEmailOptOut"/> Email opt-out</label>
      <label class="pra-label" style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="ovSmsOptOut"/> SMS opt-out</label>
    </div>
    <div id="ovCustomFieldsWrap"></div>
  </div>
</div>

<script src="/crm-nav.js"></script>
<script>
function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
function escapeHtml(s) { const d = document.createElement('div'); d.textContent = String(s ?? ''); return d.innerHTML; }
function fmtDate(iso) { return iso ? new Date(iso).toLocaleString() : ''; }
function fmtShort(iso) {
  if (!iso) return '';
  const d = new Date(iso), now = new Date();
  const sameDay = d.toDateString() === now.toDateString();

}

function fmtCreatedDate(iso) { return iso ? new Date(iso).toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' }) : ''; }

// Outer avatar glow, by CRM status -- lead-stage-at-a-glance in the chat list.

// A thread with one of the CRM's own staff/admin users (e.g. testing by

// is one of us", not a lead-stage signal.
function avatarStyle(status, email) {
  const isStaff = email && allUsers.some(u => u.email?.toLowerCase() === email.toLowerCase());
  const glow = isStaff ? '#009bff' : STATUS_GLOW[status];

}
const PIN_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M14.5 2.5a1.5 1.5 0 0 1 2.1 0l4.9 4.9a1.5 1.5 0 0 1 0 2.1l-2.1 2.1-1.4-1.4-3.5 3.5.5 4.6-1.6 1.6-4.2-4.2-5.4 5.4-1.1-1.1 5.4-5.4-4.2-4.2 1.6-1.6 4.6.5 3.5-3.5-1.4-1.4Z"/></svg>';

// WhatsApp-style read receipts, same as chat-app's: one grey check (sent),
// two grey checks (delivered), two blue checks (read -- an email "opened"
// event stands in for read, since SMS has no carrier-level read receipt).
function svgTick(double, color) {
  const check = 'M1 5.3L4.6 9L14.5 0.8';
  if (!double) return `<svg viewBox="0 0 16 10" width="14" height="9" fill="none"><path d="${check}" stroke="${color}" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  return `<svg viewBox="0 0 20 10" width="17" height="9" fill="none"><path d="${check}" stroke="${color}" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="${check}" transform="translate(5,0)" stroke="${color}" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

// ── Chat: conversation sidebar ───────────────────────────────────────────
async function loadConversations() {
  const list = document.getElementById('chatSidebarList');
  list.innerHTML = '<div class="pra-muted" style="padding:16px;font-size:.82rem">Loading…</div>';
  const r = await fetch('/api/inbox/conversations' + (convoChannel ? '?channel=' + convoChannel : ''));
  if (!r.ok) { list.innerHTML = '<div class="pra-muted" style="padding:16px;font-size:.82rem">Could not load.</div>'; return; }
  conversations = (await r.json()).conversations;
  renderSidebar();
  if (initialContactId) {
    const match = conversations.find(c => c.contactId === initialContactId);
    if (match) { selectConversation(match); return; }
    const contact = allContacts.find(c => c.id === initialContactId);
    if (contact) selectConversation({ key: contact.id, contactId: contact.id, contact, displayName: `${contact.first} ${contact.last}`.trim(), lastAt: null, unreadCount: 0 });
  } else if (selectedConvo) {
    const stillThere = conversations.find(c => c.key === selectedConvo.key);
    if (stillThere) selectConversation(stillThere, true);
  }
}
function renderSidebar() {
  const list = document.getElementById('chatSidebarList');
  const q = convoSearchQuery.trim().toLowerCase();
  let rows = q ? conversations.filter(c => c.displayName.toLowerCase().includes(q)) : conversations;
  // Archived conversations (opted-out / blacklisted contacts, or manually
  // archived) stay out of every other view -- there's nothing left to
  // action on them -- and only show up when Archived is explicitly selected.
  if (convoFilter === 'archived') rows = rows.filter(c => c.archived);
  else {
    rows = rows.filter(c => !c.archived);
    if (convoFilter === 'done') rows = rows.filter(c => c.done);
    else if (convoFilter === 'unresponded') rows = rows.filter(c => c.unreadCount > 0);
  }
  // Sorts by last REPLY (lastInboundAt), not last activity of any kind --
  // an automated drip send shouldn't be able to bump a cold lead above
  // someone who actually just texted back. Threads with no reply yet sort
  // to the bottom of "Newest first" / top of "Oldest first".
  rows = [...rows].sort((a, b) => {
    if (!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
    if (!a.lastInboundAt || !b.lastInboundAt) {
      if (!a.lastInboundAt && !b.lastInboundAt) return convoSort === 'oldest' ? new Date(a.lastAt) - new Date(b.lastAt) : new Date(b.lastAt) - new Date(a.lastAt);
      return (a.lastInboundAt ? -1 : 1) * (convoSort === 'oldest' ? -1 : 1);
    }
    return convoSort === 'oldest' ? new Date(a.lastInboundAt) - new Date(b.lastInboundAt) : new Date(b.lastInboundAt) - new Date(a.lastInboundAt);
  });
  if (!rows.length) { list.innerHTML = `<div class="pra-muted" style="padding:16px;font-size:.82rem">${q ? 'No matches.' : 'No conversations yet.'}</div>`; return; }
  list.innerHTML = rows.map(c => {
    const hasUnread = c.unreadCount > 0;
    const showTicks = !hasUnread && c.lastDirection === 'outbound' && c.lastStatus;
    const previewTicks = showTicks ? readReceiptTicksHtml(c.lastStatus, c.lastOpened) : '';
    const previewText = escapeHtml((c.lastPreview || '').replace(/<[^>]+>/g, ' ')).trim().slice(0, 56);
    return `
    <div class="convo-row${selectedConvo?.key === c.key ? ' selected' : ''}${c.pinned ? ' pinned' : ''}" data-convo="${c.key}">
      <div class="pra-avatar convo-avatar${hasUnread ? ' has-unread' : ''}" style="${avatarStyle(c.contact?.status, c.contact?.email)}">${initials(c.displayName)}</div>
      <div class="convo-meta">
        <div class="convo-top">
          ${c.pinned ? `<span class="convo-pinned-mark" title="Pinned">${PIN_ICON}</span>` : ''}
          <span class="convo-name">${escapeHtml(c.displayName)}</span>
        </div>
        <div class="convo-preview">${c.lastDirection === 'outbound' ? previewTicks + ' You: ' : ''}${previewText}</div>
        ${!c.contactId ? '<button class="pra-btn pra-btn-ghost pra-btn-sm convo-add-btn" data-add-contact type="button">+ Add Contact</button>' : ''}
      </div>
      <div class="convo-side">
        <div class="convo-time${hasUnread ? ' has-unread' : ''}">${fmtShort(c.lastAt)}</div>
        <div class="convo-actions-row">
          ${c.contactId ? `<button class="convo-icon-btn pin-btn${c.pinned ? ' on' : ''}" data-pin="${c.contactId}" data-pin-on="${c.pinned ? '0' : '1'}" title="${c.pinned ? 'Unpin' : 'Pin to top'}">${PIN_ICON}</button>` : ''}
          ${c.contactId ? `<button class="convo-icon-btn star-btn${c.starred ? ' on' : ''}" data-star="${c.contactId}" data-star-on="${c.starred ? '0' : '1'}" title="${c.starred ? 'Unstar' : 'Star'}">${STAR_ICON}</button>` : ''}
          ${hasUnread ? `<div class="convo-unread-badge">${c.unreadCount > 99 ? '99+' : c.unreadCount}</div>` : ''}
        </div>
      </div>
    </div>
  `; }).join('');
  list.querySelectorAll('[data-convo]').forEach(row => row.onclick = (e) => {
    if (row.dataset.longPress) { delete row.dataset.longPress; return; }
    if (e.target.closest('[data-add-contact], [data-pin], [data-star]')) return;
    const c = conversations.find(x => x.key === row.dataset.convo);
    if (c.contactId) selectConversation(c);
  });
  list.querySelectorAll('[data-convo]').forEach(row => {
    const c = () => conversations.find(x => x.key === row.dataset.convo);
    row.addEventListener('contextmenu', (e) => { e.preventDefault(); openContextMenu(c(), e.clientX, e.clientY); });
    row.addEventListener('touchstart', (e) => {
      const touch = e.touches[0];
      longPressTimer = setTimeout(() => { row.dataset.longPress = '1'; openContextMenu(c(), touch.clientX, touch.clientY); }, 500);
    }, { passive: true });
    row.addEventListener('touchend', () => clearTimeout(longPressTimer));
    row.addEventListener('touchmove', () => clearTimeout(longPressTimer));
  });
  list.querySelectorAll('[data-add-contact]').forEach(btn => btn.onclick = (e) => {
    e.stopPropagation();
    const row = e.target.closest('[data-convo]');
    const c = conversations.find(x => x.key === row.dataset.convo);
    openConfirmPotential(c);
  });
  list.querySelectorAll('[data-pin]').forEach(btn => btn.onclick = async (e) => {
    e.stopPropagation();
    const pinned = btn.dataset.pinOn === '1';
    await fetch(`/api/inbox/conversations/${btn.dataset.pin}/pin`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pinned }) });
    const c = conversations.find(x => x.contactId === btn.dataset.pin);
    if (c) c.pinned = pinned;
    conversations.sort((a, b) => (!!a.pinned !== !!b.pinned) ? (a.pinned ? -1 : 1) : new Date(b.lastAt) - new Date(a.lastAt));
    renderSidebar();
  });
  list.querySelectorAll('[data-star]').forEach(btn => btn.onclick = async (e) => {

    if (c) c.starred = starred;
    renderSidebar();
  });
}

  document.getElementById('ctxDoneBtn').style.display = c.contactId ? '' : 'none';

  document.getElementById('ctxArchiveBtn').style.display = c.contactId ? '' : 'none';
  document.getElementById('ctxBlacklistBtn').style.display = c.contactId ? '' : 'none';

// Opens/clicks only ever apply to OUTBOUND email -- there's nothing to
// track on an inbound message or an SMS (no click data exists for SMS
// yet; see readReceiptTicksHtml's own comment on why SMS read-state stops
// at "delivered"). Skipped entirely (not "0%") when there's no outbound
// email to measure yet, since 0% reads as "everyone ignored you" when the
// real story is "nothing's been sent."
function emailStatsHtml(items) {
  const sent = items.filter(i => i.itemType === 'email' && i.direction === 'outbound');
  if (!sent.length) return '';
  const opened = sent.filter(i => (i.statusHistory || []).some(h => h.status === 'opened')).length;
  const clicked = sent.filter(i => (i.statusHistory || []).some(h => h.status === 'clicked')).length;
  const pct = (n) => Math.round((n / sent.length) * 100);
  return `
    <div class="track-summary">
      <span><b>${sent.length}</b> email${sent.length === 1 ? '' : 's'} sent</span>
      <span class="${opened ? 'on' : ''}"><b>${opened}</b> opened (${pct(opened)}%)</span>
      <span class="${clicked ? 'on' : ''}"><b>${clicked}</b> clicked (${pct(clicked)}%)</span>
    </div>
  `;
}

      ` : ''}
      ${composeChannel === 'email' ? `<input class="pra-input" id="composeSubject" placeholder="Subject" style="margin-bottom:8px"/>` : ''}
      <div class="compose-row">
        <textarea class="pra-textarea" id="composeBody" placeholder="${composeChannel === 'email' ? 'Write an email…' : 'Write a text message…'}"></textarea>
        <button class="pra-btn" id="composeSendBtn">Send</button>
      </div>
      ${composeChannel === 'email' && !emailOk ? '<div class="compose-hint">This contact has no email on file.</div>' : ''}
      ${composeChannel === 'sms' && !smsOk ? '<div class="compose-hint">This contact has no phone number on file.</div>' : ''}
    </div>
  `;
  const items = [...threadItems].filter(i => ['email', 'sms', 'form', 'booking'].includes(i.itemType)).sort((a, b) => new Date(a.at) - new Date(b.at));
  const threadEl = document.getElementById('chatThread');
  threadEl.innerHTML = items.length ? items.map((item, idx) => item.itemType === 'email' ? emailBubbleHtml(item, idx) : item.itemType === 'sms' ? smsBubbleHtml(item) : noteBubbleHtml(item)).join('') : '<div class="pra-muted" style="text-align:center;padding:30px">No messages yet.</div>';
  threadEl.querySelectorAll('[data-email-toggle]').forEach(el => el.onclick = () => {
    const wasExpanded = el.classList.contains('expanded');
    el.classList.toggle('expanded');
    if (!wasExpanded) {
      const iframe = el.querySelector('iframe');
      const item = items[Number(el.dataset.emailToggle)];
      // Force Arial regardless of whatever font the source HTML specifies
      // inline (Close-imported emails carry their own inline styles) --
      // !important is the only way to reliably win against those.
      if (iframe && !iframe.srcdoc) iframe.srcdoc = `<style>body,*{font-family:Arial,Helvetica,sans-serif!important;}</style>${item.body || '<p style="color:#888">(no content stored)</p>'}`;
    }
  });
  threadEl.scrollTop = threadEl.scrollHeight;

  if (currentTab === 'primary') {
    panel.querySelectorAll('.compose-channel-toggle button').forEach(btn => btn.onclick = () => { composeChannel = btn.dataset.ch; renderThread(); });
  }
  document.getElementById('composeSendBtn').onclick = sendComposeMessage;
  document.getElementById('chatBackBtn').onclick = backToConvoList;
  document.getElementById('chatAddTaskBtn').onclick = () => openChatTaskModal(c);
  if (c.contactId) document.getElementById('chatPanelNameLink').onclick = () => openContactOverlay(c.contactId);
  document.getElementById('chatStatusSelect').addEventListener('change', async (e) => {
    const status = e.target.value;
    if (!status || !c.contactId) return;
    await fetch('/api/contacts/' + c.contactId, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status }) });
    showToast('Status updated');
    e.target.setAttribute('style', `max-width:200px;${avatarStyle(status)}`);
    await loadRefs();
    // A status change can auto-archive the conversation (STOP / Bad Fit &
    // Blacklist) -- loadRefs() only refreshes contacts/statuses/users, not
    // the conversation list itself, so without this the row would keep
    // showing in the sidebar (stale local `conversations` array) even
    // though the backend already archived it.
    await loadConversations();
  });

  // Selecting a conversation is as close as this Inbox gets to "read" --
  // clear its unread badge the same way opening the old detail modal did.
  // Updates local state + re-renders just the sidebar rather than
  // reloading and re-selecting the conversation -- doing the latter here
  // re-triggers this same code path on every load, which (combined with a
  // now-fixed backend bug that always reported messages as unread) spun
  // into an infinite select-mark-reload loop.
  const unread = items.filter(i => i.direction === 'inbound' && !i.done);
  if (unread.length) {
    markDone(unread.map(i => i.id), true);
    const inList = conversations.find(x => x.key === c.key);
    if (inList) inList.unreadCount = 0;
    renderSidebar();
  }
}
async function selectConversation(c, skipFetch) {
  selectedConvo = c;
  document.querySelectorAll('.convo-row').forEach(r => r.classList.toggle('selected', r.dataset.convo === c.key));
  document.getElementById('chatView').classList.add('thread-open'); // mobile: swap to the chat panel
  if (!c.contactId) return;
  const r = await fetch('/api/inbox/contact/' + c.contactId);
  threadItems = r.ok ? (await r.json()).items : [];
  renderThread();
}
function backToConvoList() { document.getElementById('chatView').classList.remove('thread-open'); }
async function sendComposeMessage() {
  const body = document.getElementById('composeBody').value.trim();
  if (!body || !selectedConvo?.contactId) return;
  const subject = composeChannel === 'email' ? document.getElementById('composeSubject').value.trim() : undefined;
  const btn = document.getElementById('composeSendBtn');
  btn.disabled = true; btn.textContent = 'Sending…';
  const r = await fetch('/api/inbox/send', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ contactId: selectedConvo.contactId, channel: composeChannel, subject, body }),
  });
  const d = await r.json();
  btn.disabled = false; btn.textContent = 'Send';
  if (!r.ok) { showToast(d.error || 'Send failed', true); return; }
  showToast('Sent');
  const threadRes = await fetch('/api/inbox/contact/' + selectedConvo.contactId);
  threadItems = threadRes.ok ? (await threadRes.json()).items : [];
  renderThread();
  loadConversations();
}

// ── Contact details overlay ──────────────────────────────────────────────
// Same field set as contact-detail.html's Details panel, kept in sync
// manually (separate static pages, no shared JS) -- opened from the chat
// panel's name link instead of navigating away. No Delete Contact here on
// purpose: a quick popup shouldn't carry a destructive action -- "Open Full
// Page" is there for that.
let overlayContact = null, overlayTags = [], overlayLists = [], overlayFields = [];
async function openContactOverlay(contactId) {
  const [tagsRes, listsRes, fieldsRes, contactRes] = await Promise.all([
    fetch('/api/tags'), fetch('/api/lists'), fetch('/api/custom-fields?entityType=contact'), fetch('/api/contacts/' + contactId)
  ]);
  overlayTags = tagsRes.ok ? (await tagsRes.json()).tags : [];
  overlayLists = listsRes.ok ? (await listsRes.json()).lists : [];
  overlayFields = fieldsRes.ok ? (await fieldsRes.json()).fields : [];
  if (!contactRes.ok) { showToast('Could not load contact', true); return; }
  overlayContact = (await contactRes.json()).contact;
  document.getElementById('contactOverlayName').textContent = `${overlayContact.first} ${overlayContact.last}`.trim() || 'Contact';
  document.getElementById('ovFirst').value = overlayContact.first || '';
  document.getElementById('ovLast').value = overlayContact.last || '';
  document.getElementById('ovAccount').value = overlayContact.accountName || '';
  document.getElementById('ovEmail').value = overlayContact.email || '';
  document.getElementById('ovPhone').value = overlayContact.phone || '';
  document.getElementById('ovEmailOptOut').checked = !!overlayContact.emailOptOut;
  document.getElementById('ovSmsOptOut').checked = !!overlayContact.smsOptOut;
  document.getElementById('ovFullPageLink').href = '/contact-detail.html?id=' + contactId;
  renderOverlayTags();
  renderOverlayLists();
  renderOverlayCustomFields();
  openModal('contactOverlayModal');
}
// No Save button -- every field PATCHes immediately on change, same
// pattern as contact-detail.html's Details panel.
async function autoSaveOverlay() {
  const r = await fetch('/api/contacts/' + overlayContact.id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(overlayContact) });
  if (!r.ok) { showToast('Could not save', true); return; }
  overlayContact = (await r.json()).contact;
  showToast('Saved');
  await loadRefs();
  await loadConversations(); // re-selects the open conversation if it's still selectedConvo/initialContactId, refreshing the header
}
function renderOverlayTags() {
  const wrap = document.getElementById('ovTagsWrap');
  wrap.innerHTML = (overlayContact.tags || []).map(tagId => {
    const t = overlayTags.find(x => x.id === tagId);
    if (!t) return '';
    return `<span class="tag-pill">${escapeHtml(t.name)}<button data-tag="${tagId}" class="ovRemoveTag" type="button">&times;</button></span>`;
  }).join('') || '<span class="pra-muted" style="font-size:.82rem">No tags yet.</span>';
  wrap.querySelectorAll('.ovRemoveTag').forEach(btn => btn.onclick = async () => {
    overlayContact.tags = overlayContact.tags.filter(id => id !== btn.dataset.tag);
    await autoSaveOverlay();
    renderOverlayTags();
  });
  const sel = document.getElementById('ovAddTagSelect');
  sel.innerHTML = '<option value="">+ Add a tag...</option>' + overlayTags.filter(t => !overlayContact.tags.includes(t.id)).map(t => `<option value="${t.id}">${escapeHtml(t.name)}</option>`).join('');
}
document.getElementById('ovAddTagSelect').addEventListener('change', async (e) => {
  if (!e.target.value) return;
  overlayContact.tags.push(e.target.value);
  await autoSaveOverlay();
  renderOverlayTags();
  e.target.value = '';
});
function renderOverlayLists() {
  const wrap = document.getElementById('ovListsWrap');
  wrap.innerHTML = (overlayContact.listIds || []).map(listId => {
    const l = overlayLists.find(x => x.id === listId);
    if (!l) return '';
    return `<span class="tag-pill">${escapeHtml(l.name)}<button data-list="${listId}" class="ovRemoveList" type="button">&times;</button></span>`;
  }).join('') || '<span class="pra-muted" style="font-size:.82rem">Not on any lists.</span>';
  wrap.querySelectorAll('.ovRemoveList').forEach(btn => btn.onclick = async () => {
    overlayContact.listIds = overlayContact.listIds.filter(id => id !== btn.dataset.list);
    await autoSaveOverlay();
    renderOverlayLists();
  });
  const sel = document.getElementById('ovAddListSelect');
  sel.innerHTML = '<option value="">+ Add to a list...</option>' + overlayLists.filter(l => !overlayContact.listIds.includes(l.id)).map(l => `<option value="${l.id}">${escapeHtml(l.name)}</option>`).join('');
}
document.getElementById('ovAddListSelect').addEventListener('change', async (e) => {
  if (!e.target.value) return;
  overlayContact.listIds.push(e.target.value);
  await autoSaveOverlay();
  renderOverlayLists();
  e.target.value = '';
});
function renderOverlayCustomFields() {
  const wrap = document.getElementById('ovCustomFieldsWrap');
  if (!overlayFields.length) { wrap.innerHTML = ''; return; }
  wrap.innerHTML = overlayFields.map(f => `
    <div class="field"><label class="pra-label">${escapeHtml(f.label)}</label>
      <input class="pra-input ov-custom-field-input" data-field="${f.id}" value="${escapeHtml(overlayContact.customFields?.[f.id] || '')}"/>
    </div>
  `).join('');
  wrap.querySelectorAll('.ov-custom-field-input').forEach(inp => inp.addEventListener('change', collectAndAutoSaveOverlay));
}
async function collectAndAutoSaveOverlay() {
  overlayContact.first = document.getElementById('ovFirst').value.trim();
  overlayContact.last = document.getElementById('ovLast').value.trim();
  overlayContact.accountName = document.getElementById('ovAccount').value.trim();
  overlayContact.email = document.getElementById('ovEmail').value.trim();
  overlayContact.phone = document.getElementById('ovPhone').value.trim();
  overlayContact.emailOptOut = document.getElementById('ovEmailOptOut').checked;
  overlayContact.smsOptOut = document.getElementById('ovSmsOptOut').checked;
  overlayContact.customFields = overlayContact.customFields || {};
  document.querySelectorAll('.ov-custom-field-input').forEach(inp => { overlayContact.customFields[inp.dataset.field] = inp.value; });
  await autoSaveOverlay();
  document.getElementById('contactOverlayName').textContent = `${overlayContact.first} ${overlayContact.last}`.trim() || 'Contact';
}
['ovFirst', 'ovLast', 'ovAccount', 'ovEmail', 'ovPhone', 'ovEmailOptOut', 'ovSmsOptOut'].forEach(id => document.getElementById(id).addEventListener('change', collectAndAutoSaveOverlay));
// Click the dimmed backdrop itself (not the box) to dismiss -- e.target is
// only the backdrop element when the click didn't land on a descendant.
document.getElementById('contactOverlayModal').addEventListener('click', (e) => {
  if (e.target.id === 'contactOverlayModal') closeModal('contactOverlayModal');
});

// ── Flat list (Tasks / Reminders) ───────────────────────────────────────
function itemHtml(item) {
  const nameText = item.contact ? `${escapeHtml(item.contact.first)} ${escapeHtml(item.contact.last)}` : 'Unknown';
  const isDone = !!item.done;
  return `
    <div class="inbox-item">
      <input type="checkbox" class="item-check" data-select="${item.id}" ${selectedIds.has(item.id) ? 'checked' : ''}/>
      <div class="item-icon ${item.itemType}">${item.itemType === 'reminder' ? '⏰' : '☑'}</div>
      <div class="item-body">
        <div class="item-name">${nameText}</div>
        <div class="item-preview">${escapeHtml(item.title || '')}</div>
      </div>
      <div class="item-time">${fmtDate(item.at)}</div>
      <button class="item-done-btn" data-quick-done="${item.id}" title="${isDone ? 'Mark not done' : 'Mark done'}">${isDone ? '&#8635;' : '&#10003;'}</button>
    </div>
  `;
}
function sortItems(items) {
  const sorted = [...items];
  if (currentSort === 'name') sorted.sort((a, b) => (a.contact ? `${a.contact.first} ${a.contact.last}` : '').localeCompare(b.contact ? `${b.contact.first} ${b.contact.last}` : ''));
  else if (currentSort === 'asc') sorted.sort((a, b) => new Date(a.at) - new Date(b.at));
  else sorted.sort((a, b) => new Date(b.at) - new Date(a.at));
  return sorted;
}
function updateBulkActions() {
  const bar = document.getElementById('bulkActions');
  if (selectedIds.size) { bar.style.display = 'flex'; document.getElementById('selectedCount').textContent = selectedIds.size + ' selected'; }
  else bar.style.display = 'none';
}
function renderItemsPanel() {
  const panel = document.getElementById('itemsPanel');
  panel.innerHTML = currentItems.length ? currentItems.map(itemHtml).join('') : '<div class="pra-muted" style="padding:20px">Nothing here.</div>';
  panel.querySelectorAll('[data-select]').forEach(chk => chk.onchange = () => {
    if (chk.checked) selectedIds.add(chk.dataset.select); else selectedIds.delete(chk.dataset.select);
    updateBulkActions();
  });
  panel.querySelectorAll('[data-quick-done]').forEach(btn => btn.onclick = async () => {
    const item = currentItems.find(i => i.id === btn.dataset.quickDone);
    await markDone([btn.dataset.quickDone], !item?.done);
    loadItems();
  });
}
async function markDone(ids, done) {
  if (!ids.length) return;
  await fetch('/api/inbox/mark-done', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ids, done }) });
}
async function loadItems() {
  const panel = document.getElementById('itemsPanel');
  panel.innerHTML = '<div class="pra-muted" style="padding:20px">Loading…</div>';
  selectedIds.clear();
  updateBulkActions();
  const r = await fetch(`/api/inbox?tab=${currentTab}&view=${currentView}`);
  if (!r.ok) { panel.innerHTML = '<div class="pra-muted" style="padding:20px">Could not load.</div>'; return; }
  const { items } = await r.json();
  currentItems = sortItems(items);
  renderItemsPanel();
}
document.getElementById('bulkDoneBtn').onclick = async () => { await markDone([...selectedIds], true); showToast('Marked done'); loadItems(); };
document.getElementById('viewSelect').addEventListener('change', (e) => { currentView = e.target.value; loadItems(); });
document.getElementById('sortSelect').addEventListener('change', (e) => { currentSort = e.target.value; currentItems = sortItems(currentItems); renderItemsPanel(); });

// ── Resizable sidebar/chat-panel split ───────────────────────────────────
// Remembered per-browser (not per-account -- this is a local layout
// preference, not data) so it stays put across reloads. The mobile
// breakpoint's `width: 100% !important` (see CSS) wins over this inline
// style regardless of whatever was last dragged/saved on desktop.
const SIDEBAR_WIDTH_KEY = 'inboxSidebarWidth';
const SIDEBAR_MIN_WIDTH = 220, SIDEBAR_MAX_WIDTH = 560;
(function setupChatResize() {
  const sidebar = document.querySelector('.chat-sidebar');
  const handle = document.getElementById('chatResizeHandle');
  const saved = parseInt(localStorage.getItem(SIDEBAR_WIDTH_KEY), 10);
  if (saved && saved >= SIDEBAR_MIN_WIDTH && saved <= SIDEBAR_MAX_WIDTH) sidebar.style.width = saved + 'px';

  let dragging = false, startX = 0, startWidth = 0;
  handle.addEventListener('pointerdown', (e) => {
    dragging = true; startX = e.clientX; startWidth = sidebar.getBoundingClientRect().width;
    handle.classList.add('dragging');
    handle.setPointerCapture(e.pointerId);
    document.body.style.userSelect = 'none';
  });
  handle.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const width = Math.min(SIDEBAR_MAX_WIDTH, Math.max(SIDEBAR_MIN_WIDTH, startWidth + (e.clientX - startX)));
    sidebar.style.width = width + 'px';
  });
  const stopDrag = () => {
    if (!dragging) return;
    dragging = false;
    handle.classList.remove('dragging');
    document.body.style.userSelect = '';
    localStorage.setItem(SIDEBAR_WIDTH_KEY, Math.round(sidebar.getBoundingClientRect().width));
  };
  handle.addEventListener('pointerup', stopDrag);
  handle.addEventListener('pointercancel', stopDrag);
})();

(async function init() {
  await loadRefs();
  await loadConversations();
})();
</script>

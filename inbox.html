<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Inbox — CRM</title>
<link rel="stylesheet" href="/crm-design-system.css"/>
<style>
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; border-bottom: 1px solid var(--pra-border); flex-wrap: wrap; align-items: center; }
  .tab-btn { background: none; border: none; color: var(--pra-dim); font-family: var(--font-primary); font-weight: 700; font-size: .84rem; padding: 10px 14px; cursor: pointer; border-bottom: 2px solid transparent; }
  .tab-btn.active { color: var(--pra-white); border-bottom-color: var(--pra-blue); }

  /* ── Flat list (Tasks / Reminders) ── */
  .inbox-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .inbox-toolbar select { max-width: 160px; }
  .bulk-actions { display: flex; align-items: center; gap: 8px; }
  .inbox-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--pra-border); }
  .inbox-item:last-child { border-bottom: none; }
  .item-check { flex-shrink: 0; cursor: pointer; width: 16px; height: 16px; }
  .item-icon { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: .8rem; flex-shrink: 0; }
  .item-icon.task, .item-icon.reminder { background: rgba(255,193,7,0.15); color: #ffc107; }
  .item-body { flex: 1; min-width: 0; }
  .item-name { font-size: .88rem; }
  .item-preview { font-size: .8rem; color: var(--pra-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-time { font-size: .74rem; color: var(--pra-dim); white-space: nowrap; }
  .item-done-btn { background: none; border: 1px solid var(--pra-border); color: var(--pra-dim); border-radius: 6px; width: 28px; height: 28px; cursor: pointer; flex-shrink: 0; font-size: .8rem; }
  .item-done-btn:hover { border-color: var(--pra-green); color: var(--pra-green); }
  .inbox-row { cursor: pointer; transition: background .1s; }
  .inbox-row:hover { background: rgba(255,255,255,0.03); }

  /* ── Chat shell ── */
  /* height set twice on purpose -- vh fallback, dvh (real visible
     viewport, not mobile's "largest possible" 100vh) wins when supported.
     Without this the compose bar at the bottom can render below the
     actually-visible screen whenever the address bar is showing. */
  .chat-shell { display: flex; height: calc(100vh - 190px); height: calc(100dvh - 190px); min-height: 420px; border: 1px solid var(--pra-border); border-radius: 10px; overflow: hidden; }
  .chat-sidebar { width: 300px; flex-shrink: 0; background: var(--pra-panel); display: flex; flex-direction: column; min-width: 0; }
  /* Drag handle between the conversation list and the chat panel -- the
     border that used to sit on .chat-sidebar itself moved onto this, since
     the handle needs its own hit area (6px) wider than a 1px visual line. */
  .chat-resize-handle { width: 6px; flex-shrink: 0; cursor: col-resize; position: relative; background: transparent; }
  .chat-resize-handle::after { content: ''; position: absolute; top: 0; bottom: 0; left: 2px; width: 1px; background: var(--pra-border); }
  .chat-resize-handle:hover::after, .chat-resize-handle.dragging::after { left: 0; width: 6px; background: var(--pra-blue); opacity: .5; }
  .chat-sidebar-search { padding: 10px; border-bottom: 1px solid var(--pra-border); flex-shrink: 0; }
  .convo-list { flex: 1; overflow-y: auto; }

  .convo-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--pra-border); cursor: pointer; }
  .convo-row:hover { background: rgba(255,255,255,0.03); }
  .convo-row.selected { background: var(--pra-blue-dim); border-left: 3px solid var(--pra-blue); padding-left: 9px; }
  .convo-row.pinned { background: rgba(0,155,255,0.04); }
  /* Outer glow color is set inline per row (--status-glow, from the
     contact's CRM status -- see STATUS_GLOW below); background flips to
     the brightest neon green specifically for an unresponded thread,
     overriding the status color so "needs a reply" always reads at a
     glance regardless of what status the lead is in. */
  .convo-avatar { box-shadow: 0 0 0 2px var(--status-glow, transparent), 0 0 9px 2px var(--status-glow-soft, transparent); transition: box-shadow .15s, background .15s; }
  .convo-avatar.has-unread { background: #39ff14; color: #0a0a0d; }
  #chatStatusSelect, .convo-status-select { box-shadow: 0 0 0 2px var(--status-glow, transparent), 0 0 9px 2px var(--status-glow-soft, transparent); transition: box-shadow .15s; }
  /* No flex-shrink:0 here (unlike the type badge/date below) and a real
     max-width -- statusSelectWidthRule's inline width can run past 300px
     for the longest status label ("FOLLOW UP (They have a Task / Date
     set)" alone is 48ch), which on a resized-narrow sidebar was eating the
     ENTIRE row and squeezing the name to a computed 0px width. Letting it
     shrink (like .owner-field-select already does via its own max-width in
     crm-design-system.css) means status/assigned give ground before the
     name does, not after. */
  .convo-status-select { font-size: .72rem; padding: 2px 20px 2px 6px; max-width: 100px; }
  /* Two rows, both plain single-line flex rows (never wrap) -- row 1 is
     identity + metadata (name, status, assigned, type, time), row 2 is the
     message preview + pin/star. Name and preview are the only two elements
     that actually FLEX (min-width:0 + ellipsis); everything else here is
     flex-shrink:0 with a small fixed/capped size, so they never eat into
     the name or preview's space no matter how narrow the row gets. */
  .convo-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .convo-top { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; }
  .convo-pinned-mark { flex-shrink: 0; color: var(--pra-blue); display: inline-flex; }
  .convo-pinned-mark svg { width: 11px; height: 11px; }
  /* min-width isn't 0 here on purpose -- the name is the one thing in this
     row with no other way to identify who it is (status has its glow
     color, the rest are secondary metadata), so it gets a guaranteed floor
     instead of being the only element that shrinks all the way to nothing
     when the row is tight. */
  .convo-name { font-weight: 700; font-size: .86rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 44px; }
  .convo-time { font-size: .68rem; color: var(--pra-dim); white-space: nowrap; flex-shrink: 0; }
  .convo-time.has-unread { color: #39ff14; font-weight: 700; }
  .convo-bottom { display: flex; align-items: center; gap: 4px; }
  .convo-preview { font-size: .78rem; font-weight: 400; color: var(--pra-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0; }
  .convo-preview .bubble-ticks { display: inline-flex; flex-shrink: 0; }
  .convo-icon-btn { width: 22px; height: 22px; border-radius: 5px; border: none; background: transparent; color: var(--pra-dim); cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: .5; flex-shrink: 0; }
  .convo-icon-btn:hover { opacity: 1; }
  .convo-icon-btn.on { opacity: 1; }
  .convo-icon-btn.pin-btn.on { color: var(--pra-blue); }
  .convo-icon-btn.star-btn.on { color: #ffd54a; }
  .convo-icon-btn svg { width: 14px; height: 14px; }
  .convo-unread-badge { background: #39ff14; color: #0a0a0d; font-family: var(--font-secondary); font-size: .68rem; font-weight: 700; min-width: 18px; height: 18px; border-radius: 9px; display: flex; align-items: center; justify-content: center; padding: 0 5px; flex-shrink: 0; }
  .convo-add-btn { flex-shrink: 0; }

  /* ── Mobile: single-pane, same pattern as chat-app's chat.html ── */
  @media (max-width: 900px) {
    /* 195px, not the desktop rule's 160px -- .mobile-sticky-header adds
       ~28px of padding/margin below the title+tabs that the 160px estimate
       predates. dvh (real visible viewport) wins over vh when supported. */
    .chat-shell { height: calc(100vh - 195px); height: calc(100dvh - 195px); }
    .chat-sidebar { width: 100% !important; }
    .chat-resize-handle { display: none; }
    #chatView.thread-open .chat-sidebar { display: none; }
    #chatView:not(.thread-open) .chat-panel { display: none; }
    .chat-back-btn { display: inline-flex !important; }

    /* Status/assigned shrink hard on mobile -- a native select can't be
       squeezed by flex alone (intrinsic content width), so this caps the
       mobile-select-enhancer's replacement button instead (crm-nav.js
       snapshots this max-width when it builds that button). Their own
       label already ellipsizes inside that width (.mobile-select-trigger-
       label), so "FOLLOW UP (They have a Task / Date set)" still reads as
       "F..." rather than pushing the row wider -- the status GLOW color is
       what actually communicates status at a glance on mobile; the select
       is there to change it, not to be read as text. Genuinely tight (46px)
       on purpose: on a 375px phone, six items competing for one line means
       every pixel these don't take is a pixel the name gets back, and the
       name is the one thing here that has no other way to be identified. */
    .convo-top { gap: 4px; }
    .convo-status-select, .convo-owner-field { max-width: 46px; font-size: .64rem; padding: 2px 14px 2px 4px; }
    .convo-row [data-type-badge] { max-width: 30px; overflow: hidden; text-overflow: ellipsis; padding: 2px 5px !important; }
    .convo-time { font-size: .64rem; }
  }
  .chat-back-btn { display: none; background: none; border: none; color: var(--pra-white); font-size: 1.3rem; cursor: pointer; padding: 0 2px 0 0; flex-shrink: 0; }

  .chat-panel { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--pra-black-soft); }
  .chat-panel-header { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--pra-border); flex-shrink: 0; }
  .chat-panel-name-row { display: flex; align-items: center; gap: 8px; }
  .chat-panel-name { font-weight: 700; font-size: .95rem; color: var(--pra-white); text-decoration: none; cursor: pointer; }
  .chat-panel-name:hover { color: var(--pra-blue); text-decoration: underline; }
  .chat-panel-created { font-size: .72rem; font-weight: 400; color: var(--pra-dim); white-space: nowrap; }
  .chat-panel-sub { font-size: .74rem; color: var(--pra-dim); }
  .chat-empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--pra-dim); font-size: .88rem; }

  .chat-thread { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .bubble-row { display: flex; }
  .bubble-row.outbound { justify-content: flex-end; }
  .bubble-row.inbound { justify-content: flex-start; }
  /* max-width belongs on this wrapper, not .sms-bubble itself -- a
     percentage max-width on a descendant of an auto-width flex item can't
     resolve during the item's own intrinsic-size pass, so the flex item
     (and therefore the bubble) silently fills the entire row instead of
     shrinking to its content, which made every outbound bubble render
     flush left like an inbound one despite the correct blue color/class. */
  .bubble-content { max-width: 62%; }
  .sms-bubble { max-width: 100%; padding: 9px 13px; border-radius: 14px; font-size: .87rem; font-weight: 400; line-height: 1.4; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bubble-row.outbound .sms-bubble { background: var(--pra-blue); color: #fff; border-bottom-right-radius: 3px; }
  .bubble-row.inbound .sms-bubble { background: var(--pra-panel-2); color: var(--pra-dim); border: 1px solid var(--pra-border); border-bottom-left-radius: 3px; }
  .bubble-time { font-size: .64rem; color: var(--pra-dim); margin-top: 3px; }
  .bubble-row.outbound .bubble-time { text-align: right; }

  .email-bubble { width: 100%; max-width: 90%; border: 1px solid var(--pra-border); border-radius: 10px; overflow: hidden; cursor: pointer; }
  .bubble-row.outbound .email-bubble { margin-left: auto; border-color: rgba(0,155,255,0.4); }
  .email-bubble-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--pra-panel-2); }
  .email-bubble-icon { flex-shrink: 0; }
  .email-bubble-subject { font-weight: 700; font-size: .85rem; color: var(--pra-dim); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .email-bubble-preview { font-size: .8rem; font-weight: 400; color: var(--pra-dim); padding: 8px 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .email-bubble.expanded .email-bubble-preview { display: none; }
  .email-bubble-body { display: none; background: #fff; }
  .email-bubble.expanded .email-bubble-body { display: block; }
  .email-bubble-body iframe { width: 100%; min-height: 260px; border: none; display: block; }
  .email-bubble-meta { display: flex; align-items: center; gap: 10px; padding: 6px 14px; font-size: .68rem; font-weight: 400; color: var(--pra-dim); border-top: 1px solid var(--pra-border); flex-wrap: wrap; }

  .note-bubble { border: 1px solid var(--pra-border); border-radius: 10px; overflow: hidden; }
  .note-bubble-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--pra-panel-2); font-weight: 700; font-size: .85rem; }
  .note-bubble-body { font-size: .8rem; color: var(--pra-dim); padding: 8px 14px; white-space: pre-wrap; overflow-wrap: anywhere; border-top: 1px solid var(--pra-border); }
  .note-bubble .bubble-time { padding: 0 14px 10px; }
  .track-badge { display: inline-flex; align-items: center; gap: 3px; font-size: .66rem; font-weight: 700; padding: 2px 8px; border-radius: 9px; background: rgba(255,255,255,0.05); color: var(--pra-dim); }
  .track-badge.on { background: rgba(57,255,20,0.16); color: #39ff14; box-shadow: 0 0 6px rgba(57,255,20,0.35); }

  .track-summary { display: flex; align-items: center; gap: 12px; padding: 8px 18px; border-bottom: 1px solid var(--pra-border); font-size: .74rem; color: var(--pra-dim); flex-shrink: 0; }
  .track-summary b { color: var(--pra-white); }
  .track-summary .on { color: #39ff14; }

  .compose-bar { border-top: 1px solid var(--pra-border); padding: 12px 16px; flex-shrink: 0; }
  .ai-draft-card { margin: 0 16px 12px; padding: 12px; border: 1px solid rgba(0,155,255,.35); background: rgba(0,155,255,.06); border-radius: 10px; }
  .ai-draft-label { display: flex; align-items: center; gap: 6px; font-size: .78rem; color: var(--pra-blue); margin-bottom: 8px; font-weight: 600; }
  .ai-draft-label svg { width: 14px; height: 14px; flex-shrink: 0; }
  .ai-draft-text { width: 100%; min-height: 70px; margin-bottom: 8px; }
  .ai-draft-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .ai-draft-actions .compose-channel-toggle { margin-bottom: 0; }
  .compose-channel-toggle { display: inline-flex; border: 1px solid var(--pra-border); border-radius: 8px; overflow: hidden; margin-bottom: 8px; }
  .compose-channel-toggle button { background: none; border: none; color: var(--pra-dim); font-size: .76rem; font-weight: 700; padding: 5px 12px; cursor: pointer; }
  .compose-channel-toggle button.active { background: var(--pra-blue-dim); color: var(--pra-blue); }
  .compose-row { display: flex; gap: 8px; align-items: flex-end; }
  .compose-row textarea { flex: 1; resize: none; min-height: 40px; max-height: 140px; }
  .compose-hint { font-size: .74rem; color: var(--pra-red); margin-top: 4px; }
  /* Shows who a reply sends as -- the sender is always the logged-in user
     (see inbox_backend.js, not client-controlled), this is display-only so
     teammates are visible but never look clickable. */
  .compose-from-select { font-size: .78rem; padding: 5px 10px; margin-bottom: 8px; max-width: 320px; }

  /* Native date/time pickers render a black-on-black calendar icon on a
     dark background otherwise -- color-scheme flips both to the light
     variant so the icon and popover are visible (same fix as chat-app). */
  #taskPanelDate, #taskPanelTime { color-scheme: dark; color: #fff; }

  /* ── Chat sidebar: filter/sort row ── */
  .chat-sidebar-filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 10px 10px; flex-shrink: 0; }
  .chat-sidebar-filters select { flex: 1; min-width: 84px; font-size: .76rem; padding: 6px 8px; }
  @media (max-width: 900px) {
    /* Full label text, no truncation or 2-line wrapping -- each box sizes
       to its own content and the row scrolls horizontally if that's wider
       than the screen, instead of shrinking/cutting off any one box. */
    .chat-sidebar-filters { gap: 4px; flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .chat-sidebar-filters select { flex: 0 0 auto; min-width: 0; width: auto; font-size: .68rem; padding: 6px 4px; }
    .chat-sidebar-filters .mobile-select-anchor { width: auto; } /* .pra-select's width:100% would otherwise become the flex-basis and force each box to fill the row */
    .chat-sidebar-filters .mobile-select-trigger-label { overflow: visible; text-overflow: clip; white-space: nowrap; }
  }

  /* ── Right-click / long-press context menu on chat rows ── */
  .context-menu { position: fixed; z-index: 400; min-width: 170px; background: var(--pra-panel-2); border: 1px solid var(--pra-border); border-radius: 8px; padding: 5px; box-shadow: 0 8px 28px rgba(0,0,0,0.5); display: none; }
  .context-menu.show { display: block; }
  .context-menu button { display: flex; align-items: center; width: 100%; padding: 8px 10px; background: none; border: none; color: var(--pra-white); font-family: var(--font-primary); font-size: .83rem; text-align: left; border-radius: 5px; cursor: pointer; }
  .context-menu button:hover { background: rgba(255,255,255,0.06); }
  .context-menu button.danger { color: var(--pra-red); }

  /* ── Chat panel header: status + tasks control ── */
  .chat-panel-task-btn { flex-shrink: 0; position: relative; }
  .chat-panel-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 0 18px 12px; border-bottom: 1px solid var(--pra-border); flex-shrink: 0; }
  /* Deliberately NOT flex:1/min-width -- that stretched this to fill the
     whole row width regardless of the status text length. Auto-width lets
     it shrink-wrap like every other pill/badge in this app. */
  .chat-panel-actions #chatStatusSelect { flex: 0 0 auto; width: auto; }
  /* Anchored under the Tasks button, not a full modal -- lists existing
     tasks (edit/delete) plus a quick-add form. Closes on click-out or
     Cancel, never needs its own scroll to be usable on a phone screen. */
  .task-panel { display: none; position: absolute; top: calc(100% + 6px); left: 0; z-index: 400; width: 280px; max-width: 88vw; background: var(--pra-panel-2); border: 1px solid var(--pra-border); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); padding: 12px; }
  .task-panel.open { display: block; }
  .task-panel-list { max-height: 220px; overflow-y: auto; margin-bottom: 10px; }
  .task-panel-row { display: flex; align-items: flex-start; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--pra-border); }
  .task-panel-row:last-child { border-bottom: none; }
  .task-panel-row input[type="text"] { flex: 1; background: none; border: none; color: var(--pra-white); font-family: var(--font-primary); font-size: .82rem; padding: 2px 0; }
  .task-panel-row input[type="text"]:focus { outline: none; border-bottom: 1px solid var(--pra-blue); }
  .task-panel-row.done input[type="text"] { color: var(--pra-dim); text-decoration: line-through; }
  .task-panel-row .task-panel-due { font-size: .68rem; color: var(--pra-dim); white-space: nowrap; }
  .task-panel-row button { background: none; border: none; color: var(--pra-dim); cursor: pointer; font-size: 1.1rem; line-height: 1; padding: 6px; margin: -6px; flex-shrink: 0; }
  .task-panel-row button:hover { color: var(--pra-red); }
  .task-panel-add { display: flex; flex-direction: column; gap: 6px; }
  .task-panel-add input { font-size: .82rem; padding: 6px 8px; }
  .task-panel-add-row { display: flex; gap: 6px; }
  .task-panel-add-row input[type="date"], .task-panel-add-row input[type="time"] { flex: 1; min-width: 0; }
  .task-panel-footer { display: flex; justify-content: flex-end; margin-top: 8px; }

  /* ── Contact details overlay (opened from the chat panel's name link) ── */
  .tag-pill { display: inline-flex; align-items: center; gap: 6px; font-size: .74rem; padding: 4px 10px; border-radius: 14px; background: var(--pra-blue-dim); color: var(--pra-blue); margin: 0 6px 6px 0; }
  .tag-pill button { background: none; border: none; color: inherit; cursor: pointer; font-size: .8rem; padding: 0; }
  .ov-sub-label { font-family: var(--font-secondary); font-size: .66rem; text-transform: uppercase; letter-spacing: .06em; color: var(--pra-dim); margin: 16px 0 8px; }
  /* Searchable "add a tag/list" dropdown -- same pattern as campaign-builder's
     recipient pickers, so you search a couple characters instead of scrolling
     a giant alphabetical <select> of every tag/list in the account. */
  .search-add { position: relative; margin-top: 8px; }
  .search-add-dropdown { display: none; position: absolute; top: 100%; left: 0; right: 0; z-index: 50; max-height: 220px; overflow-y: auto; background: var(--pra-panel-2); border: 1px solid var(--pra-border); border-radius: 8px; margin-top: 4px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
  .search-add-dropdown.open { display: block; }
  .search-add-option { padding: 8px 12px; font-size: .82rem; cursor: pointer; }
  .search-add-option:hover { background: rgba(255,255,255,0.06); }
  .search-add-option-empty { padding: 8px 12px; font-size: .8rem; color: var(--pra-dim); }
</style>
</head>
<body>
<div class="pra-root">
  <div class="app-shell">
    <div class="app-sidebar" id="appSidebar"></div>
    <div class="app-main">
      <div class="mobile-sticky-header">
        <div class="pra-h1" style="margin-bottom:16px">Inbox</div>
        <div class="tabs">
          <button class="tab-btn active" data-tab="primary">Inbox</button>
          <button class="tab-btn" data-tab="tasks">Tasks</button>
          <button class="tab-btn" data-tab="reminders">Reminders</button>
        </div>
        <div class="inbox-toolbar" id="inboxToolbar" style="display:none">
          <select class="pra-select" id="viewSelect">
            <option value="new">New</option>
            <option value="past">Past</option>
            <option value="all">All</option>
          </select>
          <select class="pra-select" id="sortSelect">
            <option value="desc">Newest first</option>
            <option value="asc">Oldest first</option>
            <option value="name">Name (A-Z)</option>
          </select>
          <div style="flex:1"></div>
          <div class="bulk-actions" id="bulkActions" style="display:none">
            <span class="pra-muted" style="font-size:.8rem" id="selectedCount"></span>

<script>
function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
function escapeHtml(s) { const d = document.createElement('div'); d.textContent = String(s ?? ''); return d.innerHTML; }
function fmtDate(iso) { return iso ? new Date(iso).toLocaleString() : ''; }
function fmtShort(iso) {
  if (!iso) return '';
  const d = new Date(iso), now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  return sameDay ? d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : d.toLocaleDateString([], { month: 'short', day: 'numeric' });
}
// Unlike fmtShort, always includes the year -- this labels a contact's
// origin date, which can be years in the past, and "Nov 2" alone would be
// ambiguous/misleading that far back.
function fmtCreatedDate(iso) { return iso ? new Date(iso).toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' }) : ''; }

let currentTab = 'primary', currentView = 'new', currentSort = 'desc';
let allStatuses = [], allUsers = [], currentItems = [], selectedIds = new Set();
let conversations = [], selectedConvo = null, threadItems = [], composeChannel = 'email', convoSearchQuery = '';
let currentUser = null, teamUsers = [];
let convoFilter = 'all', convoSort = 'newest', convoChannel = '', convoStatus = '', convoType = '', ctxMenuConvo = null, longPressTimer = null;
// Pagination -- the sidebar only ever asks the server for CONVO_PAGE_SIZE
// rows at a time (filtered/sorted server-side first, see inbox_backend.js)
// instead of loading the entire conversation list up front; scrolling near
// the bottom fetches the next page and appends it.
const CONVO_PAGE_SIZE = 40;
let convoOffset = 0, convoHasMore = true, convoLoadingMore = false, convoSearchDebounce = null;
const STOP_STATUSES = ['stop', 'bad fit / blacklist', 'bad fit', 'blacklist'];
const initialContactId = new URLSearchParams(location.search).get('contact');

function initials(name) { return String(name || '').trim().split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase(); }
// Outer avatar glow, by CRM status -- lead-stage-at-a-glance in the chat list.
const STATUS_GLOW = {
  'FINISHED': '#9a9aa5',
  'POTENTIAL': '#ffffff',
  'FOLLOW UP (They have a Task / Date set)': '#f4ff00',
  'APPLICATION': '#14892b',
  'BOOKED': '#1fbf42',
  'WE CANCELLED': '#7a7a86',
  "RSVP'ed": '#2cdf2b',
  'ENROLLED': '#39ff14',
  'STOP': '#4a4a52',
  'BAD FIT / BLACKLIST': '#4a4a52',
};
// A thread with one of the CRM's own staff/admin users (e.g. testing by
// messaging lee@ or alexis@) glows blue regardless of lead status -- "this
// is one of us", not a lead-stage signal.
// Same fix as contact-detail.html's applyStatusGlow -- a native <select>
// sizes to its widest OPTION ("FOLLOW UP (They have a Task / Date set)"),
// not the selected one, so CSS width:auto alone still renders it as a wide
// bar regardless of which status is actually showing.
function statusSelectWidthRule(status) { return `width:${(status || 'Change status...').length + 8}ch`; }
function avatarStyle(status, email) {
  const isStaff = email && allUsers.some(u => u.email?.toLowerCase() === email.toLowerCase());
  const glow = isStaff ? '#009bff' : STATUS_GLOW[status];
  return glow ? `--status-glow:${glow};--status-glow-soft:${glow}88` : '';
}
const PIN_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M14.5 2.5a1.5 1.5 0 0 1 2.1 0l4.9 4.9a1.5 1.5 0 0 1 0 2.1l-2.1 2.1-1.4-1.4-3.5 3.5.5 4.6-1.6 1.6-4.2-4.2-5.4 5.4-1.1-1.1 5.4-5.4-4.2-4.2 1.6-1.6 4.6.5 3.5-3.5-1.4-1.4Z"/></svg>';
const STAR_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6.6 7.1.7-5.4 4.7 1.7 7-6.3-3.9-6.3 3.9 1.7-7-5.4-4.7 7.1-.7z"/></svg>';
// Four-point sparkle -- same "single path, fill:currentColor" icon style
// as PIN_ICON/STAR_ICON above, used in place of a plain robot emoji for
// the AI draft banner so it reads as part of this app's own icon set
// rather than a generic OS emoji.
const SPARKLE_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c.6 5.4 2.2 7 7.6 7.6-5.4.6-7 2.2-7.6 7.6-.6-5.4-2.2-7-7.6-7.6C9.8 9 11.4 7.4 12 2Z"/><path d="M19 17c.25 1.9.85 2.5 2.75 2.75C19.85 20 19.25 20.6 19 22.5c-.25-1.9-.85-2.5-2.75-2.75C18.15 19.5 18.75 18.9 19 17Z"/></svg>';
// WhatsApp-style read receipts, same as chat-app's: one grey check (sent),
// two grey checks (delivered), two blue checks (read -- an email "opened"
// event stands in for read, since SMS has no carrier-level read receipt).
function svgTick(double, color) {
  const check = 'M1 5.3L4.6 9L14.5 0.8';
  if (!double) return `<svg viewBox="0 0 16 10" width="14" height="9" fill="none"><path d="${check}" stroke="${color}" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  return `<svg viewBox="0 0 20 10" width="17" height="9" fill="none"><path d="${check}" stroke="${color}" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="${check}" transform="translate(5,0)" stroke="${color}" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function readReceiptTicksHtml(status, opened) {
  if (!status) return '';
  const svg = opened ? svgTick(true, '#009bff') : status === 'queued' ? svgTick(false, 'var(--pra-dim)') : svgTick(true, 'var(--pra-dim)');
  return `<span class="bubble-ticks" title="${opened ? 'Opened' : status}">${svg}</span>`;
}

async function loadRefs() {
  // Used to also fetch the FULL unpaginated contact list here (all 176K+
  // contacts, the entire multi-hundred-MB response) just to support one
  // rare deep-link fallback case (see loadConversations' initialContactId
  // handling) -- that's now a targeted /api/contacts/:id lookup instead,
  // done only when actually needed, so a normal Inbox load no longer
  // downloads and parses the whole contacts database first.
  const [statusesRes, usersRes, meRes, teamRes] = await Promise.all([fetch('/api/statuses'), fetch('/api/auth/users'), fetch('/api/auth/me'), fetch('/api/auth/team')]);
  allStatuses = statusesRes.ok ? (await statusesRes.json()).statuses : [];
  allUsers = usersRes.ok ? (await usersRes.json()).users : []; // 403s for a non-admin -- avatarStyle() just falls back to status-only glow
  currentUser = meRes.ok ? (await meRes.json()).user : null;
  // /api/auth/team (not /api/auth/users) -- readable by every staff member,
  // not just admins, since the compose panel's From display needs to show
  // teammates exist even to non-admin senders.
  teamUsers = teamRes.ok ? (await teamRes.json()).users : [];
  const statusSel = document.getElementById('convoStatusSelect');
  statusSel.innerHTML = '<option value="">All statuses</option>' + allStatuses.map(s => `<option value="${escapeHtml(s.label)}"${STATUS_GLOW[s.label] ? ` data-color="${STATUS_GLOW[s.label]}"` : ''}>${escapeHtml(s.label)}</option>`).join('');
}

// ── Tab switching ───────────────────────────────────────────────────────
// Only 'primary' is a chat-style tab now -- Emails/Messages used to be
// separate tabs that also implied a channel filter; that filter is now
// its own dropdown (convoChannelSelect) so it can combine with Done/
// Archived/etc instead of being tab-exclusive.
const CHAT_TABS = { primary: null };
document.querySelectorAll('.tab-btn').forEach(btn => btn.onclick = () => {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentTab = btn.dataset.tab;
  const isChat = currentTab in CHAT_TABS;
  document.getElementById('chatView').style.display = isChat ? 'flex' : 'none';
  document.getElementById('flatListView').style.display = isChat ? 'none' : 'block';
  document.getElementById('inboxToolbar').style.display = isChat ? 'none' : 'flex';
  if (isChat) { document.getElementById('chatView').classList.remove('thread-open'); loadConversations(); }
  else loadItems();
});

// ── Chat: conversation sidebar ───────────────────────────────────────────
function convoQueryParams(offset) {
  const params = new URLSearchParams();
  if (convoChannel) params.set('channel', convoChannel);
  if (convoFilter && convoFilter !== 'all') params.set('filter', convoFilter);
  if (convoStatus) params.set('status', convoStatus);
  if (convoType) params.set('type', convoType);
  if (convoSort && convoSort !== 'newest') params.set('sort', convoSort);
  if (convoSearchQuery.trim()) params.set('search', convoSearchQuery.trim());
  params.set('limit', CONVO_PAGE_SIZE);
  params.set('offset', offset);
  return params.toString();
}
// Full reset -- called on initial tab load and whenever any filter/sort/
// search/channel control changes. Replaces `conversations` outright rather
// than appending (see loadMoreConversations for that).
async function loadConversations() {
  const list = document.getElementById('chatSidebarList');
  list.innerHTML = '<div class="pra-muted" style="padding:16px;font-size:.82rem">Loading…</div>';
  convoOffset = 0; convoHasMore = true;
  const r = await fetch('/api/inbox/conversations?' + convoQueryParams(0));
  if (!r.ok) { list.innerHTML = '<div class="pra-muted" style="padding:16px;font-size:.82rem">Could not load.</div>'; return; }
  const data = await r.json();
  conversations = data.conversations;
  convoOffset = conversations.length;
  convoHasMore = !!data.hasMore;
  renderSidebar();
  if (initialContactId) {
    const match = conversations.find(c => c.contactId === initialContactId);
    if (match) { selectConversation(match); return; }
    // Not on the first page of conversations (brand-new contact with no
    // messages yet, or just not among the most recent) -- look it up
    // directly instead of scanning the full contact list client-side.
    const contactRes = await fetch('/api/contacts/' + initialContactId);
    const contact = contactRes.ok ? (await contactRes.json()).contact : null;
    if (contact) selectConversation({ key: contact.id, contactId: contact.id, contact, displayName: `${contact.first} ${contact.last}`.trim(), lastAt: null, unreadCount: 0 });
  } else if (selectedConvo) {
    const stillThere = conversations.find(c => c.key === selectedConvo.key);
    if (stillThere) selectConversation(stillThere, true);
  }
}
// Scroll-triggered -- fetches the next page under the SAME filter/sort/
// search and appends it, rather than re-rendering everything (which would
// also reset scroll position right as the user is scrolling).
async function loadMoreConversations() {
  if (!convoHasMore || convoLoadingMore) return;
  convoLoadingMore = true;
  try {
    const r = await fetch('/api/inbox/conversations?' + convoQueryParams(convoOffset));
    if (!r.ok) return;
    const data = await r.json();
    conversations = conversations.concat(data.conversations);
    convoOffset = conversations.length;
    convoHasMore = !!data.hasMore;
    appendConvoRows(data.conversations);
  } finally {
    convoLoadingMore = false;
  }
}
// Filter/sort/search already happened server-side (see inbox_backend.js) --
// `conversations` is always exactly the rows that belong on screen, in
// order. This just turns that array into HTML; it never re-filters or
// re-sorts it client-side.
// Same badge markup as the contact overlay's renderOverlayOptOutBadges /
// contact-detail.html's equivalent -- the chat panel didn't have this at
// all before, unlike those other two contact views.
function optOutBadgesHtml(contact) {
  if (!contact) return '';
  const badge = (label) => `<span class="pra-badge" style="background:#3a1414;color:#ff6b6b;border:1px solid #ff6b6b55">${label}</span>`;
  return (contact.emailOptOut ? badge('EMAIL OPT-OUT') : '') + (contact.smsOptOut ? badge('SMS OPT-OUT') : '');
}
// Same select + glow treatment as the chat panel's #chatStatusSelect
// (avatarStyle/statusSelectWidthRule), just compact enough to sit in the
// sidebar row next to the name -- lets a status get changed without
// opening the conversation.
function convoStatusFieldHtml(c) {
  const status = c.contact?.status || '';
  return `<select class="pra-select convo-status-select" data-status-contact="${c.contactId}" style="${avatarStyle(status)};${statusSelectWidthRule(status)}" title="Change status">
    <option value="">Set status...</option>
    ${allStatuses.map(s => `<option value="${escapeHtml(s.label)}" ${status === s.label ? 'selected' : ''}>${escapeHtml(s.label)}</option>`).join('')}
  </select>`;
}
function convoRowHtml(c) {
  const hasUnread = c.unreadCount > 0;
  const showTicks = !hasUnread && c.lastDirection === 'outbound' && c.lastStatus;
  const previewTicks = showTicks ? readReceiptTicksHtml(c.lastStatus, c.lastOpened) : '';
  // Historical Close-import sequence-subscription rows carry their raw
  // Close status baked into the subject text itself (see import_backend.js's
  // closeSequenceName/`SMS/Email Sequence: ${name} (${s.status})`) --
  // stripped here rather than at the data, so it's fixed for every already-
  // imported row immediately, not just future ones.
  const previewRaw = (c.lastPreview || '').replace(/\s*\(active\)\s*$/i, '');
  const previewText = escapeHtml(previewRaw.replace(/<[^>]+>/g, ' ')).trim().slice(0, 56);
  return `
    <div class="convo-row${selectedConvo?.key === c.key ? ' selected' : ''}${c.pinned ? ' pinned' : ''}" data-convo="${c.key}">
      <div class="pra-avatar convo-avatar${hasUnread ? ' has-unread' : ''}" style="${avatarStyle(c.contact?.status, c.contact?.email)}">${initials(c.displayName)}</div>
      <div class="convo-meta">
        <div class="convo-top">
          ${c.pinned ? `<span class="convo-pinned-mark" title="Pinned">${PIN_ICON}</span>` : ''}
          <span class="convo-name">${escapeHtml(c.displayName)}</span>
          ${c.contactId ? convoStatusFieldHtml(c) : ''}
          ${c.contactId ? ownerFieldHtml(c.contact, 'convo-owner-field') : ''}
          ${c.contactId ? `<span class="pra-badge pra-badge-${c.contact?.programType || ''}" data-type-badge style="font-size:.56rem;padding:2px 7px">${c.contact?.programType ? escapeHtml(c.contact.programType) : 'SET TYPE'}</span>` : ''}
          <div class="convo-time${hasUnread ? ' has-unread' : ''}">${fmtShort(c.lastAt)}</div>
        </div>
        <div class="convo-bottom">
          <div class="convo-preview">${c.lastDirection === 'outbound' ? previewTicks + ' You: ' : ''}${previewText}</div>
          ${!c.contactId ? '<button class="pra-btn pra-btn-ghost pra-btn-sm convo-add-btn" data-add-contact type="button">+ Add Contact</button>' : ''}
          ${c.contactId ? `<button class="convo-icon-btn pin-btn${c.pinned ? ' on' : ''}" data-pin="${c.contactId}" data-pin-on="${c.pinned ? '0' : '1'}" title="${c.pinned ? 'Unpin' : 'Pin to top'}">${PIN_ICON}</button>` : ''}
          ${c.contactId ? `<button class="convo-icon-btn star-btn${c.starred ? ' on' : ''}" data-star="${c.contactId}" data-star-on="${c.starred ? '0' : '1'}" title="${c.starred ? 'Unstar' : 'Star'}">${STAR_ICON}</button>` : ''}
          ${hasUnread ? `<div class="convo-unread-badge">${c.unreadCount > 99 ? '99+' : c.unreadCount}</div>` : ''}
        </div>
      </div>
    </div>
  `;
}
function wireConvoRow(row) {
  row.onclick = (e) => {
    if (row.dataset.longPress) { delete row.dataset.longPress; return; }
    if (e.target.closest('[data-add-contact], [data-pin], [data-star]')) return;
    const c = conversations.find(x => x.key === row.dataset.convo);
    if (c.contactId) selectConversation(c);
  };
  const c = () => conversations.find(x => x.key === row.dataset.convo);
  row.addEventListener('contextmenu', (e) => { e.preventDefault(); openContextMenu(c(), e.clientX, e.clientY); });
  row.addEventListener('touchstart', (e) => {
    const touch = e.touches[0];
    longPressTimer = setTimeout(() => { row.dataset.longPress = '1'; openContextMenu(c(), touch.clientX, touch.clientY); }, 500);
  }, { passive: true });
  row.addEventListener('touchend', () => clearTimeout(longPressTimer));
  row.addEventListener('touchmove', () => clearTimeout(longPressTimer));

      e.stopPropagation();

      const convo = c();
      if (!convo?.contactId) return;
      await fetch('/api/contacts/' + convo.contactId, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status }) });
      showToast('Status updated');
      if (convo.contact) convo.contact.status = status;
      e.target.setAttribute('style', `${avatarStyle(status)};${statusSelectWidthRule(status)}`);
      // A status change can auto-archive the conversation (STOP / Bad Fit &
      // Blacklist) -- same reload chatStatusSelect's handler does, so a
      // freshly-archived row actually drops out of the current view instead
      // of sticking around from the stale local `conversations` array.
      await loadConversations();
    });
  }
  row.querySelector('[data-pin]')?.addEventListener('click', async (e) => {
    e.stopPropagation();
    const btn = e.currentTarget;
    const pinned = btn.dataset.pinOn === '1';
    await fetch(`/api/inbox/conversations/${btn.dataset.pin}/pin`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pinned }) });
    loadConversations();
  });
  row.querySelector('[data-star]')?.addEventListener('click', async (e) => {
    e.stopPropagation();
    const btn = e.currentTarget;
    const starred = btn.dataset.starOn === '1';
    await fetch(`/api/inbox/conversations/${btn.dataset.star}/star`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ starred }) });
    const found = conversations.find(x => x.contactId === btn.dataset.star);
    if (found) found.starred = starred;
    btn.classList.toggle('on', starred);
    btn.title = starred ? 'Unstar' : 'Star';
    btn.dataset.starOn = starred ? '0' : '1';
  });
}
// Updates the in-memory row (not just the <select>'s own value, which
// already reflects the change natively) so a later re-render of the same
// list -- filter/sort change, scroll-triggered append -- doesn't show the
// assignment reverting to whatever it was when this page was first loaded.
function applyOwnerChangeToConvoState(contactId, ownerId) {
  const row = conversations.find(c => c.contactId === contactId);
  if (row?.contact) row.contact.ownerId = ownerId;
}
function renderSidebar() {

// Appends just the newly-loaded page (scroll-triggered) instead of
// re-rendering the whole list -- keeps existing rows' DOM nodes (and the
// user's scroll position) untouched.
function appendConvoRows(newRows) {
  if (!newRows.length) return;
  const list = document.getElementById('chatSidebarList');
  const frag = document.createElement('div');
  frag.innerHTML = newRows.map(convoRowHtml).join('');

}

// ── Chat panel: contact-bound Tasks panel ────────────────────────────────
// Anchored dropdown (not a modal) so it never needs its own scroll to
// reach the "Add" button on a phone screen -- lists existing tasks with
// inline edit (click the title) / delete, plus a quick-add form. Reuses
// threadItems (already loaded by loadThread() for this contact) instead
// of a separate fetch.
// Compact date -- fmtDate's toLocaleString() always includes a time, which
// reads as noise ("12:00:00 AM") for a task/note that was only ever given
// a date. Only shows a time when one was actually set (non-midnight).
function fmtDueCompact(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const dateStr = d.toLocaleDateString();
  return (d.getHours() || d.getMinutes()) ? `${dateStr} ${d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}` : dateStr;
}
function taskPanelRowHtml(t) {
  return `
    <div class="task-panel-row${t.done ? ' done' : ''}" data-task-row="${t.id}">
      <button type="button" data-task-delete="${t.id}" title="Delete">&times;</button>
      ${t.dueAt ? `<span class="task-panel-due">${fmtDueCompact(t.dueAt)}</span>` : '<span class="task-panel-due">No date</span>'}
      <input type="text" data-task-title="${t.id}" value="${escapeHtml(t.title)}"/>
    </div>
  `;
}
function renderTaskPanel() {
  const list = document.getElementById('taskPanelList');
  const tasks = threadItems.filter(i => i.itemType === 'task').sort((a, b) => new Date(a.dueAt || a.createdAt) - new Date(b.dueAt || b.createdAt));
  list.innerHTML = tasks.length ? tasks.map(taskPanelRowHtml).join('') : '<div class="pra-muted" style="font-size:.78rem;padding:4px 0">No tasks yet.</div>';
  list.querySelectorAll('[data-task-title]').forEach(inp => {
    const commit = async () => {
      const id = inp.dataset.taskTitle;
      const title = inp.value.trim();
      if (!title) { inp.value = threadItems.find(i => i.id === id)?.title || ''; return; }
      await fetch('/api/tasks/' + id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title }) });
      const t = threadItems.find(i => i.id === id); if (t) t.title = title;
    };
    inp.addEventListener('blur', commit);
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') inp.blur(); });
  });
  list.querySelectorAll('[data-task-delete]').forEach(btn => btn.onclick = async () => {
    const id = btn.dataset.taskDelete;
    await fetch('/api/tasks/' + id, { method: 'DELETE' });
    threadItems = threadItems.filter(i => i.id !== id);
    renderTaskPanel();
  });
}
function toggleTaskPanel(contactId) {
  const panel = document.getElementById('taskPanel');
  const opening = !panel.classList.contains('open');
  panel.classList.toggle('open', opening);
  panel.dataset.contactId = contactId || '';
  if (opening) {
    document.getElementById('taskPanelTitle').value = '';
    document.getElementById('taskPanelDate').value = '';
    document.getElementById('taskPanelTime').value = '';
    renderTaskPanel();
  }
}
async function submitNewTask() {
  const title = document.getElementById('taskPanelTitle').value.trim();
  if (!title) { showToast('Title is required', true); return; }
  const contactId = document.getElementById('taskPanel').dataset.contactId;
  const dateVal = document.getElementById('taskPanelDate').value;
  const timeVal = document.getElementById('taskPanelTime').value;
  const dueAt = dateVal ? new Date(`${dateVal}T${timeVal || '00:00'}`).toISOString() : null;

  threadItems.push({ ...task, itemType: 'task', at: task.dueAt || task.createdAt });

// Delegated (not a direct getElementById().onclick) since both panels' DOM
// is recreated every time renderThread() re-renders the chat panel header
// -- a direct binding would go stale the moment a new conversation opens.
// Same listener also handles click-out-to-close for whichever panel is
// open: clicks on a panel itself or its own trigger button are ignored
// (the trigger has its own toggle handler, which would otherwise
// immediately re-close what it just opened).
document.addEventListener('click', (e) => {

  const taskPanel = document.getElementById('taskPanel');
  if (taskPanel?.classList.contains('open') && !taskPanel.contains(e.target) && e.target.id !== 'chatAddTaskBtn') toggleTaskPanel(null);
  const notePanel = document.getElementById('notePanel');
  if (notePanel?.classList.contains('open') && !notePanel.contains(e.target) && e.target.id !== 'chatAddNoteBtn') toggleNotePanel(null);
});

// ── Chat: thread panel ────────────────────────────────────────────────────
function emailBubbleHtml(item, idx) {
  const clicked = (item.statusHistory || []).find(h => h.status === 'clicked');
  // A click can't happen without an open first -- pixel-based open tracking
  // alone is unreliable (many mail clients block the tracking image), so a
  // recorded click counts as an open too, same convention used everywhere
  // else opened/clicked stats are computed (see message_index.js).
  const opened = (item.statusHistory || []).find(h => h.status === 'opened') || clicked;
  return `
    <div class="bubble-row ${item.direction}">
      <div class="email-bubble" data-email-toggle="${idx}">
        <div class="email-bubble-head"><span class="email-bubble-icon">📧</span><span class="email-bubble-subject">${escapeHtml(item.subject || '(no subject)')}</span></div>
        <div class="email-bubble-preview">${escapeHtml((item.bodyPreview || '').replace(/<[^>]+>/g, ' ')).trim()}</div>
        <div class="email-bubble-body"><iframe data-src="${idx}"></iframe></div>
        <div class="email-bubble-meta">
          <span>${fmtDate(item.at)}</span>
          <span>${item.status || ''}</span>
          ${item.direction === 'outbound' ? `<span class="track-badge${opened ? ' on' : ''}">${opened ? 'Opened' : 'Not opened'}</span><span class="track-badge${clicked ? ' on' : ''}">${clicked ? 'Clicked' : 'Not clicked'}</span>` : ''}
        </div>
      </div>
    </div>
  `;
}
function smsBubbleHtml(item) {
  return `
    <div class="bubble-row ${item.direction}">
      <div class="bubble-content">
        <div class="sms-bubble">${escapeHtml(item.body || item.bodyPreview || '')}</div>
        <div class="bubble-time">${fmtDate(item.at)}</div>
      </div>
    </div>
  `;
}
// Form submissions and new bookings -- always inbound (something the lead
// did on the site), shown as a simple system-style card rather than a
// chat bubble, same visual family as the email card minus the expand/iframe.
function noteBubbleHtml(item) {
  const icon = item.channel === 'booking' ? '📅' : item.channel === 'activity' ? '📈' : '📝';
  return `
    <div class="bubble-row ${item.direction}">
      <div class="bubble-content note-bubble">
        <div class="note-bubble-head"><span>${icon}</span><span class="note-bubble-subject">${escapeHtml(item.subject || '')}</span></div>
        ${item.body ? `<div class="note-bubble-body">${escapeHtml(item.body)}</div>` : ''}
        <div class="bubble-time">${fmtDate(item.at)}</div>
      </div>
    </div>
  `;
}
// Opens/clicks only ever apply to OUTBOUND email -- there's nothing to
// track on an inbound message or an SMS (no click data exists for SMS
// yet; see readReceiptTicksHtml's own comment on why SMS read-state stops
// at "delivered"). Skipped entirely (not "0%") when there's no outbound
// email to measure yet, since 0% reads as "everyone ignored you" when the
// real story is "nothing's been sent."
function emailStatsHtml(items) {
  const sent = items.filter(i => i.itemType === 'email' && i.direction === 'outbound');
  if (!sent.length) return '';
  const opened = sent.filter(i => (i.statusHistory || []).some(h => h.status === 'opened' || h.status === 'clicked')).length;
  const clicked = sent.filter(i => (i.statusHistory || []).some(h => h.status === 'clicked')).length;
  const pct = (n) => Math.round((n / sent.length) * 100);
  return `
    <div class="track-summary">
      <span><b>${sent.length}</b> email${sent.length === 1 ? '' : 's'} sent</span>
      <span class="${opened ? 'on' : ''}"><b>${opened}</b> opened (${pct(opened)}%)</span>
      <span class="${clicked ? 'on' : ''}"><b>${clicked}</b> clicked (${pct(clicked)}%)</span>
    </div>
  `;
}

      ` : ''}
      ${composeChannel === 'email' ? `<input class="pra-input" id="composeSubject" placeholder="Subject" style="margin-bottom:8px"/>` : ''}
      <div class="compose-row">
        <textarea class="pra-textarea" id="composeBody" placeholder="${composeChannel === 'email' ? 'Write an email…' : 'Write a text message…'}"></textarea>
        <button class="pra-btn" id="composeSendBtn">Send</button>
      </div>
      ${composeChannel === 'email' && !emailOk ? '<div class="compose-hint">This contact has no email on file.</div>' : ''}
      ${composeChannel === 'sms' && !smsOk ? '<div class="compose-hint">This contact has no phone number on file.</div>' : ''}
    </div>
  `;
  const items = [...threadItems].filter(i => ['email', 'sms', 'form', 'booking', 'activity'].includes(i.itemType)).sort((a, b) => new Date(a.at) - new Date(b.at));
  const threadEl = document.getElementById('chatThread');
  threadEl.innerHTML = items.length ? items.map((item, idx) => item.itemType === 'email' ? emailBubbleHtml(item, idx) : item.itemType === 'sms' ? smsBubbleHtml(item) : noteBubbleHtml(item)).join('') : '<div class="pra-muted" style="text-align:center;padding:30px">No messages yet.</div>';
  threadEl.querySelectorAll('[data-email-toggle]').forEach(el => el.onclick = () => {
    const wasExpanded = el.classList.contains('expanded');
    el.classList.toggle('expanded');
    if (!wasExpanded) {
      const iframe = el.querySelector('iframe');
      const item = items[Number(el.dataset.emailToggle)];
      // Force Arial regardless of whatever font the source HTML specifies
      // inline (Close-imported emails carry their own inline styles) --
      // !important is the only way to reliably win against those.
      if (iframe && !iframe.srcdoc) iframe.srcdoc = `<style>body,*{font-family:Arial,Helvetica,sans-serif!important;}</style>${item.body || '<p style="color:#888">(no content stored)</p>'}`;
    }
  });
  threadEl.scrollTop = threadEl.scrollHeight;

  if (currentTab === 'primary') {
    panel.querySelectorAll('.compose-channel-toggle button').forEach(btn => btn.onclick = () => { composeChannel = btn.dataset.ch; renderThread(); });
  }
  document.getElementById('composeSendBtn').onclick = sendComposeMessage;
  if (c.contactId) loadAiDrafts(c.contactId);
  document.getElementById('chatBackBtn').onclick = backToConvoList;
  document.getElementById('chatAddTaskBtn').onclick = (e) => { e.stopPropagation(); toggleTaskPanel(c.contactId); };
  document.getElementById('chatAddNoteBtn').onclick = (e) => { e.stopPropagation(); toggleNotePanel(c.contactId); };
  if (c.contactId) document.getElementById('chatPanelNameLink').onclick = () => openContactOverlay(c.contactId);
  wireOwnerFields(panel, (contactId, ownerId) => { if (c.contact) c.contact.ownerId = ownerId; applyOwnerChangeToConvoState(contactId, ownerId); });
  if (c.contactId) {
    wireInlineEditClick(document.getElementById('chatPanelTypeBadge'), {
      field: 'programType',
      contactId: c.contactId,
      onSaved: (value) => {
        if (c.contact) c.contact.programType = value;

      },
    });
  }
  document.getElementById('chatStatusSelect').addEventListener('change', async (e) => {
    const status = e.target.value;
    if (!c.contactId) return;
    // Selecting the blank "Change status..." option explicitly clears the
    // status back to none -- previously this silently no-opped, so picking
    // it back after a real status was set never actually saved, and a
    // reload would revert to whatever status was there before.
    await fetch('/api/contacts/' + c.contactId, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status }) });
    showToast('Status updated');
    e.target.setAttribute('style', `${avatarStyle(status)};${statusSelectWidthRule(status)}`);
    await loadRefs();
    // A status change can auto-archive the conversation (STOP / Bad Fit &
    // Blacklist) -- loadRefs() only refreshes contacts/statuses/users, not
    // the conversation list itself, so without this the row would keep
    // showing in the sidebar (stale local `conversations` array) even
    // though the backend already archived it.
    await loadConversations();
  });

  // Selecting a conversation is as close as this Inbox gets to "read" --
  // clear its unread badge the same way opening the old detail modal did.
  // Updates local state + re-renders just the sidebar rather than
  // reloading and re-selecting the conversation -- doing the latter here
  // re-triggers this same code path on every load, which (combined with a
  // now-fixed backend bug that always reported messages as unread) spun
  // into an infinite select-mark-reload loop.
  const unread = items.filter(i => i.direction === 'inbound' && !i.done);
  if (unread.length) {
    markDone(unread.map(i => i.id), true);
    const inList = conversations.find(x => x.key === c.key);
    if (inList) inList.unreadCount = 0;
    renderSidebar();
  }
}
async function selectConversation(c, skipFetch) {

function backToConvoList() { document.getElementById('chatView').classList.remove('thread-open'); }

async function loadAiDrafts(contactId) {
  const container = document.getElementById('aiDraftContainer');
  if (!container) return;
  try {
    const r = await fetch('/api/ai-drafts?contactId=' + encodeURIComponent(contactId));
    if (!r.ok) { container.innerHTML = ''; return; }
    const { drafts } = await r.json();
    if (!drafts.length) { container.innerHTML = ''; return; }
    // Only ever one pending draft per contact in practice (triggerAiAssist
    // picks a single matching agent) -- showing all just in case more than
    // one is somehow pending.
    container.innerHTML = drafts.map(d => `
      <div class="ai-draft-card" data-draft-id="${d.id}" data-channel="${d.channel === 'email' ? 'email' : 'sms'}">
        <div class="ai-draft-label">${SPARKLE_ICON} AI draft from ${escapeHtml(d.agentName)} — review before sending</div>
        <textarea class="pra-textarea ai-draft-text">${escapeHtml(d.draftText)}</textarea>
        <div class="ai-draft-actions">
          <div class="compose-channel-toggle ai-draft-channel-toggle">
            <button type="button" data-ch="email" class="${d.channel === 'email' ? 'active' : ''}">Email</button>
            <button type="button" data-ch="sms" class="${d.channel !== 'email' ? 'active' : ''}">SMS</button>
            <button type="button" data-ch="both">Both</button>
          </div>
          <div style="display:flex;gap:8px">
            <button class="pra-btn pra-btn-ghost pra-btn-sm" data-discard="${d.id}">Discard</button>
            <button class="pra-btn pra-btn-sm" data-send="${d.id}">Send</button>
          </div>
        </div>
      </div>
    `).join('');
    container.querySelectorAll('.ai-draft-channel-toggle').forEach(toggle => {
      toggle.querySelectorAll('button').forEach(btn => btn.onclick = () => {
        toggle.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        toggle.closest('.ai-draft-card').dataset.channel = btn.dataset.ch;
      });
    });
    container.querySelectorAll('[data-send]').forEach(btn => btn.onclick = async () => {
      const card = btn.closest('.ai-draft-card');
      const editedText = card.querySelector('.ai-draft-text').value;
      const channel = card.dataset.channel;
      btn.disabled = true;
      const r2 = await fetch(`/api/ai-drafts/${btn.dataset.send}/send`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ editedText, channel }) });
      const d2 = await r2.json().catch(() => ({}));
      if (r2.ok) { showToast('Sent'); card.remove(); if (selectedConvo?.contactId) selectConversation(selectedConvo); }
      else { showToast(d2.error || 'Could not send', true); btn.disabled = false; }
    });
    container.querySelectorAll('[data-discard]').forEach(btn => btn.onclick = async () => {
      const card = btn.closest('.ai-draft-card');
      await fetch(`/api/ai-drafts/${btn.dataset.discard}/discard`, { method: 'POST' });
      card.remove();
    });
  } catch { container.innerHTML = ''; }
}
async function sendComposeMessage() {
  const body = document.getElementById('composeBody').value.trim();
  if (!body || !selectedConvo?.contactId) return;
  const subject = composeChannel === 'email' ? document.getElementById('composeSubject').value.trim() : undefined;
  const fromUserId = composeChannel === 'email' ? document.getElementById('composeFromUserId')?.value : undefined;
  const btn = document.getElementById('composeSendBtn');
  btn.disabled = true; btn.textContent = 'Sending…';
  const r = await fetch('/api/inbox/send', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ contactId: selectedConvo.contactId, channel: composeChannel, subject, body, fromUserId }),
  });
  const d = await r.json();
  btn.disabled = false; btn.textContent = 'Send';
  if (!r.ok) { showToast(d.error || 'Send failed', true); return; }
  showToast('Sent');
  const threadRes = await fetch('/api/inbox/contact/' + selectedConvo.contactId);
  threadItems = threadRes.ok ? (await threadRes.json()).items : [];
  renderThread();
  loadConversations();
}

// No Save button -- every field PATCHes immediately on change, same
// pattern as contact-detail.html's Details panel.
async function autoSaveOverlay() {

// Selected tags/lists show only the first couple, same collapse pattern as
// contact-detail.html's Details panel -- a contact with a dozen imported
// segment tags shouldn't push the whole overlay's form fields off-screen.
// The "+N more" toggle renders separately from the pills so it can sit
// next to the section LABEL instead of trailing after the pills.
const OV_PILLS_COLLAPSE_LIMIT = 2;
let ovTagsExpanded = false, ovListsExpanded = false, ovHyrosTagsExpanded = false, ovHyrosUrlsExpanded = false;
function ovPillsBodyHtml(pills, expanded, emptyText) {
  if (!pills.length) return `<span class="pra-muted" style="font-size:.82rem">${emptyText}</span>`;
  return (expanded ? pills : pills.slice(0, OV_PILLS_COLLAPSE_LIMIT)).join('');
}
function ovToggleSlotHtml(count, expanded, toggleId) {
  if (count <= OV_PILLS_COLLAPSE_LIMIT) return '';
  return `<button type="button" class="pra-link" id="${toggleId}" style="font-size:.78rem">${expanded ? 'Show less' : `+${count - OV_PILLS_COLLAPSE_LIMIT} more`}</button>`;
}
// Hyros tag names all follow "@"/"$"/"!" -- everything else came from AC
// (or was added manually). Same naming-convention split as contact-detail.html.
function isHyrosTagName(name) { return /^[@$!]/.test(name); }
function hyrosUrlPill(label, detail, href) {
  const inner = href ? `<a href="${escapeHtml(href)}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">${escapeHtml(label)}</a>` : escapeHtml(label);
  return `<span class="tag-pill" style="cursor:default" title="${escapeHtml(detail || '')}">${inner}</span>`;
}
function renderOverlayHyrosTags() {
  const tagNames = (overlayContact.tags || []).map(id => overlayTags.find(t => t.id === id)?.name).filter(Boolean);
  const pills = tagNames.filter(isHyrosTagName).map(name => `<span class="tag-pill" style="cursor:default">${escapeHtml(name)}</span>`);
  document.getElementById('ovHyrosTagsWrap').innerHTML = ovPillsBodyHtml(pills, ovHyrosTagsExpanded, 'None.');
  document.getElementById('ovHyrosTagsToggleSlot').innerHTML = ovToggleSlotHtml(pills.length, ovHyrosTagsExpanded, 'ovHyrosTagsToggle');
  const toggle = document.getElementById('ovHyrosTagsToggle');
  if (toggle) toggle.onclick = () => { ovHyrosTagsExpanded = !ovHyrosTagsExpanded; renderOverlayHyrosTags(); };
}
function renderOverlayHyrosUrls() {
  const rows = [];
  if (overlayContact.hyrosTrackedUrl) rows.push(hyrosUrlPill('Tracked URL', overlayContact.hyrosTrackedUrl, overlayContact.hyrosTrackedUrl));
  if (overlayContact.hyrosPreviousUrl) rows.push(hyrosUrlPill('Previous URL', overlayContact.hyrosPreviousUrl, overlayContact.hyrosPreviousUrl));
  const firstClick = overlayThreadItems.find(i => i.itemType === 'activity' && (i.subject || '').startsWith('First ad click'));
  const lastClick = overlayThreadItems.find(i => i.itemType === 'activity' && (i.subject || '').startsWith('Last ad click'));
  if (firstClick) rows.push(hyrosUrlPill(firstClick.subject, `${firstClick.body || ''} · ${fmtDate(firstClick.at)}`));
  if (lastClick) rows.push(hyrosUrlPill(lastClick.subject, `${lastClick.body || ''} · ${fmtDate(lastClick.at)}`));
  if (overlayContact.hyrosOriginLead) {
    const o = overlayContact.hyrosOriginLead;
    rows.push(hyrosUrlPill('Origin Identity', `${[o.firstName, o.lastName].filter(Boolean).join(' ')} ${o.email || ''} ${(o.phoneNumbers || []).join(', ')}`));

// Generic search-to-add dropdown -- built once per container (so typing
// isn't wiped out by the re-renders that follow every add/remove), reused
// for both Tags and Lists. Same idea as campaign-builder.html's recipient
// pickers: search a couple characters instead of scrolling one giant
// alphabetical <select> of every tag/list in the account.
function renderSearchAddDropdown(containerId, items, selectedIds, onPick) {
  const el = document.getElementById(containerId);
  if (!el.dataset.init) {
    el.innerHTML = `<input class="pra-input search-add-input" type="text" placeholder="Search..."/><div class="search-add-dropdown"></div>`;
    el.dataset.init = '1';
  }
  const searchEl = el.querySelector('.search-add-input');
  const dropdownEl = el.querySelector('.search-add-dropdown');
  const showMatches = () => {
    const q = searchEl.value.trim().toLowerCase();
    const matches = items.filter(i => !selectedIds.includes(i.id) && i.name.toLowerCase().includes(q)).slice(0, 30);
    dropdownEl.innerHTML = matches.length ? matches.map(i => `<div class="search-add-option" data-id="${i.id}">${escapeHtml(i.name)}</div>`).join('') : `<div class="search-add-option-empty">${items.length ? 'No matches' : 'None yet'}</div>`;
    dropdownEl.classList.add('open');
    dropdownEl.querySelectorAll('.search-add-option').forEach(opt => opt.onclick = () => {
      searchEl.value = '';
      dropdownEl.classList.remove('open');
      onPick(opt.dataset.id);
    });
  };
  searchEl.oninput = showMatches;
  searchEl.onfocus = showMatches;
  // Delayed so a click on a .search-add-option (which fires blur first)
  // still registers before the dropdown disappears out from under it.
  searchEl.onblur = () => setTimeout(() => dropdownEl.classList.remove('open'), 150);
}
function renderOverlayTags() {

// ── Flat list (Tasks / Reminders) ───────────────────────────────────────
function itemHtml(item) {

  const isDone = !!item.done;
  return `
    <div class="inbox-item">
      <input type="checkbox" class="item-check" data-select="${item.id}" ${selectedIds.has(item.id) ? 'checked' : ''}/>

      </div>
      <div class="item-time">${fmtDate(item.at)}</div>
      <button class="item-done-btn" data-quick-done="${item.id}" title="${isDone ? 'Mark not done' : 'Mark done'}">${isDone ? '&#8635;' : '&#10003;'}</button>
    </div>
  `;
}
function sortItems(items) {
  const sorted = [...items];
  if (currentSort === 'name') sorted.sort((a, b) => (a.contact ? `${a.contact.first} ${a.contact.last}` : '').localeCompare(b.contact ? `${b.contact.first} ${b.contact.last}` : ''));
  else if (currentSort === 'asc') sorted.sort((a, b) => new Date(a.at) - new Date(b.at));
  else sorted.sort((a, b) => new Date(b.at) - new Date(a.at));
  return sorted;
}
function updateBulkActions() {
  const bar = document.getElementById('bulkActions');
  if (selectedIds.size) { bar.style.display = 'flex'; document.getElementById('selectedCount').textContent = selectedIds.size + ' selected'; }
  else bar.style.display = 'none';
}
function renderItemsPanel() {
  const panel = document.getElementById('itemsPanel');
  panel.innerHTML = currentItems.length ? currentItems.map(itemHtml).join('') : '<div class="pra-muted" style="padding:20px">Nothing here.</div>';
  panel.querySelectorAll('[data-select]').forEach(chk => chk.onchange = () => {
    if (chk.checked) selectedIds.add(chk.dataset.select); else selectedIds.delete(chk.dataset.select);
    updateBulkActions();
  });
  panel.querySelectorAll('[data-quick-done]').forEach(btn => btn.onclick = async () => {
    const item = currentItems.find(i => i.id === btn.dataset.quickDone);
    await markDone([btn.dataset.quickDone], !item?.done);
    loadItems();
  });
}
async function markDone(ids, done) {
  if (!ids.length) return;
  await fetch('/api/inbox/mark-done', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ids, done }) });
}
async function loadItems() {
  const panel = document.getElementById('itemsPanel');
  panel.innerHTML = '<div class="pra-muted" style="padding:20px">Loading…</div>';
  selectedIds.clear();
  updateBulkActions();
  const r = await fetch(`/api/inbox?tab=${currentTab}&view=${currentView}`);
  if (!r.ok) { panel.innerHTML = '<div class="pra-muted" style="padding:20px">Could not load.</div>'; return; }
  const { items } = await r.json();
  currentItems = sortItems(items);
  renderItemsPanel();
}
document.getElementById('bulkDoneBtn').onclick = async () => { await markDone([...selectedIds], true); showToast('Marked done'); loadItems(); };
document.getElementById('viewSelect').addEventListener('change', (e) => { currentView = e.target.value; loadItems(); });
document.getElementById('sortSelect').addEventListener('change', (e) => { currentSort = e.target.value; currentItems = sortItems(currentItems); renderItemsPanel(); });

// ── Resizable sidebar/chat-panel split ───────────────────────────────────
// Remembered per-browser (not per-account -- this is a local layout
// preference, not data) so it stays put across reloads. The mobile
// breakpoint's `width: 100% !important` (see CSS) wins over this inline
// style regardless of whatever was last dragged/saved on desktop.
const SIDEBAR_WIDTH_KEY = 'inboxSidebarWidth';
const SIDEBAR_MIN_WIDTH = 220, SIDEBAR_MAX_WIDTH = 560;
(function setupChatResize() {
  const sidebar = document.querySelector('.chat-sidebar');
  const handle = document.getElementById('chatResizeHandle');
  const saved = parseInt(localStorage.getItem(SIDEBAR_WIDTH_KEY), 10);
  if (saved && saved >= SIDEBAR_MIN_WIDTH && saved <= SIDEBAR_MAX_WIDTH) sidebar.style.width = saved + 'px';

  let dragging = false, startX = 0, startWidth = 0;
  handle.addEventListener('pointerdown', (e) => {
    dragging = true; startX = e.clientX; startWidth = sidebar.getBoundingClientRect().width;
    handle.classList.add('dragging');
    handle.setPointerCapture(e.pointerId);
    document.body.style.userSelect = 'none';
  });
  handle.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const width = Math.min(SIDEBAR_MAX_WIDTH, Math.max(SIDEBAR_MIN_WIDTH, startWidth + (e.clientX - startX)));
    sidebar.style.width = width + 'px';
  });
  const stopDrag = () => {
    if (!dragging) return;
    dragging = false;
    handle.classList.remove('dragging');
    document.body.style.userSelect = '';
    localStorage.setItem(SIDEBAR_WIDTH_KEY, Math.round(sidebar.getBoundingClientRect().width));
  };
  handle.addEventListener('pointerup', stopDrag);
  handle.addEventListener('pointercancel', stopDrag);
})();

(async function init() {
  // ownerFieldHtml/wireOwnerFields (crm-nav.js) read window.crmMe/
  // crmTeamUsers -- those are only guaranteed populated after this resolves.
  await window.crmNavReady;
  await loadRefs();
  await loadConversations();
})();
</script>

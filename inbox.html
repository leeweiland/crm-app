// No Save button -- every field PATCHes immediately on change, same
// pattern as contact-detail.html's Details panel.
async function autoSaveOverlay() {
  const r = await fetch('/api/contacts/' + overlayContact.id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(overlayContact) });
  if (!r.ok) { showToast('Could not save', true); return; }
  overlayContact = (await r.json()).contact;
  showToast('Saved');
  await loadRefs();
  await loadConversations(); // re-selects the open conversation if it's still selectedConvo/initialContactId, refreshing the header
}
// Selected tags/lists show only the first couple, same collapse pattern as
// contact-detail.html's Details panel -- a contact with a dozen imported
// segment tags shouldn't push the whole overlay's form fields off-screen.
// The "+N more" toggle renders separately from the pills so it can sit
// next to the section LABEL instead of trailing after the pills.
const OV_PILLS_COLLAPSE_LIMIT = 2;
let ovTagsExpanded = false, ovListsExpanded = false, ovHyrosTagsExpanded = false, ovHyrosUrlsExpanded = false;
function ovPillsBodyHtml(pills, expanded, emptyText) {
  if (!pills.length) return `<span class="pra-muted" style="font-size:.82rem">${emptyText}</span>`;
  return (expanded ? pills : pills.slice(0, OV_PILLS_COLLAPSE_LIMIT)).join('');
}
function ovToggleSlotHtml(count, expanded, toggleId) {
  if (count <= OV_PILLS_COLLAPSE_LIMIT) return '';
  return `<button type="button" class="pra-link" id="${toggleId}" style="font-size:.78rem">${expanded ? 'Show less' : `+${count - OV_PILLS_COLLAPSE_LIMIT} more`}</button>`;
}
// Hyros tag names all follow "@"/"$"/"!" -- everything else came from AC
// (or was added manually). Same naming-convention split as contact-detail.html.
function isHyrosTagName(name) { return /^[@$!]/.test(name); }
function hyrosUrlPill(label, detail, href) {
  const inner = href ? `<a href="${escapeHtml(href)}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">${escapeHtml(label)}</a>` : escapeHtml(label);
  return `<span class="tag-pill" style="cursor:default" title="${escapeHtml(detail || '')}">${inner}</span>`;
}
function renderOverlayHyrosTags() {
  const tagNames = (overlayContact.tags || []).map(id => overlayTags.find(t => t.id === id)?.name).filter(Boolean);
  const pills = tagNames.filter(isHyrosTagName).map(name => `<span class="tag-pill" style="cursor:default">${escapeHtml(name)}</span>`);
  document.getElementById('ovHyrosTagsWrap').innerHTML = ovPillsBodyHtml(pills, ovHyrosTagsExpanded, 'None.');
  document.getElementById('ovHyrosTagsToggleSlot').innerHTML = ovToggleSlotHtml(pills.length, ovHyrosTagsExpanded, 'ovHyrosTagsToggle');
  const toggle = document.getElementById('ovHyrosTagsToggle');
  if (toggle) toggle.onclick = () => { ovHyrosTagsExpanded = !ovHyrosTagsExpanded; renderOverlayHyrosTags(); };
}
function renderOverlayHyrosUrls() {
  const rows = [];
  if (overlayContact.hyrosTrackedUrl) rows.push(hyrosUrlPill('Tracked URL', overlayContact.hyrosTrackedUrl, overlayContact.hyrosTrackedUrl));
  if (overlayContact.hyrosPreviousUrl) rows.push(hyrosUrlPill('Previous URL', overlayContact.hyrosPreviousUrl, overlayContact.hyrosPreviousUrl));
  const firstClick = overlayThreadItems.find(i => i.itemType === 'activity' && (i.subject || '').startsWith('First ad click'));
  const lastClick = overlayThreadItems.find(i => i.itemType === 'activity' && (i.subject || '').startsWith('Last ad click'));
  if (firstClick) rows.push(hyrosUrlPill(firstClick.subject, `${firstClick.body || ''} · ${fmtDate(firstClick.at)}`));
  if (lastClick) rows.push(hyrosUrlPill(lastClick.subject, `${lastClick.body || ''} · ${fmtDate(lastClick.at)}`));
  if (overlayContact.hyrosOriginLead) {
    const o = overlayContact.hyrosOriginLead;
    rows.push(hyrosUrlPill('Origin Identity', `${[o.firstName, o.lastName].filter(Boolean).join(' ')} ${o.email || ''} ${(o.phoneNumbers || []).join(', ')}`));
  }
  document.getElementById('ovHyrosUrlsWrap').innerHTML = ovPillsBodyHtml(rows, ovHyrosUrlsExpanded, 'Not captured for this contact.');
  document.getElementById('ovHyrosUrlsToggleSlot').innerHTML = ovToggleSlotHtml(rows.length, ovHyrosUrlsExpanded, 'ovHyrosUrlsToggle');
  const toggle = document.getElementById('ovHyrosUrlsToggle');
  if (toggle) toggle.onclick = () => { ovHyrosUrlsExpanded = !ovHyrosUrlsExpanded; renderOverlayHyrosUrls(); };
}
// Generic search-to-add dropdown -- built once per container (so typing
// isn't wiped out by the re-renders that follow every add/remove), reused
// for both Tags and Lists. Same idea as campaign-builder.html's recipient
// pickers: search a couple characters instead of scrolling one giant
// alphabetical <select> of every tag/list in the account.
function renderSearchAddDropdown(containerId, items, selectedIds, onPick) {
  const el = document.getElementById(containerId);
  if (!el.dataset.init) {
    el.innerHTML = `<input class="pra-input search-add-input" type="text" placeholder="Search..."/><div class="search-add-dropdown"></div>`;
    el.dataset.init = '1';
  }
  const searchEl = el.querySelector('.search-add-input');
  const dropdownEl = el.querySelector('.search-add-dropdown');
  const showMatches = () => {
    const q = searchEl.value.trim().toLowerCase();
    const matches = items.filter(i => !selectedIds.includes(i.id) && i.name.toLowerCase().includes(q)).slice(0, 30);
    dropdownEl.innerHTML = matches.length ? matches.map(i => `<div class="search-add-option" data-id="${i.id}">${escapeHtml(i.name)}</div>`).join('') : `<div class="search-add-option-empty">${items.length ? 'No matches' : 'None yet'}</div>`;
    dropdownEl.classList.add('open');
    dropdownEl.querySelectorAll('.search-add-option').forEach(opt => opt.onclick = () => {
      searchEl.value = '';
      dropdownEl.classList.remove('open');
      onPick(opt.dataset.id);
    });
  };
  searchEl.oninput = showMatches;
  searchEl.onfocus = showMatches;
  // Delayed so a click on a .search-add-option (which fires blur first)
  // still registers before the dropdown disappears out from under it.
  searchEl.onblur = () => setTimeout(() => dropdownEl.classList.remove('open'), 150);
}
function renderOverlayTags() {
  const wrap = document.getElementById('ovTagsWrap');
  const pills = (overlayContact.tags || []).map(tagId => {
    const t = overlayTags.find(x => x.id === tagId);
    if (!t) return '';
    return `<span class="tag-pill">${escapeHtml(t.name)}<button data-tag="${tagId}" class="ovRemoveTag" type="button">&times;</button></span>`;
  }).filter(Boolean);
  wrap.innerHTML = ovPillsBodyHtml(pills, ovTagsExpanded, 'No tags yet.');
  document.getElementById('ovTagsToggleSlot').innerHTML = ovToggleSlotHtml(pills.length, ovTagsExpanded, 'ovTagsToggle');
  wrap.querySelectorAll('.ovRemoveTag').forEach(btn => btn.onclick = async () => {
    overlayContact.tags = overlayContact.tags.filter(id => id !== btn.dataset.tag);
    await autoSaveOverlay();
    renderOverlayTags();
  });
  const toggle = document.getElementById('ovTagsToggle');
  if (toggle) toggle.onclick = () => { ovTagsExpanded = !ovTagsExpanded; renderOverlayTags(); };
  renderSearchAddDropdown('ovAddTagBox', overlayTags, overlayContact.tags || [], async (tagId) => {
    overlayContact.tags.push(tagId);
    await autoSaveOverlay();
    renderOverlayTags();
  });
  renderOverlayHyrosTags();
}
function renderOverlayLists() {
  const wrap = document.getElementById('ovListsWrap');
  const pills = (overlayContact.listIds || []).map(listId => {
    const l = overlayLists.find(x => x.id === listId);
    if (!l) return '';
    return `<span class="tag-pill">${escapeHtml(l.name)}<button data-list="${listId}" class="ovRemoveList" type="button">&times;</button></span>`;
  }).filter(Boolean);
  wrap.innerHTML = ovPillsBodyHtml(pills, ovListsExpanded, 'Not on any lists.');
  document.getElementById('ovListsToggleSlot').innerHTML = ovToggleSlotHtml(pills.length, ovListsExpanded, 'ovListsToggle');
  wrap.querySelectorAll('.ovRemoveList').forEach(btn => btn.onclick = async () => {
    overlayContact.listIds = overlayContact.listIds.filter(id => id !== btn.dataset.list);
    await autoSaveOverlay();
    renderOverlayLists();
  });
  const toggle = document.getElementById('ovListsToggle');
  if (toggle) toggle.onclick = () => { ovListsExpanded = !ovListsExpanded; renderOverlayLists(); };
  renderSearchAddDropdown('ovAddListBox', overlayLists, overlayContact.listIds || [], async (listId) => {
    overlayContact.listIds.push(listId);
    await autoSaveOverlay();
    renderOverlayLists();
  });
}
function renderOverlayCustomFields() {
  const wrap = document.getElementById('ovCustomFieldsWrap');
  if (!overlayFields.length) { wrap.innerHTML = ''; return; }
  wrap.innerHTML = overlayFields.map(f => `
    <div class="field"><label class="pra-label">${escapeHtml(f.label)}</label>
      <input class="pra-input ov-custom-field-input" data-field="${f.id}" value="${escapeHtml(overlayContact.customFields?.[f.id] || '')}"/>
    </div>
  `).join('');
  wrap.querySelectorAll('.ov-custom-field-input').forEach(inp => inp.addEventListener('change', collectAndAutoSaveOverlay));
}
async function collectAndAutoSaveOverlay() {
  overlayContact.first = document.getElementById('ovFirst').value.trim();
  overlayContact.last = document.getElementById('ovLast').value.trim();
  overlayContact.accountName = document.getElementById('ovAccount').value.trim();
  overlayContact.email = document.getElementById('ovEmail').value.trim();
  overlayContact.phone = document.getElementById('ovPhone').value.trim();
  overlayContact.emailOptOut = document.getElementById('ovEmailOptOut').checked;
  overlayContact.smsOptOut = document.getElementById('ovSmsOptOut').checked;
  overlayContact.customFields = overlayContact.customFields || {};
  document.querySelectorAll('.ov-custom-field-input').forEach(inp => { overlayContact.customFields[inp.dataset.field] = inp.value; });
  await autoSaveOverlay();
  document.getElementById('contactOverlayName').textContent = `${overlayContact.first} ${overlayContact.last}`.trim() || 'Contact';
}
function renderOverlayOptOutBadges() {
  const emailOptOut = document.getElementById('ovEmailOptOut').checked;
  const smsOptOut = document.getElementById('ovSmsOptOut').checked;
  const badge = (label) => `<span class="pra-badge" style="background:#3a1414;color:#ff6b6b;border:1px solid #ff6b6b55">${label}</span>`;
  document.getElementById('ovOptOutBadges').innerHTML =
    (emailOptOut ? badge('EMAIL OPT-OUT') : '') + (smsOptOut ? badge('SMS OPT-OUT') : '');
}
['ovFirst', 'ovLast', 'ovAccount', 'ovEmail', 'ovPhone', 'ovEmailOptOut', 'ovSmsOptOut'].forEach(id => document.getElementById(id).addEventListener('change', collectAndAutoSaveOverlay));
document.getElementById('ovEmailOptOut').addEventListener('change', renderOverlayOptOutBadges);
document.getElementById('ovSmsOptOut').addEventListener('change', renderOverlayOptOutBadges);
// Click the dimmed backdrop itself (not the box) to dismiss -- e.target is
// only the backdrop element when the click didn't land on a descendant.
document.getElementById('contactOverlayModal').addEventListener('click', (e) => {
  if (e.target.id === 'contactOverlayModal') closeModal('contactOverlayModal');
});

// ── Flat list (Tasks / Reminders) ───────────────────────────────────────
function itemHtml(item) {
  const nameText = item.contact ? `${escapeHtml(item.contact.first)} ${escapeHtml(item.contact.last)}` : 'Unknown';
  const isDone = !!item.done;
  return `
    <div class="inbox-item">
      <input type="checkbox" class="item-check" data-select="${item.id}" ${selectedIds.has(item.id) ? 'checked' : ''}/>
      <div class="item-icon ${item.itemType}">${item.itemType === 'reminder' ? '⏰' : '☑'}</div>
      <div class="item-body">
        <div class="item-name">${nameText}</div>
        <div class="item-preview">${escapeHtml(item.title || '')}</div>
      </div>
      <div class="item-time">${fmtDate(item.at)}</div>
      <button class="item-done-btn" data-quick-done="${item.id}" title="${isDone ? 'Mark not done' : 'Mark done'}">${isDone ? '&#8635;' : '&#10003;'}</button>
    </div>
  `;
}
function sortItems(items) {
  const sorted = [...items];
  if (currentSort === 'name') sorted.sort((a, b) => (a.contact ? `${a.contact.first} ${a.contact.last}` : '').localeCompare(b.contact ? `${b.contact.first} ${b.contact.last}` : ''));
  else if (currentSort === 'asc') sorted.sort((a, b) => new Date(a.at) - new Date(b.at));
  else sorted.sort((a, b) => new Date(b.at) - new Date(a.at));
  return sorted;
}
function updateBulkActions() {
  const bar = document.getElementById('bulkActions');
  if (selectedIds.size) { bar.style.display = 'flex'; document.getElementById('selectedCount').textContent = selectedIds.size + ' selected'; }
  else bar.style.display = 'none';
}
function renderItemsPanel() {
  const panel = document.getElementById('itemsPanel');
  panel.innerHTML = currentItems.length ? currentItems.map(itemHtml).join('') : '<div class="pra-muted" style="padding:20px">Nothing here.</div>';
  panel.querySelectorAll('[data-select]').forEach(chk => chk.onchange = () => {
    if (chk.checked) selectedIds.add(chk.dataset.select); else selectedIds.delete(chk.dataset.select);
    updateBulkActions();
  });
  panel.querySelectorAll('[data-quick-done]').forEach(btn => btn.onclick = async () => {
    const item = currentItems.find(i => i.id === btn.dataset.quickDone);
    await markDone([btn.dataset.quickDone], !item?.done);
    loadItems();
  });
}
async function markDone(ids, done) {
  if (!ids.length) return;
  await fetch('/api/inbox/mark-done', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ids, done }) });
}
async function loadItems() {
  const panel = document.getElementById('itemsPanel');
  panel.innerHTML = '<div class="pra-muted" style="padding:20px">Loading…</div>';
  selectedIds.clear();
  updateBulkActions();
  const r = await fetch(`/api/inbox?tab=${currentTab}&view=${currentView}`);
  if (!r.ok) { panel.innerHTML = '<div class="pra-muted" style="padding:20px">Could not load.</div>'; return; }
  const { items } = await r.json();
  currentItems = sortItems(items);
  renderItemsPanel();
}
document.getElementById('bulkDoneBtn').onclick = async () => { await markDone([...selectedIds], true); showToast('Marked done'); loadItems(); };
document.getElementById('viewSelect').addEventListener('change', (e) => { currentView = e.target.value; loadItems(); });
document.getElementById('sortSelect').addEventListener('change', (e) => { currentSort = e.target.value; currentItems = sortItems(currentItems); renderItemsPanel(); });

// ── Resizable sidebar/chat-panel split ───────────────────────────────────
// Remembered per-browser (not per-account -- this is a local layout
// preference, not data) so it stays put across reloads. The mobile
// breakpoint's `width: 100% !important` (see CSS) wins over this inline
// style regardless of whatever was last dragged/saved on desktop.
const SIDEBAR_WIDTH_KEY = 'inboxSidebarWidth';
const SIDEBAR_MIN_WIDTH = 220, SIDEBAR_MAX_WIDTH = 560;
(function setupChatResize() {
  const sidebar = document.querySelector('.chat-sidebar');
  const handle = document.getElementById('chatResizeHandle');
  const saved = parseInt(localStorage.getItem(SIDEBAR_WIDTH_KEY), 10);
  if (saved && saved >= SIDEBAR_MIN_WIDTH && saved <= SIDEBAR_MAX_WIDTH) sidebar.style.width = saved + 'px';

  let dragging = false, startX = 0, startWidth = 0;
  handle.addEventListener('pointerdown', (e) => {
    dragging = true; startX = e.clientX; startWidth = sidebar.getBoundingClientRect().width;
    handle.classList.add('dragging');
    handle.setPointerCapture(e.pointerId);
    document.body.style.userSelect = 'none';
  });
  handle.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const width = Math.min(SIDEBAR_MAX_WIDTH, Math.max(SIDEBAR_MIN_WIDTH, startWidth + (e.clientX - startX)));
    sidebar.style.width = width + 'px';
  });
  const stopDrag = () => {
    if (!dragging) return;
    dragging = false;
    handle.classList.remove('dragging');
    document.body.style.userSelect = '';
    localStorage.setItem(SIDEBAR_WIDTH_KEY, Math.round(sidebar.getBoundingClientRect().width));
  };
  handle.addEventListener('pointerup', stopDrag);
  handle.addEventListener('pointercancel', stopDrag);
})();

(async function init() {
  // ownerFieldHtml/wireOwnerFields (crm-nav.js) read window.crmMe/
  // crmTeamUsers -- those are only guaranteed populated after this resolves.
  await window.crmNavReady;
  // loadConversations() doesn't actually depend on loadRefs()'s own output
  // (allStatuses/allUsers only matter for status-dropdown options and
  // avatar glow colors, not for fetching/rendering the conversation rows
  // themselves) -- these used to run one after the other, so any latency
  // in EITHER phase added directly onto total load time instead of
  // overlapping. Confirmed live this was a real contributor to the Inbox
  // feeling slow to open under any server load: three sequential waits
  // (crmNavReady, then loadRefs, then loadConversations) stack, they don't
  // overlap, so ordinary per-request variance compounds into a multi-
  // second wait instead of staying bounded by the single slowest request.
  await Promise.all([loadRefs(), loadConversations()]);
})();

// Live cross-tab/cross-user sync -- see inbox_backend.js's own comment on
// broadcastInboxUpdate for why this exists (a teammate marking done, or
// replying, used to only update THEIR OWN browser). One persistent
// connection per open Inbox tab; the browser's own EventSource already
// auto-reconnects with backoff on a dropped connection, so no manual
// retry logic is needed here.
// A new inbound message has no way to describe its own unread_count/preview/
// sort-position client-side (that's all computed server-side, batched --
// see message_index.js's scheduleConversationFlush), so unlike the 'done'
// case above this doesn't try to patch `conversations` in place -- it just
// asks the server for the current page again. Debounced so a burst of
// several messages arriving close together (a lead replying twice, several
// different leads texting in around the same time) triggers one reload,
// not one per message.
let newMessageRefreshTimer = null;
function scheduleConvoRefreshForNewMessage() {
  if (newMessageRefreshTimer) return;
  newMessageRefreshTimer = setTimeout(() => { newMessageRefreshTimer = null; loadConversations(true); }, 400);
}
function applyRemoteConvoUpdate(data) {
  if (data.type === 'new_message') {
    scheduleConvoRefreshForNewMessage();
    // The thread currently open in the chat panel doesn't come from
    // `conversations` at render time -- it's its own fetched threadItems
    // array (see selectConversation) -- so a sidebar-only refresh above
    // wouldn't show the new message to someone already looking at this
    // exact contact. Re-fetch that thread too when it's the open one.
    if (selectedConvo?.contactId === data.contactId) selectConversation(selectedConvo, true);
    return;
  }
  if (data.type !== 'done') return;
  const inList = conversations.find(x => x.contactId === data.contactId);
  if (inList) {
    // Same "done deterministically means unreadCount is 0, so drop the row
    // if Unresponded is the active filter" logic as the local Mark Done
    // click handler above -- kept in sync with it; a genuine reconcile
    // still happens on the next real loadConversations() either way.
    inList.done = data.done;
    if (data.done) { inList.unreadCount = 0; recentlyConfirmedDone.set(data.contactId, Date.now()); } else recentlyConfirmedDone.delete(data.contactId);
    if (convoFilter === 'unresponded' && inList.unreadCount === 0) {
      conversations = conversations.filter(x => x.contactId !== data.contactId);
    }
    renderSidebar();
  }
  if (selectedConvo?.contactId === data.contactId) {
    selectedConvo.done = data.done;
    const btn = document.getElementById('chatMarkDoneBtn');
    if (btn) btn.textContent = data.done ? 'Mark Not Done' : 'Mark Done';
  }
}
(function connectInboxEvents() {
  const es = new EventSource('/api/inbox/events');
  es.onmessage = (e) => {
    try { applyRemoteConvoUpdate(JSON.parse(e.data)); } catch { /* malformed payload -- ignore rather than throw */ }
  };
})();
</script>

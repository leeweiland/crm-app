<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Inbox — CRM</title>
<link rel="stylesheet" href="/crm-design-system.css"/>
<style>
  .tabs { display: flex; gap: 6px; margin-bottom: 18px; border-bottom: 1px solid var(--pra-border); flex-wrap: wrap; }
  .tab-btn { background: none; border: none; color: var(--pra-dim); font-family: var(--font-primary); font-weight: 700; font-size: .84rem; padding: 10px 14px; cursor: pointer; border-bottom: 2px solid transparent; }
  .tab-btn.active { color: var(--pra-white); border-bottom-color: var(--pra-blue); }
  .inbox-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--pra-border); }
  .inbox-item:last-child { border-bottom: none; }
  .item-icon { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: .8rem; flex-shrink: 0; }
  .item-icon.email { background: rgba(0,155,255,0.15); color: var(--pra-blue); }
  .item-icon.sms { background: rgba(57,255,20,0.15); color: var(--pra-green); }
  .item-icon.call { background: rgba(255,59,59,0.15); color: var(--pra-red); }
  .item-icon.task, .item-icon.reminder { background: rgba(255,193,7,0.15); color: #ffc107; }
  .item-body { flex: 1; min-width: 0; }
  .item-name { font-size: .88rem; }
  .item-preview { font-size: .8rem; color: var(--pra-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-time { font-size: .74rem; color: var(--pra-dim); white-space: nowrap; }
  .item-status { font-size: .66rem; text-transform: uppercase; padding: 2px 8px; border-radius: 8px; background: rgba(255,255,255,0.08); }
  .inbox-item { cursor: pointer; transition: background .1s; }
  .inbox-item:hover { background: rgba(255,255,255,0.03); }
  .item-name-link { color: var(--pra-white); text-decoration: none; font-weight: 700; }
  .item-name-link:hover { color: var(--pra-blue); text-decoration: underline; }
  .msg-detail-meta { display: flex; gap: 16px; flex-wrap: wrap; font-size: .8rem; color: var(--pra-dim); margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--pra-border); }
  .msg-detail-body { background: #fff; color: #111; border-radius: 8px; padding: 16px; max-height: 50vh; overflow-y: auto; font-size: .9rem; white-space: pre-wrap; }
  .msg-detail-body iframe { width: 100%; min-height: 300px; border: none; }
  .msg-track-badge { font-size: .7rem; padding: 3px 9px; border-radius: 8px; }
  .msg-track-badge.on { background: rgba(57,255,20,0.15); color: var(--pra-green); }
  .msg-track-badge.off { background: rgba(255,255,255,0.06); color: var(--pra-dim); }
</style>
</head>
<body>
<div class="pra-root">
  <div class="app-shell">
    <div class="app-sidebar" id="appSidebar"></div>
    <div class="app-main">
      <div class="pra-h1" style="margin-bottom:16px">Inbox</div>
      <div class="tabs">
        <button class="tab-btn active" data-tab="primary">Primary</button>
        <button class="tab-btn" data-tab="emails">Emails</button>
        <button class="tab-btn" data-tab="messages">Messages</button>
        <button class="tab-btn" data-tab="tasks">Tasks</button>
        <button class="tab-btn" data-tab="reminders">Reminders</button>
        <button class="tab-btn" data-tab="potential">Potential Contacts</button>
        <div style="flex:1"></div>
        <button class="pra-btn pra-btn-ghost pra-btn-sm" id="newTaskBtn">+ New Task</button>
      </div>
      <div class="pra-panel" id="itemsPanel"></div>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="confirmPotentialModal">
  <div class="pra-panel modal-box">
    <div class="pra-h2" style="margin-bottom:16px">Confirm Contact</div>
    <div class="pra-muted" id="confirmPotentialFrom" style="font-size:.82rem;margin-bottom:14px"></div>
    <div class="field-row">
      <div class="field"><label class="pra-label">First name</label><input class="pra-input" id="confirmFirst"/></div>
      <div class="field"><label class="pra-label">Last name</label><input class="pra-input" id="confirmLast"/></div>
    </div>
    <div class="btn-row" style="display:flex;gap:10px;margin-top:14px">
      <button class="pra-btn" id="saveConfirmBtn" style="flex:1">Create Contact</button>
      <button class="pra-btn pra-btn-ghost" onclick="closeModal('confirmPotentialModal')">Cancel</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="messageDetailModal">
  <div class="pra-panel modal-box eb-fullscreen" style="max-width:760px">
    <div class="pra-h2" style="margin-bottom:6px" id="msgDetailTitle">Message</div>
    <div class="msg-detail-meta" id="msgDetailMeta"></div>
    <div class="msg-detail-body" id="msgDetailBody"></div>
    <button class="pra-btn pra-btn-ghost" style="width:100%;margin-top:16px" onclick="closeModal('messageDetailModal')">Close</button>
  </div>
</div>

<div class="modal-backdrop" id="taskModal">
  <div class="pra-panel modal-box">
    <div class="pra-h2" style="margin-bottom:16px">New Task</div>
    <div class="field"><label class="pra-label">Type</label><select class="pra-select" id="taskType"><option value="task">Task</option><option value="reminder">Reminder</option></select></div>
    <div class="field"><label class="pra-label">Contact (optional)</label><select class="pra-select" id="taskContact"><option value="">None</option></select></div>
    <div class="field"><label class="pra-label">Title</label><input class="pra-input" id="taskTitle"/></div>
    <div class="field"><label class="pra-label">Due</label><input class="pra-input" type="datetime-local" id="taskDue"/></div>
    <div class="btn-row" style="display:flex;gap:10px;margin-top:14px">
      <button class="pra-btn" id="saveTaskBtn" style="flex:1">Save</button>
      <button class="pra-btn pra-btn-ghost" onclick="closeModal('taskModal')">Cancel</button>
    </div>
  </div>
</div>

<script src="/crm-nav.js"></script>
<script>
function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
function escapeHtml(s) { const d = document.createElement('div'); d.textContent = String(s ?? ''); return d.innerHTML; }
function fmtDate(iso) { return iso ? new Date(iso).toLocaleString() : ''; }

let currentTab = 'primary', allContacts = [], currentItems = [];
const ICONS = { email: '✉', sms: '💬', task: '☑', reminder: '⏰' };

async function loadContacts() {
  const r = await fetch('/api/contacts');
  allContacts = r.ok ? (await r.json()).contacts : [];
  document.getElementById('taskContact').innerHTML = '<option value="">None</option>' + allContacts.map(c => `<option value="${c.id}">${escapeHtml(c.first)} ${escapeHtml(c.last)}</option>`).join('');
}

function itemHtml(item) {
  const nameText = item.contact ? `${escapeHtml(item.contact.first)} ${escapeHtml(item.contact.last)}` : (item.from || item.to || 'Unknown');
  const name = item.contactId ? `<a class="item-name-link" href="/contact-detail.html?id=${item.contactId}" onclick="event.stopPropagation()">${nameText}</a>` : `<span class="item-name-link" style="cursor:default">${nameText}</span>`;
  let preview = '';
  if (item.itemType === 'email' || item.itemType === 'sms') preview = `${item.direction === 'inbound' ? 'Received' : 'Sent'}: ${escapeHtml(item.subject || item.bodyPreview || '')}`;
  else preview = escapeHtml(item.title || '');
  const confirmBtn = (currentTab === 'potential' && !item.contactId)
    ? `<button class="pra-btn pra-btn-ghost pra-btn-sm" data-confirm-potential="${item.id}" data-from="${escapeHtml(item.from || '')}" onclick="event.stopPropagation()">+ Add Contact</button>` : '';
  const clickable = (item.itemType === 'email' || item.itemType === 'sms') ? `data-open-message="${item.id}"` : '';
  return `
    <div class="inbox-item" ${clickable}>
      <div class="item-icon ${item.itemType}">${ICONS[item.itemType] || '•'}</div>
      <div class="item-body">
        <div class="item-name">${name}</div>
        <div class="item-preview">${preview}</div>
      </div>
      ${confirmBtn}
      ${item.status ? `<span class="item-status">${escapeHtml(item.status)}</span>` : ''}
      <div class="item-time">${fmtDate(item.at)}</div>
    </div>
  `;
}

function openMessageDetail(id) {
  const item = currentItems.find(i => i.id === id);
  if (!item) return;
  const nameText = item.contact ? `${item.contact.first} ${item.contact.last}` : (item.from || item.to || 'Unknown');
  document.getElementById('msgDetailTitle').textContent = item.subject || (item.itemType === 'sms' ? 'SMS' : 'Email');
  const opened = (item.statusHistory || []).find(h => h.status === 'opened');
  const clicked = (item.statusHistory || []).find(h => h.status === 'clicked');
  const meta = [
    `<span><strong>${item.direction === 'inbound' ? 'From' : 'To'}:</strong> ${escapeHtml(nameText)}${item.contact ? ' &lt;' + escapeHtml(item.to || item.from || '') + '&gt;' : ''}</span>`,
    `<span><strong>When:</strong> ${fmtDate(item.at)}</span>`,
    `<span><strong>Status:</strong> ${escapeHtml(item.status || '')}</span>`,
  ];
  if (item.itemType === 'email' && item.direction === 'outbound') {
    meta.push(`<span class="msg-track-badge ${opened ? 'on' : 'off'}">${opened ? 'Opened ' + fmtDate(opened.at) : 'Not opened'}</span>`);
    meta.push(`<span class="msg-track-badge ${clicked ? 'on' : 'off'}">${clicked ? 'Clicked ' + fmtDate(clicked.at) : 'Not clicked'}</span>`);
  }
  document.getElementById('msgDetailMeta').innerHTML = meta.join('');
  const bodyEl = document.getElementById('msgDetailBody');
  if (item.itemType === 'email') {
    bodyEl.innerHTML = '';
    const iframe = document.createElement('iframe');
    bodyEl.appendChild(iframe);
    iframe.srcdoc = item.body || '<p style="font-family:sans-serif;color:#888">(no content stored for this message)</p>';
  } else {
    bodyEl.textContent = item.body || item.bodyPreview || '(no content)';
  }
  openModal('messageDetailModal');
}

async function loadItems() {
  const panel = document.getElementById('itemsPanel');
  panel.innerHTML = '<div class="pra-muted" style="padding:20px">Loading…</div>';
  const r = await fetch('/api/inbox?tab=' + currentTab);
  if (!r.ok) { panel.innerHTML = '<div class="pra-muted" style="padding:20px">Could not load.</div>'; return; }
  const { items } = await r.json();
  currentItems = items;
  panel.innerHTML = items.length ? items.map(itemHtml).join('') : '<div class="pra-muted" style="padding:20px">Nothing here yet.</div>';
  document.querySelectorAll('[data-confirm-potential]').forEach(btn => btn.onclick = () => {
    document.getElementById('confirmPotentialModal').dataset.messageId = btn.dataset.confirmPotential;
    document.getElementById('confirmPotentialFrom').textContent = 'From: ' + btn.dataset.from;
    document.getElementById('confirmFirst').value = '';
    document.getElementById('confirmLast').value = '';
    openModal('confirmPotentialModal');
  });
  document.querySelectorAll('[data-open-message]').forEach(row => row.onclick = () => openMessageDetail(row.dataset.openMessage));
}

document.getElementById('saveConfirmBtn').onclick = async () => {
  const first = document.getElementById('confirmFirst').value.trim();
  if (!first) { showToast('First name is required', true); return; }
  const body = { messageId: document.getElementById('confirmPotentialModal').dataset.messageId, first, last: document.getElementById('confirmLast').value.trim() };
  const r = await fetch('/api/inbox/confirm-potential', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) { showToast('Could not create contact', true); return; }
  closeModal('confirmPotentialModal');
  showToast('Contact created');
  loadItems();
};

document.querySelectorAll('.tab-btn').forEach(btn => btn.onclick = () => {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentTab = btn.dataset.tab;
  loadItems();
});

document.getElementById('newTaskBtn').onclick = () => openModal('taskModal');
document.getElementById('saveTaskBtn').onclick = async () => {
  const title = document.getElementById('taskTitle').value.trim();
  if (!title) { showToast('Title is required', true); return; }
  const dueVal = document.getElementById('taskDue').value;
  const body = {
    type: document.getElementById('taskType').value,
    contactId: document.getElementById('taskContact').value || null,
    title, dueAt: dueVal ? new Date(dueVal).toISOString() : null,
  };
  await fetch('/api/tasks', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  closeModal('taskModal');
  showToast('Task created');
  loadItems();
};

(async function init() { await loadContacts(); await loadItems(); })();
</script>
</body>
</html>

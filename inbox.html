<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Inbox — CRM</title>
<link rel="stylesheet" href="/crm-design-system.css"/>
<style>
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; border-bottom: 1px solid var(--pra-border); flex-wrap: wrap; align-items: center; }
  .tab-btn { background: none; border: none; color: var(--pra-dim); font-family: var(--font-primary); font-weight: 700; font-size: .84rem; padding: 10px 14px; cursor: pointer; border-bottom: 2px solid transparent; }
  .tab-btn.active { color: var(--pra-white); border-bottom-color: var(--pra-blue); }

  /* Away toggle -- same track+thumb switch used in ai-agents.html/
     flow-builder.html, duplicated here since this app has no shared
     component story for plain static pages. On = Away (AI Active is
     working this user's leads); off = Active (business as usual). */
  .active-toggle { width: 40px; height: 22px; border-radius: 11px; background: var(--pra-border); border: none; cursor: pointer; position: relative; padding: 0; flex-shrink: 0; transition: background .15s; }
  .active-toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .15s; }
  .active-toggle.on { background: var(--pra-blue); }
  .active-toggle.on::after { left: 20px; }

  /* ── Activity feed (a user's own sent SMS/email, including AI-sent
     while they were Away) ── */
  .activity-item { border-bottom: 1px solid var(--pra-border); }
  .activity-item:last-child { border-bottom: none; }
  .activity-row { display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px; font-size: .84rem; cursor: pointer; }
  .activity-row.no-expand { cursor: default; }
  .activity-channel-pill { font-size: .64rem; text-transform: uppercase; padding: 2px 7px; border-radius: 7px; background: rgba(255,255,255,.08); color: var(--pra-dim); flex-shrink: 0; margin-top: 2px; }
  .activity-channel-pill.ai_active, .activity-channel-pill.ai_coverage, .activity-channel-pill.behavioral_trigger { background: rgba(0,155,255,0.15); color: var(--pra-blue); }
  .activity-body { flex: 1; min-width: 0; }
  .activity-body .activity-contact { font-weight: 700; }
  .activity-body .activity-subject { font-weight: 600; color: var(--pra-white); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .activity-body .activity-preview { color: var(--pra-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .activity-time { font-size: .74rem; color: var(--pra-dim); flex-shrink: 0; white-space: nowrap; }
  .activity-detail { display: none; padding: 0 14px 14px 44px; }
  .activity-detail.open { display: block; }
  .activity-detail iframe { width: 100%; min-height: 220px; border: 1px solid var(--pra-border); border-radius: 8px; background: #fff; }
  .activity-view-thread-btn { margin-top: 10px; }

  /* ── Flat list (Tasks / Reminders) ── */
  .inbox-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .inbox-toolbar select { max-width: 160px; }
  .bulk-actions { display: flex; align-items: center; gap: 8px; }
  .inbox-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--pra-border); }
  .inbox-item:last-child { border-bottom: none; }
  .item-check { flex-shrink: 0; cursor: pointer; width: 16px; height: 16px; }
  .item-icon { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: .8rem; flex-shrink: 0; }
  .item-icon.task, .item-icon.reminder { background: rgba(255,193,7,0.15); color: #ffc107; }
  .item-body { flex: 1; min-width: 0; }
  .item-name { font-size: .88rem; }
  .item-preview { font-size: .8rem; color: var(--pra-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-time { font-size: .74rem; color: var(--pra-dim); white-space: nowrap; }
  .item-done-btn { background: none; border: 1px solid var(--pra-border); color: var(--pra-dim); border-radius: 6px; width: 28px; height: 28px; cursor: pointer; flex-shrink: 0; font-size: .8rem; }
  .item-done-btn:hover { border-color: var(--pra-green); color: var(--pra-green); }
  .inbox-row { cursor: pointer; transition: background .1s; }
  .inbox-row:hover { background: rgba(255,255,255,0.03); }

  /* ── Chat shell ── */
  /* height set twice on purpose -- vh fallback, dvh (real visible
     viewport, not mobile's "largest possible" 100vh) wins when supported.
     Without this the compose bar at the bottom can render below the
     actually-visible screen whenever the address bar is showing. */
  .chat-shell { display: flex; height: calc(100vh - 190px); height: calc(100dvh - 190px); min-height: 420px; border: 1px solid var(--pra-border); border-radius: 10px; overflow: hidden; }
  .chat-sidebar { width: 300px; flex-shrink: 0; background: var(--pra-panel); display: flex; flex-direction: column; min-width: 0; }
  /* Drag handle between the conversation list and the chat panel -- the
     border that used to sit on .chat-sidebar itself moved onto this, since
     the handle needs its own hit area (6px) wider than a 1px visual line. */
  .chat-resize-handle { width: 6px; flex-shrink: 0; cursor: col-resize; position: relative; background: transparent; }
  .chat-resize-handle::after { content: ''; position: absolute; top: 0; bottom: 0; left: 2px; width: 1px; background: var(--pra-border); }
  .chat-resize-handle:hover::after, .chat-resize-handle.dragging::after { left: 0; width: 6px; background: var(--pra-blue); opacity: .5; }
  .chat-sidebar-search { padding: 10px; border-bottom: 1px solid var(--pra-border); flex-shrink: 0; }
  .convo-list { flex: 1; overflow-y: auto; }

  .convo-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--pra-border); cursor: pointer; }
  .convo-row:hover { background: rgba(255,255,255,0.03); }
  .convo-row.selected { background: var(--pra-blue-dim); border-left: 3px solid var(--pra-blue); padding-left: 9px; }
  .convo-row.pinned { background: rgba(0,155,255,0.04); }
  /* Multi-select highlight -- deliberately distinct from .selected above
     (that one marks whichever thread is currently OPEN, an unrelated,
     single-row concept that can be true at the same time as this). */
  .convo-row.multi-selected { background: rgba(0,155,255,0.16); box-shadow: inset 0 0 0 1px var(--pra-blue); }
  .convo-row { transition: transform .18s ease, opacity .18s ease; }
  .convo-row.swiping { transition: none; }
  /* Outer glow color is set inline per row (--status-glow, from the
     contact's CRM status -- see STATUS_GLOW below); background flips to
     the brightest neon green specifically for an unresponded thread,
     overriding the status color so "needs a reply" always reads at a
     glance regardless of what status the lead is in. */
  .convo-avatar { box-shadow: 0 0 0 2px var(--status-glow, transparent), 0 0 9px 2px var(--status-glow-soft, transparent); transition: box-shadow .15s, background .15s; }
  .convo-avatar.has-unread { background: #39ff14; color: #0a0a0d; }
  #chatStatusSelect, .convo-status-select { box-shadow: 0 0 0 2px var(--status-glow, transparent), 0 0 9px 2px var(--status-glow-soft, transparent); transition: box-shadow .15s; }
  /* No flex-shrink:0 here (unlike the type badge/date below), but a real
     fixed width now (not just max-width, and no more per-row inline
     statusSelectWidthRule sizing-to-content) -- .convo-name is the row's
     only flex:1 item, so it absorbs whatever width this column ISN'T
     using; a short status like "BOOKED" sized to its own text let the
     name grow wider than next to a longer one like "APPLICATION",
     shifting the whole assigned/type-badge/date cluster left or right
     row-to-row instead of lining up like a table column. Native <select>
     text already left-aligns inside a fixed-width box, so this also
     answers "align these columns to the left" for free. Can still SHRINK
     under real pressure (default flex-shrink:1, no flex-basis override)
     so a resized-narrow sidebar still gives ground here before the name
     does, same protection the old max-width-only rule was for. convo-
     owner-field gets the same treatment right below -- both scoped to
     these sidebar-row-specific classes now, not the bare owner-field-
     select every assigned-user dropdown carries (that used to also cap
     the chat panel header's and Contacts table's copies at this same
     tight width, truncating a name like "Lee Weiland" to "Lee We…" with
     room to spare -- see crm-design-system.css's .owner-field-select). */
  .convo-status-select { font-size: .72rem; padding: 2px 20px 2px 6px; width: 100px; max-width: 100px; }
  .convo-owner-field { width: 100px; max-width: 100px; }
  /* Same misalignment bug, same fix -- this badge sits AFTER convo-name in
     the row but its width still fed back into where status/owner (which
     come BEFORE it) start: since convo-name is the row's only flex:1 item,
     a narrower badge (e.g. "GYM", 3 chars) left name MORE room to grow
     than a wider one ("ONLINE", 6 chars) did, and status/owner sit right
     after name -- so their left edge shifted with it, even though this
     badge visually comes later. Fixed width for every value this can
     show (online/gym/blank's "SET TYPE" fallback) closes that. */
  .convo-row [data-type-badge] { display: inline-block; width: 64px; text-align: center; flex-shrink: 0; }
  /* Fixed-width wrapper regardless of state (same reasoning as the type
     badge comment above) -- only the icon's COLOR changes with whether a
     booking exists, never the space it takes, so it can't shift anything
     else in the row left/right depending on which contacts have one. */
  .convo-booking-mark { width: 16px; flex-shrink: 0; display: inline-flex; color: var(--pra-border); }
  .convo-booking-mark.on { color: var(--pra-green); }
  .convo-booking-mark svg { width: 15px; height: 15px; }
  /* Two rows, both plain single-line flex rows (never wrap) -- row 1 is
     identity + metadata (name, status, assigned, type, time), row 2 is the
     message preview + pin/star. Name and preview are the only two elements
     that actually FLEX (min-width:0 + ellipsis); everything else here is
     flex-shrink:0 with a small fixed/capped size, so they never eat into
     the name or preview's space no matter how narrow the row gets. */
  .convo-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .convo-top { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; }
  .convo-pinned-mark { flex-shrink: 0; color: var(--pra-blue); display: inline-flex; }
  .convo-pinned-mark svg { width: 11px; height: 11px; }
  /* min-width isn't 0 here on purpose -- the name is the one thing in this
     row with no other way to identify who it is (status has its glow
     color, the rest are secondary metadata), so it gets a guaranteed floor
     instead of being the only element that shrinks all the way to nothing
     when the row is tight. */
  .convo-name { font-weight: 700; font-size: .86rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 44px; }
  /* min-width (not just white-space:nowrap) so the date column has a
     consistent starting edge down the list -- .convo-name is the row's
     only flex:1 item, so it absorbs whatever width this column ISN'T
     using; a short date like "Sep 1" let the name grow wider than next to
     a longer one like "Aug 28", shifting the whole status/owner/type
     badge cluster left or right row-to-row instead of lining up like a
     table column. Sized for the longest realistic value (a same-day
     time, e.g. "12:45 PM") with text-align:right so shorter values still
     land flush with the ones next to them. */
  .convo-time { font-size: .68rem; color: var(--pra-dim); white-space: nowrap; flex-shrink: 0; min-width: 54px; text-align: right; }
  .convo-time.has-unread { color: #39ff14; font-weight: 700; }
  .convo-bottom { display: flex; align-items: center; gap: 4px; }
  .convo-preview { font-size: .78rem; font-weight: 400; color: var(--pra-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0; }
  .convo-preview .bubble-ticks { display: inline-flex; flex-shrink: 0; }
  .convo-icon-btn { width: 22px; height: 22px; border-radius: 5px; border: none; background: transparent; color: var(--pra-dim); cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: .5; flex-shrink: 0; }
  .convo-icon-btn:hover { opacity: 1; }
  .convo-icon-btn.on { opacity: 1; }
  .convo-icon-btn.pin-btn.on { color: var(--pra-blue); }
  .convo-icon-btn.star-btn.on { color: #ffd54a; }
  .convo-icon-btn svg { width: 14px; height: 14px; }
  .convo-unread-badge { background: #39ff14; color: #0a0a0d; font-family: var(--font-secondary); font-size: .68rem; font-weight: 700; min-width: 18px; height: 18px; border-radius: 9px; display: flex; align-items: center; justify-content: center; padding: 0 5px; flex-shrink: 0; }
  .convo-add-btn { flex-shrink: 0; }
  .type-badge-short { display: none; }

  /* ── Mobile: single-pane, same pattern as chat-app's chat.html ── */
  @media (max-width: 900px) {
    /* 195px, not the desktop rule's 160px -- .mobile-sticky-header adds
       ~28px of padding/margin below the title+tabs that the 160px estimate
       predates. dvh (real visible viewport) wins over vh when supported. */
    .chat-shell { height: calc(100vh - 195px); height: calc(100dvh - 195px); }
    .chat-sidebar { width: 100% !important; }
    .chat-resize-handle { display: none; }
    #chatView.thread-open .chat-sidebar { display: none; }
    #chatView:not(.thread-open) .chat-panel { display: none; }
    .chat-back-btn { display: inline-flex !important; }

    /* An open thread breaks out of the normal page chrome entirely (fixed,
       full viewport) and hides the hamburger/top logo bar + the Inbox/
       Tasks/Reminders row -- same single-pane "just a back button and the
       thread" pattern as chat-app's own mobile chat view, so the whole
       screen goes to messages instead of ~195px of it staying reserved for
       chrome that a back button already makes redundant here. */
    #chatView.thread-open {
      position: fixed; inset: 0; z-index: 260;
      height: 100vh; height: 100dvh;
    }
    body:has(#chatView.thread-open) .app-sidebar-toggle-btn,
    body:has(#chatView.thread-open) .app-mobile-logo { display: none; }
    .app-main:has(#chatView.thread-open) .mobile-sticky-header { display: none; }

    /* Status/assigned shrink hard on mobile -- a native select can't be
       squeezed by flex alone (intrinsic content width), so this caps the
       mobile-select-enhancer's replacement button instead (crm-nav.js
       snapshots this max-width when it builds that button). Their own
       label already ellipsizes inside that width (.mobile-select-trigger-
       label), so "FOLLOW UP (They have a Task / Date set)" still reads as
       "F..." rather than pushing the row wider -- the status GLOW color is
       what actually communicates status at a glance on mobile; the select
       is there to change it, not to be read as text. Genuinely tight (46px)
       on purpose: on a 375px phone, six items competing for one line means
       every pixel these don't take is a pixel the name gets back, and the
       name is the one thing here that has no other way to be identified. */
    .convo-top { gap: 4px; }
    .convo-status-select, .convo-owner-field { max-width: 46px; font-size: .64rem; padding: 2px 14px 2px 4px; }
    /* The compact width above only shrinks the underlying <select>/anchor --
       .mobile-select-trigger (the actual visible button once the mobile
       enhancer swaps in, see crm-nav.js) has its own much bigger padding
       (10px 12px, sized for a normal full-width form field) that doesn't
       inherit from either, so the closed box stayed tall/bulky even after
       the width shrank. Matches the compact feel of the type badge (.pra-
       badge) it sits next to. */
    .convo-status-select .mobile-select-trigger, .convo-owner-field .mobile-select-trigger { padding: 3px 16px 3px 6px; }
    .convo-status-select .mobile-select-trigger-label, .convo-owner-field .mobile-select-trigger-label { font-size: .64rem; }
    .convo-status-select .mobile-select-trigger-caret, .convo-owner-field .mobile-select-trigger-caret { font-size: .6em; }
    .convo-row [data-type-badge] { padding: 2px 5px !important; width: 20px; }
    .convo-row .type-badge-full { display: none; }
    .convo-row .type-badge-short { display: inline; }
    .convo-time { font-size: .64rem; min-width: 44px; }
  }
  /* The conversation panel itself (chat-panel, chat-thread, bubbles,
     email/note bubbles, track badges, compose bar, AI assist, task/note/
     schedule popovers) now lives in crm-design-system.css, shared with
     contact-detail.html via conversation-panel.js. Don't re-add page-local
     copies here -- see that file's own header comment. */

  /* ── Chat sidebar: filter/sort row ── */
  .chat-sidebar-filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 10px 10px; flex-shrink: 0; }
  .chat-sidebar-filters select { flex: 1; min-width: 84px; font-size: .76rem; padding: 6px 8px; }
  @media (max-width: 900px) {
    /* Full label text, no truncation or 2-line wrapping -- each box sizes
       to its own content and the row scrolls horizontally if that's wider
       than the screen, instead of shrinking/cutting off any one box. */
    .chat-sidebar-filters { gap: 4px; flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .chat-sidebar-filters select { flex: 0 0 auto; min-width: 0; width: auto; font-size: .68rem; padding: 6px 4px; }
    .chat-sidebar-filters .mobile-select-anchor { width: auto; } /* .pra-select's width:100% would otherwise become the flex-basis and force each box to fill the row */
    .chat-sidebar-filters .mobile-select-trigger-label { overflow: visible; text-overflow: clip; white-space: nowrap; }
  }

  /* ── Right-click / long-press context menu on chat rows ── */
  .context-menu { position: fixed; z-index: 400; min-width: 170px; background: var(--pra-panel-2); border: 1px solid var(--pra-border); border-radius: 8px; padding: 5px; box-shadow: 0 8px 28px rgba(0,0,0,0.5); display: none; }
  .context-menu.show { display: block; }
  .context-menu button { display: flex; align-items: center; width: 100%; padding: 8px 10px; background: none; border: none; color: var(--pra-white); font-family: var(--font-primary); font-size: .83rem; text-align: left; border-radius: 5px; cursor: pointer; }
  .context-menu button:hover { background: rgba(255,255,255,0.06); }
  .context-menu button.danger { color: var(--pra-red); }

  /* ── Contact details overlay (opened from the chat panel's name link) ── */
  .tag-pill { display: inline-flex; align-items: center; gap: 6px; font-size: .74rem; padding: 4px 10px; border-radius: 14px; background: var(--pra-blue-dim); color: var(--pra-blue); margin: 0 6px 6px 0; }
  .tag-pill button { background: none; border: none; color: inherit; cursor: pointer; font-size: .8rem; padding: 0; }
  .ov-sub-label { font-family: var(--font-secondary); font-size: .66rem; text-transform: uppercase; letter-spacing: .06em; color: var(--pra-dim); margin: 16px 0 8px; }
  /* Searchable "add a tag/list" dropdown -- same pattern as campaign-builder's
     recipient pickers, so you search a couple characters instead of scrolling
     a giant alphabetical <select> of every tag/list in the account. */
  .search-add { position: relative; margin-top: 8px; }
  .search-add-dropdown { display: none; position: absolute; top: 100%; left: 0; right: 0; z-index: 50; max-height: 220px; overflow-y: auto; background: var(--pra-panel-2); border: 1px solid var(--pra-border); border-radius: 8px; margin-top: 4px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
  .search-add-dropdown.open { display: block; }
  .search-add-option { padding: 8px 12px; font-size: .82rem; cursor: pointer; }
  .search-add-option:hover { background: rgba(255,255,255,0.06); }
  .search-add-option-empty { padding: 8px 12px; font-size: .8rem; color: var(--pra-dim); }
</style>
</head>
<body>
<div class="pra-root">
  <div class="app-shell">
    <div class="app-sidebar" id="appSidebar"></div>
    <div class="app-main">
      <div class="mobile-sticky-header">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
          <div class="pra-h1">Inbox</div>
          <button type="button" id="awayToggleBtn" class="active-toggle" style="display:none" title="Away hands your leads to AI Active until you switch back"></button>
          <span id="awayToggleLabel" class="pra-muted" style="display:none;font-size:.82rem;cursor:pointer"></span>
          <button type="button" id="emailProviderToggleBtn" class="active-toggle" style="display:none" title="Which transport Inbox replies send through -- AWS SES (sandboxed) or each sender's own connected Gmail"></button>
          <span id="emailProviderToggleLabel" class="pra-muted" style="display:none;font-size:.82rem;cursor:pointer"></span>
        </div>
        <div class="tabs">
          <button class="tab-btn active" data-tab="primary">Inbox</button>
          <button class="tab-btn" data-tab="tasks">Tasks</button>
          <button class="tab-btn" data-tab="reminders">Reminders</button>
          <button class="tab-btn" data-tab="activity">Activity</button>
        </div>
        <div class="inbox-toolbar" id="inboxToolbar" style="display:none">
          <select class="pra-select" id="viewSelect">
            <option value="new">New</option>
            <option value="past">Past</option>
            <option value="all">All</option>
          </select>
          <select class="pra-select" id="sortSelect">
            <option value="desc">Newest first</option>
            <option value="asc">Oldest first</option>
            <option value="name">Name (A-Z)</option>
          </select>
          <div style="flex:1"></div>
          <div class="bulk-actions" id="bulkActions" style="display:none">
            <span class="pra-muted" style="font-size:.8rem" id="selectedCount"></span>
            <button class="pra-btn pra-btn-ghost pra-btn-sm" id="bulkDoneBtn">Mark Done</button>
          </div>
        </div>
      </div>

      <!-- Tasks / Reminders: existing flat list -->
      <div id="flatListView" style="display:none">
        <div class="pra-panel" id="itemsPanel"></div>
      </div>

      <!-- Activity: a user's sent SMS/email feed, including anything AI
           sent on their behalf while they were marked Away -->
      <div id="activityView" style="display:none">
        <div class="inbox-toolbar">
          <select class="pra-select" id="activityUserSelect"></select>
        </div>
        <div class="pra-panel" id="activityPanel" style="padding:0"></div>
      </div>

      <!-- Primary / Emails / Messages: chat-style UI -->
      <div id="chatView" class="chat-shell">
        <div class="chat-sidebar">
          <div class="chat-sidebar-search"><input class="pra-input" id="convoSearchInput" placeholder="Search name…"/></div>
          <div class="chat-sidebar-filters">
            <select class="pra-select" id="convoFilterSelect">
              <option value="all">All</option>
              <option value="unresponded" selected>Unresponded</option>
              <option value="done">Done</option>
              <option value="favorites">Favorites</option>
              <option value="archived">Archived</option>
              <option value="hidden">Hidden</option>
            </select>
            <select class="pra-select" id="convoChannelSelect">
              <option value="">Email &amp; SMS</option>
              <option value="email">Email</option>
              <option value="sms">SMS</option>
            </select>
            <select class="pra-select" id="convoStatusSelect">
              <option value="">All statuses</option>
            </select>
            <select class="pra-select" id="convoTypeSelect">
              <option value="">All types</option>
              <option value="online">Online</option>
              <option value="gym">Gym</option>
            </select>
            <select class="pra-select" id="convoOwnerSelect">
              <option value="">All owners</option>
              <option value="me">Assigned to me</option>
              <option value="unassigned">Unassigned</option>
            </select>

<script>
function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
function escapeHtml(s) { const d = document.createElement('div'); d.textContent = String(s ?? ''); return d.innerHTML; }
function fmtDate(iso) { return iso ? new Date(iso).toLocaleString() : ''; }
function fmtShort(iso) {
  if (!iso) return '';
  const d = new Date(iso), now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  return sameDay ? d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : d.toLocaleDateString([], { month: 'short', day: 'numeric' });
}
// Unlike fmtShort, always includes the year -- this labels a contact's
// origin date, which can be years in the past, and "Nov 2" alone would be
// ambiguous/misleading that far back.
function fmtCreatedDate(iso) { return iso ? new Date(iso).toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' }) : ''; }

let currentTab = 'primary', currentView = 'new', currentSort = 'desc';
let allStatuses = [], allUsers = [], currentItems = [], selectedIds = new Set();
let conversations = [], selectedConvo = null, threadItems = [], composeChannel = 'email', convoSearchQuery = '';
// Dragged height for the compose panel (see wireComposeResize) -- kept
// outside renderThread's own template so it survives the innerHTML
// replace that happens on every send/conversation switch instead of
// resetting back to auto-height each time.
let composeBarHeight = null;
// contactId -> confirmedAt ms, for every conversation THIS tab has just
// itself confirmed done (Mark Done, a reply going out, or another tab's
// broadcast of the same). The server-side unread_count recompute is
// batched and, under real load, can genuinely take longer than any fixed
// client-side wait -- a background reconcile fetch landing before it
// catches up used to overwrite the whole `conversations` array with that
// still-stale server answer, silently un-marking a row we already know is
// done ("disappears, then snaps back on the next refresh"). loadConversations()
// re-excludes/re-corrects anything in here regardless of what the server
// says, for a bounded window -- long enough to safely outlast the slowest
// realistic recompute, short enough that a genuinely new inbound message
// from the same contact later isn't masked forever by an old entry.
const RECENT_DONE_OVERRIDE_MS = 90000;
let recentlyConfirmedDone = new Map();
let composeView = 'compose', aiAssistAvailable = false; // composeView: 'compose' | 'summary'
let composeReplyTo = null; // set by an email bubble's Reply button; { subject, quotedHtml, quotedMeta } | null
let currentUser = null, teamUsers = [];
let convoFilter = 'unresponded', convoSort = 'newest', convoChannel = '', convoStatus = '', convoType = '', convoOwner = '', ctxMenuConvo = null, longPressTimer = null;
// Multi-select -- ctrl/cmd+click toggles a row, shift+click selects the
// range since the last-clicked row (selectAnchorKey), then right-click
// opens the SAME context menu but acting on every selected row instead of
// just one. touchSelectionActive is the mobile equivalent: a long-press
// starts it (selecting that row and opening the menu, same as before),
// and while it's on, a plain tap on another row toggles it into the
// selection too (a touch has no ctrl/shift key to hold) instead of
// opening that row's thread -- see wireConvoRow/openContextMenu.
let selectedConvoKeys = new Set(), selectAnchorKey = null, touchSelectionActive = false;
function toggleConvoSelection(key) { if (selectedConvoKeys.has(key)) selectedConvoKeys.delete(key); else selectedConvoKeys.add(key); }
function selectRangeBetween(fromKey, toKey) {
  const keys = conversations.map(c => c.key);
  const i = keys.indexOf(fromKey), j = keys.indexOf(toKey);
  if (i === -1 || j === -1) { selectedConvoKeys.add(toKey); return; }
  const [lo, hi] = i < j ? [i, j] : [j, i];
  for (let k = lo; k <= hi; k++) selectedConvoKeys.add(keys[k]);
}
function clearConvoSelection() { selectedConvoKeys.clear(); selectAnchorKey = null; touchSelectionActive = false; renderSidebar(); }
// Pagination -- the sidebar only ever asks the server for CONVO_PAGE_SIZE
// rows at a time (filtered/sorted server-side first, see inbox_backend.js)
// instead of loading the entire conversation list up front; scrolling near
// the bottom fetches the next page and appends it.
const CONVO_PAGE_SIZE = 40;
let convoOffset = 0, convoHasMore = true, convoLoadingMore = false, convoSearchDebounce = null;
const STOP_STATUSES = ['stop', 'bad fit / blacklist', 'bad fit', 'blacklist'];
const initialContactId = new URLSearchParams(location.search).get('contact');

function initials(name) { return String(name || '').trim().split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase(); }
// Outer avatar glow, by CRM status -- lead-stage-at-a-glance in the chat list.
const STATUS_GLOW = {
  'FINISHED': '#9a9aa5',
  'POTENTIAL': '#ffffff',
  'FOLLOW UP (They have a Task / Date set)': '#f4ff00',
  'APPLICATION': '#14892b',
  'BOOKED': '#1fbf42',
  'WE CANCELLED': '#7a7a86',
  "RSVP'ed": '#2cdf2b',
  'ENROLLED': '#39ff14',
  'STOP': '#4a4a52',
  'BLACKLIST': '#4a4a52',

// A thread with one of the CRM's own staff/admin users (e.g. testing by
// messaging lee@ or alexis@) glows blue regardless of lead status -- "this
// is one of us", not a lead-stage signal.
// Same fix as contact-detail.html's applyStatusGlow -- a native <select>

function statusSelectWidthRule(status) { return `width:${(status || 'Change status...').length + 8}ch`; }
function avatarStyle(status, email) {
  const isStaff = email && allUsers.some(u => u.email?.toLowerCase() === email.toLowerCase());
  const glow = isStaff ? '#009bff' : STATUS_GLOW[status];

}
const PIN_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M14.5 2.5a1.5 1.5 0 0 1 2.1 0l4.9 4.9a1.5 1.5 0 0 1 0 2.1l-2.1 2.1-1.4-1.4-3.5 3.5.5 4.6-1.6 1.6-4.2-4.2-5.4 5.4-1.1-1.1 5.4-5.4-4.2-4.2 1.6-1.6 4.6.5 3.5-3.5-1.4-1.4Z"/></svg>';
const STAR_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6.6 7.1.7-5.4 4.7 1.7 7-6.3-3.9-6.3 3.9 1.7-7-5.4-4.7 7.1-.7z"/></svg>';

// conversation-panel.js -- only this file's own sidebar-row icons stay here.
const BOOKING_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M8 3v4M16 3v4" stroke="var(--pra-black,#000)" stroke-width="1.8" stroke-linecap="round"/><path d="M7.5 13l2.7 2.7L16.5 9.5" stroke="var(--pra-black,#000)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>';
// WhatsApp-style read receipts, same as chat-app's: one grey check (sent),
// two grey checks (delivered), two blue checks (read -- an email "opened"
// event stands in for read, since SMS has no carrier-level read receipt).
function svgTick(double, color) {
  const check = 'M1 5.3L4.6 9L14.5 0.8';
  if (!double) return `<svg viewBox="0 0 16 10" width="14" height="9" fill="none"><path d="${check}" stroke="${color}" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  return `<svg viewBox="0 0 20 10" width="17" height="9" fill="none"><path d="${check}" stroke="${color}" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="${check}" transform="translate(5,0)" stroke="${color}" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

  if (!status) return '';

}

async function loadRefs() {
  // Used to also fetch the FULL unpaginated contact list here (all 176K+
  // contacts, the entire multi-hundred-MB response) just to support one
  // rare deep-link fallback case (see loadConversations' initialContactId
  // handling) -- that's now a targeted /api/contacts/:id lookup instead,
  // done only when actually needed, so a normal Inbox load no longer
  // downloads and parses the whole contacts database first.
  // crm-nav.js's own init already fetched /api/auth/me and /api/auth/team
  // (window.crmNavReady, awaited by this page's own init() before loadRefs()
  // ever runs) -- re-fetching both here was pure duplicate network traffic,
  // and on a page load already sensitive to server load variance (see
  // init()'s own comment on why loadRefs/loadConversations now run
  // concurrently instead of waiting on each other), every avoidable round
  // trip matters.
  const [statusesRes, usersRes] = await Promise.all([fetch('/api/statuses'), fetch('/api/auth/users')]);
  allStatuses = statusesRes.ok ? (await statusesRes.json()).statuses : [];
  allUsers = usersRes.ok ? (await usersRes.json()).users : []; // 403s for a non-admin -- avatarStyle() just falls back to status-only glow
  currentUser = window.crmMe || null;
  // /api/auth/team (not /api/auth/users) -- readable by every staff member,
  // not just admins, since the compose panel's From display needs to show
  // teammates exist even to non-admin senders.
  teamUsers = window.crmTeamUsers || [];
  const statusSel = document.getElementById('convoStatusSelect');
  statusSel.innerHTML = '<option value="">All statuses</option>' + allStatuses.map(s => `<option value="${escapeHtml(s.label)}"${STATUS_GLOW[s.label] ? ` data-color="${STATUS_GLOW[s.label]}"` : ''}>${escapeHtml(s.label)}</option>`).join('');
  // "Assigned to me"/"Unassigned" stay fixed options in the HTML -- only
  // the rest of the team gets appended here, so a coach like Josh can
  // filter to exactly his own leads without hunting for his own name in
  // an alphabetical list.
  const ownerSel = document.getElementById('convoOwnerSelect');
  const teamOptionsHtml = teamUsers
    .filter(u => u.id !== currentUser?.id)
    .map(u => `<option value="${u.id}">${escapeHtml(`${u.first} ${u.last}`.trim())}</option>`).join('');
  ownerSel.insertAdjacentHTML('beforeend', teamOptionsHtml);
  updateAwayToggleUi();
  updateEmailProviderToggleUi();
  populateActivityUserSelect();
}

// ── Tab switching ───────────────────────────────────────────────────────
// Only 'primary' is a chat-style tab now -- Emails/Messages used to be
// separate tabs that also implied a channel filter; that filter is now
// its own dropdown (convoChannelSelect) so it can combine with Done/
// Archived/etc instead of being tab-exclusive.

document.querySelectorAll('.tab-btn').forEach(btn => btn.onclick = () => {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

  document.getElementById('activityView').style.display = isActivity ? 'block' : 'none';
  document.getElementById('inboxToolbar').style.display = isChat || isActivity ? 'none' : 'flex';
  if (isChat) { document.getElementById('chatView').classList.remove('thread-open'); loadConversations(); }
  else if (isActivity) loadActivity();

});

// ── Away toggle -- self-service switch that hands a user's own leads to
// AI Active until they flip back. Only ever shown to a user an admin has
// explicitly granted AI Active access to (Settings > Team Users); the
// backend independently refuses the /away POST for anyone without it, so
// this visibility check is a convenience, not the actual gate.
function updateAwayToggleUi() {
  const btn = document.getElementById('awayToggleBtn');
  const label = document.getElementById('awayToggleLabel');
  if (!currentUser?.canUseAiActive) { btn.style.display = 'none'; label.style.display = 'none'; return; }

  label.textContent = currentUser.away ? 'Away — AI Active is working your leads' : 'Active';
}
async function toggleAway() {
  if (!currentUser) return;
  const newAway = !currentUser.away;
  if (newAway && !confirm('Switch to Away? AI Active will start autonomously replying to your leads (no draft review) until you switch back to Active.')) return;
  const r = await fetch(`/api/auth/users/${currentUser.id}/away`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ away: newAway }),
  });
  if (!r.ok) { const d = await r.json().catch(() => ({})); showToast(d.error || 'Could not update', true); return; }

}

document.getElementById('awayToggleLabel').addEventListener('click', toggleAway);

// ── Activity: a user's own sent SMS/email, including anything AI sent

function populateActivityUserSelect() {

let activityItems = [], activityOffset = 0, activityHasMore = false, activityLoading = false;
function activityRowHtml(it, idx) {
  return `
    <div class="activity-item">
      <div class="activity-row ${it.channel === 'email' ? '' : 'no-expand'}" data-activity-idx="${idx}">

}
// Only email rows expand -- SMS bodies are already short enough that the
// preview line above already shows the whole thing, and there's no
// separate subject/full-body to reveal for that channel.
function wireActivityRow(row) {
  row.addEventListener('click', () => {
    const it = activityItems[Number(row.dataset.activityIdx)];
    if (it.channel !== 'email') return;
    const detail = document.getElementById(`activityDetail${row.dataset.activityIdx}`);
    const open = detail.classList.toggle('open');

      // Same sandboxed-iframe pattern the main chat panel's email bubbles

// Fetches one page at a time (server-side default PAGE_SIZE) instead of
// pulling everything a user's ever sent up front -- each email row now
// carries its full body for the inline-expand view, so loading all of it
// at once would mean downloading every body just to show 30 preview lines.
// Scroll-triggered below via the window scroll listener.
async function loadMoreActivity(replace) {
  if (activityLoading || (!replace && !activityHasMore)) return;
  activityLoading = true;
  const userId = document.getElementById('activityUserSelect').value || 'me';
  const r = await fetch(`/api/inbox/activity?userId=${encodeURIComponent(userId)}&offset=${replace ? 0 : activityOffset}`);
  activityLoading = false;
  const panel = document.getElementById('activityPanel');
  if (!r.ok) { if (replace) panel.innerHTML = '<div class="pra-muted" style="padding:20px">Could not load.</div>'; return; }
  const { items, hasMore } = await r.json();
  if (replace && !items.length) { panel.innerHTML = '<div class="pra-muted" style="padding:20px">No activity yet.</div>'; return; }
  const startIdx = replace ? 0 : activityItems.length;
  activityItems = replace ? items : activityItems.concat(items);
  activityOffset = startIdx + items.length;
  activityHasMore = hasMore;
  const html = items.map((it, i) => activityRowHtml(it, startIdx + i)).join('');
  if (replace) panel.innerHTML = html; else panel.insertAdjacentHTML('beforeend', html);
  items.forEach((it, i) => {
    const row = panel.querySelector(`[data-activity-idx="${startIdx + i}"]`);
    if (row) wireActivityRow(row);

document.getElementById('activityUserSelect').addEventListener('change', loadActivity);
// The Activity panel scrolls with the whole page (no inner overflow region

// ── Chat: conversation sidebar ───────────────────────────────────────────
function convoQueryParams(offset) {
  const params = new URLSearchParams();
  if (convoChannel) params.set('channel', convoChannel);
  if (convoFilter && convoFilter !== 'all') params.set('filter', convoFilter);
  if (convoStatus) params.set('status', convoStatus);
  if (convoType) params.set('type', convoType);
  if (convoOwner) params.set('owner', convoOwner === 'me' ? (window.crmMe?.id || '') : convoOwner);
  if (convoSort && convoSort !== 'newest') params.set('sort', convoSort);
  if (convoSearchQuery.trim()) params.set('search', convoSearchQuery.trim());
  params.set('limit', CONVO_PAGE_SIZE);
  params.set('offset', offset);
  return params.toString();
}
// Full reset -- called on initial tab load and whenever any filter/sort/
// search/channel control changes. Replaces `conversations` outright rather
// than appending (see loadMoreConversations for that).
// `quiet` skips the "Loading…" wipe -- used by the delayed post-action
// reconcile (Mark Done/reply, see their own comments) where the optimistic
// local update already shows the right thing; without this, that
// background correctness check visibly flashed the ENTIRE list to empty
// and back every single time, on top of whatever it actually changed.
async function loadConversations(quiet) {
  const list = document.getElementById('chatSidebarList');
  if (!quiet) list.innerHTML = '<div class="pra-muted" style="padding:16px;font-size:.82rem">Loading…</div>';
  convoOffset = 0; convoHasMore = true;
  const r = await fetch('/api/inbox/conversations?' + convoQueryParams(0));
  if (!r.ok) { list.innerHTML = '<div class="pra-muted" style="padding:16px;font-size:.82rem">Could not load.</div>'; return; }
  const data = await r.json();
  conversations = data.conversations;
  // Pagination offset must track what the server actually returned, not
  // what's left after the override filter below removes a few rows client-
  // side -- otherwise the next page fetch skips/duplicates rows.
  convoOffset = conversations.length;
  convoHasMore = !!data.hasMore;
  // Never let a fresh fetch regress a conversation this tab (or another
  // tab, via SSE) already confirmed done -- see recentlyConfirmedDone's own
  // comment for why a plain overwrite here used to "snap back" a row the
  // person had just watched disappear.
  if (recentlyConfirmedDone.size) {
    const now = Date.now();
    for (const [id, at] of recentlyConfirmedDone) {
      if (now - at > RECENT_DONE_OVERRIDE_MS) { recentlyConfirmedDone.delete(id); continue; }
      const row = conversations.find(c => c.contactId === id);
      if (!row) continue; // server already agrees it's excluded -- nothing to override
      row.done = true; row.unreadCount = 0;
    }
    if (convoFilter === 'unresponded') conversations = conversations.filter(c => !recentlyConfirmedDone.has(c.contactId));
  }
  renderSidebar();
  if (initialContactId) {
    const match = conversations.find(c => c.contactId === initialContactId);
    if (match) { selectConversation(match); return; }
    // Not on the first page of conversations (brand-new contact with no
    // messages yet, or just not among the most recent) -- look it up
    // directly instead of scanning the full contact list client-side.
    const contactRes = await fetch('/api/contacts/' + initialContactId);
    const contact = contactRes.ok ? (await contactRes.json()).contact : null;
    if (contact) selectConversation({ key: contact.id, contactId: contact.id, contact, displayName: `${contact.first} ${contact.last}`.trim(), lastAt: null, unreadCount: 0 });
  } else if (selectedConvo) {
    const stillThere = conversations.find(c => c.key === selectedConvo.key);
    if (stillThere) selectConversation(stillThere, true);
  }
}
// Scroll-triggered -- fetches the next page under the SAME filter/sort/
// search and appends it, rather than re-rendering everything (which would
// also reset scroll position right as the user is scrolling).
async function loadMoreConversations() {
  if (!convoHasMore || convoLoadingMore) return;
  convoLoadingMore = true;
  try {
    const r = await fetch('/api/inbox/conversations?' + convoQueryParams(convoOffset));
    if (!r.ok) return;
    const data = await r.json();
    conversations = conversations.concat(data.conversations);
    convoOffset = conversations.length;
    convoHasMore = !!data.hasMore;
    appendConvoRows(data.conversations);
  } finally {
    convoLoadingMore = false;
  }
}

function wireConvoRow(row) {

    if (e.target.closest('[data-add-contact], [data-pin], [data-star]')) return;
    const convo = c();
    if (!convo) return;
    if (e.shiftKey && selectAnchorKey) { selectRangeBetween(selectAnchorKey, convo.key); selectAnchorKey = convo.key; renderSidebar(); return; }
    if (e.ctrlKey || e.metaKey) { toggleConvoSelection(convo.key); selectAnchorKey = convo.key; renderSidebar(); return; }
    // Already mid multi-select (desktop ctrl-click session, or mobile
    // long-press) -- a plain tap/click on another row extends it instead
    // of opening that row's thread. Ends the session once nothing's left.
    if (selectedConvoKeys.size) {
      toggleConvoSelection(convo.key); selectAnchorKey = convo.key;
      if (!selectedConvoKeys.size) touchSelectionActive = false;
      renderSidebar();
      return;
    }
    selectAnchorKey = convo.key; // so a later shift-click anchors from "the last row I actually looked at", not a stale ctrl/shift pick

  // horizontal flick marks this ONE conversation done, Tinder-card style,

  // action. Only engages once movement is clearly horizontal (not a

      row.dataset.longPress = '1';

      touchSelectionActive = true;

    }, 500);
  }, { passive: true });

      else if (Math.abs(dy) > 10) { clearTimeout(longPressTimer); return; } // reads as a scroll, not a swipe -- let it scroll
      else return; // not enough movement yet to tell which this is

      e.stopPropagation();

      // A status change can auto-archive (STOP) or auto-hide (Blacklist)

      // a freshly-archived/hidden row actually drops out of the current
      // view instead of sticking around from the stale local

      // the instant case; this is the reconcile for everything else.

  }
  row.querySelector('[data-pin]')?.addEventListener('click', async (e) => {
    e.stopPropagation();
    const btn = e.currentTarget;
    const pinned = btn.dataset.pinOn === '1';
    await fetch(`/api/inbox/conversations/${btn.dataset.pin}/pin`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pinned }) });

    e.stopPropagation();
    const btn = e.currentTarget;
    const starred = btn.dataset.starOn === '1';
    await fetch(`/api/inbox/conversations/${btn.dataset.star}/star`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ starred }) });

// sync with the same recentlyConfirmedDone protection against a slow
// server recompute un-marking it again (see that Map's own comment). The
// row's own removal animation already ran before this fires; this only
// updates state and refreshes whatever else needs it (the open thread's
// own Mark Done button, if this happens to be the open conversation).
async function swipeMarkDone(convo) {

  recentlyConfirmedDone.set(convo.contactId, Date.now());
  if (convoFilter === 'unresponded') conversations = conversations.filter(x => x.key !== convo.key);
  showToast('Marked done');

  if (selectedConvo?.contactId === convo.contactId) {

function openContextMenu(c, x, y, additive) {
  if (!c) return;

  // acts on the whole selection; on a row OUTSIDE it, `additive` decides

    else { selectedConvoKeys.clear(); selectedConvoKeys.add(c.key); }

// Drag handle between chat-thread and compose-bar -- re-wired every
// renderThread() call since that replaces chatPanel's innerHTML wholesale,
// tearing down any listener attached to the old element. Uses pointer
// capture on the handle itself so move/up keep firing even once the
// pointer leaves the thin 8px strip, instead of needing document-level
// listeners.
function wireComposeResize() {
  const handle = document.getElementById('composeResizeHandle');
  const composeBar = document.getElementById('composeBar');
  const panel = document.getElementById('chatPanel');
  const thread = document.getElementById('chatThread');
  if (!handle || !composeBar || !panel || !thread) return;
  const MIN_COMPOSE = 90, MIN_THREAD = 100;
  handle.onpointerdown = (e) => {
    e.preventDefault();
    handle.setPointerCapture(e.pointerId);
    const startY = e.clientY;
    const startHeight = composeBar.getBoundingClientRect().height;
    // Constant for the duration of this drag -- whatever space isn't
    // chat-thread or compose-bar right now (header, chat-panel-actions,
    // this handle itself).
    const fixedChrome = panel.clientHeight - thread.getBoundingClientRect().height - startHeight;
    handle.classList.add('dragging');
    const onMove = (ev) => {
      const delta = startY - ev.clientY; // dragging up (delta > 0) grows compose-bar
      const maxHeight = Math.max(MIN_COMPOSE, panel.clientHeight - fixedChrome - MIN_THREAD);
      const next = Math.max(MIN_COMPOSE, Math.min(startHeight + delta, maxHeight));
      composeBar.style.height = next + 'px';
      composeBar.style.flex = `0 0 ${next}px`;
    };
    const onUp = () => {
      handle.releasePointerCapture(e.pointerId);
      handle.removeEventListener('pointermove', onMove);
      handle.removeEventListener('pointerup', onUp);
      handle.classList.remove('dragging');
      composeBarHeight = composeBar.getBoundingClientRect().height;
    };
    handle.addEventListener('pointermove', onMove);
    handle.addEventListener('pointerup', onUp);
  };

    e.stopPropagation();
    const item = items[Number(el.dataset.replyIdx)];
    const fromAddr = extractEmailAddr(item.from) || (c.contact ? `${c.contact.first || ''} ${c.contact.last || ''}`.trim() : '') || 'they';
    composeReplyTo = {
      subject: /^re:/i.test(item.subject || '') ? item.subject : `Re: ${item.subject || ''}`,
      // The real HTML, not a plain-text strip -- rendered read-only below
      // the compose box (see the compose-quote-preview iframe) and sent
      // through to the recipient verbatim on Send, same reasoning as why
      // the email bubble itself renders item.body through an iframe
      // instead of flattening it.
      quotedHtml: item.body || `<p style="color:#888">${escapeHtml(item.bodyPreview || '(no content stored)')}</p>`,
      quotedMeta: `On ${fmtDate(item.at)}, ${fromAddr} wrote:`,
    };
    composeChannel = 'email';
    composeView = 'compose';
    renderThread();
    const subjEl = document.getElementById('composeSubject');
    const bodyEl = document.getElementById('composeBody');
    if (subjEl) subjEl.value = composeReplyTo.subject;
    if (bodyEl) { bodyEl.value = ''; bodyEl.focus(); }
  });
  threadEl.scrollTop = threadEl.scrollHeight;

  if (currentTab === 'primary') {
    panel.querySelectorAll('.compose-channel-toggle [data-ch]').forEach(btn => btn.onclick = () => {
      composeReplyTo = null; // manually switching tabs exits reply mode
      if (btn.dataset.ch === 'summary') composeView = 'summary';
      else { composeChannel = btn.dataset.ch; composeView = 'compose'; }
      renderThread();
    });
    panel.querySelectorAll('.ai-gen-btn').forEach(btn => btn.onclick = () => generateAiContent(btn.dataset.aiCh, btn));
  }
  if (composeChannel === 'email' && composeReplyTo) {
    const quoteFrame = document.getElementById('composeQuoteFrame');
    if (quoteFrame) quoteFrame.srcdoc = `<style>body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:8px;color:#333}</style>${composeReplyTo.quotedHtml}`;
    const quoteRemoveBtn = document.getElementById('composeQuoteRemoveBtn');
    if (quoteRemoveBtn) quoteRemoveBtn.onclick = () => { composeReplyTo = null; renderThread(); };
  }
  if (composeView === 'summary') { if (c.contactId) loadAiSummary(c.contactId); }
  else document.getElementById('composeSendBtn').onclick = sendComposeMessage;
  document.getElementById('chatBackBtn').onclick = backToConvoList;
  wireComposeResize();
  const zoomCopyBtn = document.getElementById('chatZoomCopyBtn');
  if (zoomCopyBtn) zoomCopyBtn.onclick = (e) => {
    e.preventDefault();
    navigator.clipboard.writeText(zoomCopyBtn.dataset.zoomLink)
      .then(() => showToast('Zoom link copied'))
      .catch(() => showToast('Could not copy', true));
  };
  document.getElementById('chatAddTaskBtn').onclick = (e) => { e.stopPropagation(); toggleTaskPanel(c.contactId); };
  document.getElementById('chatAddNoteBtn').onclick = (e) => { e.stopPropagation(); toggleNotePanel(c.contactId); };
  document.getElementById('chatScheduleBtn').onclick = (e) => { e.stopPropagation(); toggleSchedulePanel(c.contactId); };
  if (c.contactId) document.getElementById('chatPanelNameLink').onclick = () => openContactOverlay(c.contactId);
  wireOwnerFields(panel, (contactId, ownerId) => { if (c.contact) c.contact.ownerId = ownerId; applyOwnerChangeToConvoState(contactId, ownerId); });
  if (c.contactId) {
    document.getElementById('chatMarkDoneBtn').onclick = async () => {
      const nextDone = !c.done;
      await fetch(`/api/inbox/conversations/${c.contactId}/done`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ done: nextDone }) });
      c.done = nextDone;
      const inList = conversations.find(x => x.key === c.key);
      if (inList) {
        inList.done = nextDone;
        // Marking done clears every unread inbound message for this contact,
        // synchronously, server-side -- predictable enough to reflect right
        // here instead of waiting on it. The conversation-index rebuild that
        // actually recomputes unread_count is batched up to 5s out (see
        // message_index.js's recomputeConversationSummary/FLUSH_DELAY_MS),
        // so the immediate loadConversations() below would otherwise still
        // see the OLD count and the row would look like Mark Done had no
        // effect, even though it did.
        if (nextDone) { inList.unreadCount = 0; recentlyConfirmedDone.set(c.contactId, Date.now()); } else recentlyConfirmedDone.delete(c.contactId);
        // Unresponded is unread_count > 0 (see sqlite_inbox.js) -- once
        // that's 0, this row doesn't belong in the list currently on
        // screen. Drop it now rather than let the stale refetch below keep
        // showing it for up to 5 more seconds.
        if (convoFilter === 'unresponded' && inList.unreadCount === 0) {
          conversations = conversations.filter(x => x.key !== c.key);
        }
      }
      showToast(nextDone ? 'Marked done' : 'Marked not done');
      renderThread();
      renderSidebar();
      // Delayed past the conversation-index's own batched flush window so
      // this reconciles with the server's now-actually-updated unread_count
      // instead of the stale one an immediate refetch would still see.
      setTimeout(loadConversations, 5500, true);
    };
    wireInlineEditClick(document.getElementById('chatPanelTypeBadge'), {
      field: 'programType',
      contactId: c.contactId,
      onSaved: (value) => {
        if (c.contact) c.contact.programType = value;
        const badge = document.getElementById('chatPanelTypeBadge');
        badge.className = `pra-badge pra-badge-${value || ''}`;
        badge.textContent = value ? value : 'SET TYPE';
      },
    });
  }
  document.getElementById('chatStatusSelect').addEventListener('change', async (e) => {
    const status = e.target.value;
    if (!c.contactId) return;
    // Selecting the blank "Change status..." option explicitly clears the
    // status back to none -- previously this silently no-opped, so picking
    // it back after a real status was set never actually saved, and a
    // reload would revert to whatever status was there before.
    await fetch('/api/contacts/' + c.contactId, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status }) });
    showToast('Status updated');
    e.target.setAttribute('style', `${avatarStyle(status)};${statusSelectWidthRule(status)}`);
    if ((status === 'STOP' || status === 'BLACKLIST') && convoFilter !== 'hidden') dropConvoFromSidebar(c.key);
    loadRefs();
    // A status change can auto-archive (STOP) or auto-hide (Blacklist) the
    // conversation -- loadRefs() only refreshes contacts/statuses/users,
    // not the conversation list itself, so without this the row would keep
    // showing in the sidebar (stale local `conversations` array) even
    // though the backend already archived/hidden it. The dropConvoFromSidebar
    // call above already handles the instant case; this is just the
    // reconcile for every other status change and for other open tabs.
    loadConversations();
  });

  // Just VIEWING a thread is deliberately NOT the same as responding to it
  // -- staff opening a conversation to read it must not silently move it
  // out of Unresponded, since nothing has actually been answered yet.
  // This used to also call markDone() here (the same effect as opening the
  // old detail modal), but that's wrong: a lead can sit read-but-unanswered
  // for a while, and Unresponded needs to keep surfacing it the whole time,
  // not just until someone happens to click on it. Marking done now only
  // ever happens two ways: a real reply going out (see sendComposeMessage)
  // or the explicit "Mark done" action.
  //
  // /opened still fires on every view, though, and DOES clear the row's
  // visual glow immediately -- hasUnseen is a separate flag from
  // unreadCount/done (see sqlite_inbox.js's queryConversationsSqlite), so
  // this is safe to clear optimistically the instant a thread is opened
  // without affecting whether it's still sitting in Unresponded.
  fetch(`/api/inbox/conversations/${c.contactId}/opened`, { method: 'POST' });
  const inList = conversations.find(x => x.key === c.key);
  if (inList) inList.hasUnseen = false;
  renderSidebar();
}
async function selectConversation(c, skipFetch) {
  const isRealSwitch = selectedConvo?.key !== c.key;
  selectedConvo = c;
  document.querySelectorAll('.convo-row').forEach(r => r.classList.toggle('selected', r.dataset.convo === c.key));
  document.getElementById('chatView').classList.add('thread-open'); // mobile: swap to the chat panel
  // Only reset compose state on an actual contact switch. loadConversations()
  // also calls this (skipFetch=true) for the CURRENTLY selected conversation
  // after any Mark Done/reply, purely to resync unread state/thread items in
  // the background -- resetting composeReplyTo/composeView there too used to
  // silently drop whatever quote preview or in-progress reply/channel choice
  // the person was looking at, every single time, for no reason tied to what
  // that resync actually needed to fix.
  if (isRealSwitch) composeReplyTo = null;
  if (!c.contactId) { aiAssistAvailable = false; return; }
  if (isRealSwitch) composeView = 'compose';
  // The AI icons next to Send Email/Send SMS only show up at all if some
  // AI Assist agent actually applies to this lead -- a cheap check (no LLM
  // call), separate from generateAiContent()/loadAiSummary() below, which
  // only run when a human clicks one of those icons.
  //
  // c.contact itself is the sidebar's own denormalized SQLite snapshot
  // (see sqlite_inbox.js) -- deliberately NOT re-fetched from the real
  // ~190MB contacts file here. That was tried (both blocking the first
  // render and, after that made every click feel broken, as a background
  // patch-in-after) and reverted both times: the live-sync hooks
  // (syncContactFields et al) already keep this snapshot correct on every
  // contact edit going forward, so the extra request bought correctness
  // this app already has for a real, felt performance cost that wasn't
  // worth it.
  // status/programType passed straight from the sidebar's own snapshot --
  // lets the matches endpoint skip its own full-contacts-file lookup (see
  // that endpoint's comment).
  const [threadRes, matchRes] = await Promise.all([
    fetch('/api/inbox/contact/' + c.contactId),
    fetch('/api/ai-agents/matches?contactId=' + encodeURIComponent(c.contactId) + '&status=' + encodeURIComponent(c.contact?.status || '') + '&programType=' + encodeURIComponent(c.contact?.programType || '')),
  ]);
  // Discard a stale response -- if the user has since clicked a DIFFERENT
  // conversation while this one's fetch was still in flight, selectedConvo
  // has already moved on by the time we get here. Without this check, a
  // slow-to-resolve click (any real latency -- a loaded server, a slow
  // connection) can win the race against a faster later click and overwrite
  // the panel with the wrong contact's thread. Confirmed live: this is what
  // made clicking any name open whichever contact's fetch happened to be
  // slowest, not the one actually clicked.
  if (selectedConvo?.key !== c.key) return;
  threadItems = threadRes.ok ? (await threadRes.json()).items : [];
  aiAssistAvailable = matchRes.ok ? (await matchRes.json()).match : false;
  if (selectedConvo?.key !== c.key) return; // re-check: could have changed again during the json() awaits
  renderThread();
}
function backToConvoList() { document.getElementById('chatView').classList.remove('thread-open'); }

// Generates (or regenerates) straight into the compose fields -- no
// separate review card. skip/escalate never touch the compose box at all,
// they just tell the closer why via a toast.
async function generateAiContent(channel, btn) {
  if (!selectedConvo?.contactId) return;
  btn.disabled = true;
  btn.classList.add('loading');
  // Only the success path used to clear this -- it happens to work there
  // because renderThread() below replaces the whole compose panel (a fresh,
  // never-disabled button), but every early-return (skip/escalate/error) or
  // network failure left THIS button disabled and spinning indefinitely,
  // since nothing else was left to reset it. finally covers every exit.
  try {
    const r = await fetch('/api/ai-agents/generate', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contactId: selectedConvo.contactId, channel }),
    });
    const d = await r.json();
    if (!r.ok) { showToast(d.error || 'Could not generate', true); return; }
    if (d.status === 'skip') { showToast(d.reason || 'No response needed right now'); return; }
    if (d.status === 'escalate') { showToast('⚠️ ' + d.reason, true); return; }
    // composeReplyTo (the quoted-thread preview) used to get cleared here
    // unconditionally, silently exiting reply mode and collapsing the quote
    // preview every time this ran, even when drafting the exact reply
    // already being composed -- the template only renders that preview for
    // composeChannel==='email' anyway, so there's no need to clear it just
    // because channel is changing.
    composeChannel = channel;
    composeView = 'compose';
    renderThread();
    if (channel === 'email' && d.subject) document.getElementById('composeSubject').value = d.subject;
    document.getElementById('composeBody').value = d.body || '';
    if (d.buyingSignal) showToast('🔥 Buying signal detected — consider taking over');
  } catch {
    showToast('Could not generate', true);
  } finally {
    btn.disabled = false;
    btn.classList.remove('loading');
  }
}
async function loadAiSummary(contactId) {
  const panel = document.getElementById('aiSummaryPanel');
  if (!panel) return;
  try {
    const r = await fetch('/api/ai-agents/summarize', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contactId }),
    });
    const d = await r.json();
    if (!r.ok) { panel.innerHTML = `<div class="pra-muted">${escapeHtml(d.error || 'Could not load summary')}</div>`; return; }
    panel.innerHTML = `
      <div class="ai-summary-row"><div class="ai-summary-label">Goal</div>${escapeHtml(d.goal || 'Unclear')}</div>
      <div class="ai-summary-row"><div class="ai-summary-label">Objections</div>${escapeHtml(d.objections || 'None raised')}</div>
      <div class="ai-summary-row"><div class="ai-summary-label">Recommendation</div>${escapeHtml(d.recommendation || '—')}</div>
      ${d.takeover ? `<div class="ai-summary-takeover">🔥 Consider taking over — ${escapeHtml(d.takeoverReason || '')}</div>` : ''}
    `;
  } catch { panel.innerHTML = '<div class="pra-muted">Could not load summary.</div>'; }
}
async function sendComposeMessage() {
  const body = document.getElementById('composeBody').value.trim();
  if (!body || !selectedConvo?.contactId) return;
  const subject = composeChannel === 'email' ? document.getElementById('composeSubject').value.trim() : undefined;
  const fromUserId = composeChannel === 'email' ? document.getElementById('composeFromUserId')?.value : undefined;
  const btn = document.getElementById('composeSendBtn');
  btn.disabled = true; btn.textContent = 'Sending…';
  const isReply = composeChannel === 'email' && composeReplyTo;
  const r = await fetch('/api/inbox/send', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contactId: selectedConvo.contactId, channel: composeChannel, subject, body, fromUserId,
      quotedHtml: isReply ? composeReplyTo.quotedHtml : undefined,
      quotedMeta: isReply ? composeReplyTo.quotedMeta : undefined,
    }),
  });
  const d = await r.json();
  btn.disabled = false; btn.textContent = composeChannel === 'email' && composeReplyTo ? 'Reply' : 'Send';
  if (!r.ok) { showToast(d.error || 'Send failed', true); return; }
  showToast('Sent');
  composeReplyTo = null;
  // A real reply just went out -- THIS is what actually counts as
  // responding, not merely having opened the thread earlier (see
  // selectConversation's comment). Marks every prior unread inbound
  // message done and moves the conversation out of Unresponded.
  const sentContactId = selectedConvo.contactId;
  await fetch(`/api/inbox/conversations/${sentContactId}/done`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ done: true }) });
  // Same optimistic update + delayed refetch as ctxDoneBtn's handler, and
  // for the identical reason (see its own comment): the server's
  // unread_count recompute is batched, up to 5s behind (message_index.js's
  // scheduleConversationFlush). Calling loadConversations() right away used
  // to lose that race almost every time -- the refetch would land before
  // unread_count actually hit 0, so the row reappeared under Unresponded
  // looking like the reply never registered, even though it genuinely sent.
  recentlyConfirmedDone.set(sentContactId, Date.now());
  const inList = conversations.find(x => x.contactId === sentContactId);
  if (inList) {
    inList.done = true;
    inList.unreadCount = 0;
    if (convoFilter === 'unresponded') conversations = conversations.filter(x => x.contactId !== sentContactId);
    renderSidebar();
  }
  const threadRes = await fetch('/api/inbox/contact/' + sentContactId);
  threadItems = threadRes.ok ? (await threadRes.json()).items : [];
  renderThread();
  setTimeout(loadConversations, 5500, true);
}

// ── Contact details overlay ──────────────────────────────────────────────
// Same field set as contact-detail.html's Details panel, kept in sync
// manually (separate static pages, no shared JS) -- opened from the chat
// panel's name link instead of navigating away. No Delete Contact here on
// purpose: a quick popup shouldn't carry a destructive action -- "Open Full
// Page" is there for that.
let overlayContact = null, overlayTags = [], overlayLists = [], overlayFields = [];
let overlayThreadItems = [];
async function openContactOverlay(contactId) {
  const [tagsRes, listsRes, fieldsRes, contactRes, threadRes] = await Promise.all([
    fetch('/api/tags'), fetch('/api/lists'), fetch('/api/custom-fields?entityType=contact'), fetch('/api/contacts/' + contactId), fetch('/api/inbox/contact/' + contactId)
  ]);
  overlayTags = tagsRes.ok ? (await tagsRes.json()).tags : [];
  overlayLists = listsRes.ok ? (await listsRes.json()).lists : [];
  overlayFields = fieldsRes.ok ? (await fieldsRes.json()).fields : [];
  overlayThreadItems = threadRes.ok ? (await threadRes.json()).items : [];

  document.getElementById('ovTypeBadge').innerHTML = overlayContact.programType ? `<span class="pra-badge pra-badge-${overlayContact.programType}">${escapeHtml(overlayContact.programType)}</span>` : '';
  const statusSel = document.getElementById('ovStatus');

    await autoSaveOverlay();

  document.getElementById('ovLast').value = overlayContact.last || '';
  document.getElementById('ovAccount').value = overlayContact.accountName || '';

  document.getElementById('ovPhone').value = overlayContact.phone || '';
  document.getElementById('ovEmailOptOut').checked = !!overlayContact.emailOptOut;
  document.getElementById('ovSmsOptOut').checked = !!overlayContact.smsOptOut;
  renderOverlayOptOutBadges();
  document.getElementById('ovFullPageLink').href = '/contact-detail.html?id=' + contactId;
  renderOverlayTags();
  renderOverlayLists();
  renderOverlayHyrosUrls();
  renderOverlayCustomFields();

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Form Builder — CRM</title>
<link rel="stylesheet" href="/crm-design-system.css"/>
<style>
  .fb-header { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .fb-name-input { font-family: var(--font-primary); font-weight: 700; font-size: 1.4rem; background: none; border: none; color: #fff; outline: none; flex: 1; border-bottom: 1px solid transparent; }
  .fb-name-input:focus { border-bottom-color: var(--pra-blue); }
  .status-toggle-btn { font-size: .72rem; text-transform: uppercase; padding: 5px 12px; border-radius: 10px; border: 1px solid var(--pra-border); cursor: pointer; background: rgba(255,255,255,0.06); color: var(--pra-dim); }
  .status-toggle-btn.published { background: rgba(57,255,20,0.15); color: var(--pra-green); border-color: rgba(57,255,20,0.35); }
  .tabs { display: flex; gap: 6px; margin: 16px 0; border-bottom: 1px solid var(--pra-border); }
  .tab-btn { background: none; border: none; color: var(--pra-dim); font-family: var(--font-primary); font-weight: 700; font-size: .84rem; padding: 10px 14px; cursor: pointer; border-bottom: 2px solid transparent; }
  .tab-btn.active { color: var(--pra-white); border-bottom-color: var(--pra-blue); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* Icon system — same two-tone (white linework + blue accent) icon-btn
     convention as chat-app/chat.html, copied verbatim so every app in this
     business shares one visual language for icon buttons. */
  .icon-btn { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--pra-border); background: transparent; color: var(--pra-dim); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; transition: color .15s, border-color .15s; }
  .icon-btn:hover { color: var(--pra-blue); border-color: var(--pra-blue); }
  .icon-btn svg { width: 17px; height: 17px; overflow: visible; }
  .icon-btn-sm { width: 26px; height: 26px; border-radius: 6px; }
  .icon-btn-sm svg { width: 14px; height: 14px; }
  .field-icon { display: inline-flex; vertical-align: -3px; margin-right: 2px; }
  .field-icon svg { width: 14px; height: 14px; overflow: visible; }
  .drag-handle { cursor: grab; color: var(--pra-dim); display: inline-flex; align-items: center; }
  .drag-handle svg { width: 15px; height: 18px; overflow: visible; }

  .field-card { border: 1px solid var(--pra-border); border-radius: 10px; margin-bottom: 8px; background: var(--pra-panel-2); overflow: hidden; }
  .field-card.dragging { opacity: .4; }
  .field-card-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
  .field-type-badge { display: inline-flex; align-items: center; font-size: .68rem; padding: 3px 9px; border-radius: 10px; background: var(--pra-blue-dim); color: var(--pra-blue); white-space: nowrap; }
  .field-label-input { flex: 1; background: none; border: none; color: #fff; font-size: .92rem; outline: none; padding: 4px 0; }
  .req-toggle { font-size: .74rem; color: var(--pra-dim); display: flex; align-items: center; gap: 4px; white-space: nowrap; cursor: pointer; }
  .field-detail { padding: 4px 14px 14px; border-top: 1px solid var(--pra-border); display: none; }
  .field-detail.open { display: block; }
  .option-row { display: flex; gap: 8px; margin-bottom: 6px; align-items: center; }
  .add-field-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .add-field-row button { font-size: .76rem; display: inline-flex; align-items: center; gap: 5px; }
  .share-box { background: #08080a; border: 1px solid var(--pra-border); border-radius: 8px; padding: 12px 14px; font-family: monospace; font-size: .8rem; color: #9cff9c; word-break: break-all; margin-bottom: 10px; }
  .resp-row { border-bottom: 1px solid var(--pra-border); padding: 12px 0; cursor: pointer; }
  .resp-row:last-child { border-bottom: none; }
  .resp-answers { display: none; margin-top: 10px; padding: 12px; background: rgba(255,255,255,0.03); border-radius: 8px; font-size: .84rem; }
  .resp-row.open .resp-answers { display: block; }
  .resp-answers .qa { padding: 4px 0; }
  .resp-answers .q { color: var(--pra-dim); font-size: .74rem; text-transform: uppercase; letter-spacing: .04em; }

  .section-label { display: flex; align-items: center; gap: 6px; margin: 16px 0 8px; }
  .section-label svg { width: 15px; height: 15px; overflow: visible; }
  .logic-rule { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 0; border-bottom: 1px solid var(--pra-border); }
  .logic-rule:last-child { border-bottom: none; }
  .logic-rule select, .logic-rule input { width: auto; min-width: 110px; }
  .logic-rule .fill { flex-basis: 100%; }

  .picker-add-select { max-width: 240px; }
  .picker-chips { margin-top: 8px; }
  .chip-option.removable { display: inline-flex; align-items: center; gap: 6px; cursor: default; }
  .chip-option.removable .chip-x { cursor: pointer; opacity: .7; }
  .chip-option.removable .chip-x:hover { opacity: 1; color: var(--pra-red); }
</style>
</head>
<body>
<div class="pra-root">
  <div class="app-shell">
    <div class="app-sidebar" id="appSidebar"></div>
    <div class="app-main">
      <a class="pra-link" href="/forms.html">&larr; Back to Forms</a>
      <div class="fb-header" style="margin-top:14px">
        <input class="fb-name-input" id="formName"/>
        <button class="status-toggle-btn" id="statusToggle"></button>
        <a class="pra-btn pra-btn-ghost pra-btn-sm" id="viewLink" target="_blank">View</a>
      </div>
      <div class="pra-muted" id="savedMsg" style="font-size:.76rem">&nbsp;</div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="build">Build</button>
        <button class="tab-btn" data-tab="settings">Settings</button>
        <button class="tab-btn" data-tab="share">Share</button>
        <button class="tab-btn" data-tab="responses">Responses</button>
      </div>

      <div class="tab-panel active" id="tab-build">
        <div id="fieldList"></div>
        <div class="add-field-row" id="addFieldRow"></div>
      </div>

      <div class="tab-panel" id="tab-settings">
        <div class="pra-panel" style="padding:20px;max-width:520px">
          <div class="field"><label class="pra-label">Submit button text</label><input class="pra-input" id="setSubmitText"/></div>
          <div class="field"><label class="pra-label">Confirmation message (shown after submit, if no redirect)</label><textarea class="pra-textarea" id="setConfirmMsg" rows="2"></textarea></div>
          <div class="field"><label class="pra-label">Redirect URL (optional — sends them here instead of showing the confirmation message)</label><input class="pra-input" id="setRedirectUrl" placeholder="https://pacificrimathletics.com/thank-you"/></div>
          <div class="field"><label class="pra-label">Default status for new contacts</label><select class="pra-select" id="setDefaultStatus"><option value="">(none)</option></select></div>
          <div class="field">
            <label class="pra-label">Add tags on submit</label>
            <select class="pra-select picker-add-select" id="setTagAdd"></select>
            <div class="chip-multiselect picker-chips" id="setTagsChips"></div>
          </div>
          <div class="field">
            <label class="pra-label">Add to lists on submit</label>
            <select class="pra-select picker-add-select" id="setListAdd"></select>
            <div class="chip-multiselect picker-chips" id="setListsChips"></div>
          </div>
        </div>
      </div>

      <div class="tab-panel" id="tab-share">
        <div class="pra-panel" style="padding:20px;max-width:640px">
          <div class="pra-muted" id="shareWarning" style="font-size:.82rem;margin-bottom:14px;display:none;color:#ffc107">This form is still a Draft — publish it above before sharing the link, or it'll 404 for visitors.</div>
          <div class="pra-label" style="margin-bottom:6px">Public link</div>
          <div class="share-box" id="shareLink"></div>
          <div class="pra-label" style="margin-bottom:6px">Embed as an iframe</div>
          <div class="share-box" id="shareEmbed"></div>
        </div>
      </div>

      <div class="tab-panel" id="tab-responses">
        <div class="pra-panel" style="padding:8px 20px" id="responsesList"><div class="pra-muted" style="padding:16px 0">Loading…</div></div>
      </div>
    </div>
  </div>
</div>
<script src="/crm-nav.js"></script>
<script>
function escapeHtml(s) { const d = document.createElement('div'); d.textContent = String(s ?? ''); return d.innerHTML; }
function uid() { return 'f' + Math.random().toString(36).slice(2, 10); }

// Two-tone icon set (white linework + #009bff accent), same visual language
// as chat-app/chat.html's .icon-btn svgs.
const ICONS = {
  short_text: '<svg viewBox="0 0 24 24" fill="none"><path d="M4 20l1-4.5L15.5 5 19 8.5 8.5 19 4 20Z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/><path d="M13 7l4 4" stroke="#009bff" stroke-width="1.6"/></svg>',
  long_text: '<svg viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h10" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><circle cx="19" cy="18" r="1.3" fill="#009bff"/></svg>',
  email: '<svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5.5" width="17" height="13" rx="2" stroke="#fff" stroke-width="1.6"/><path d="M4.5 7l7.5 6 7.5-6" stroke="#009bff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  phone: '<svg viewBox="0 0 24 24" fill="none"><path d="M6 3.5c1 0 2.8.3 3 1.5.2 1.2.6 2.4 1 3.2.3.6.1 1.1-.3 1.5l-1.2 1.2c1 2.2 2.9 4.1 5.1 5.1l1.2-1.2c.4-.4.9-.6 1.5-.3.8.4 2 .8 3.2 1 1.2.2 1.5 2 1.5 3 0 1.2-1 2.1-2.2 2C11.8 20.3 3.7 12.2 3 4.7 2.9 3.5 4.8 3.5 6 3.5Z" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>',
  person: '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.3" stroke="#fff" stroke-width="1.6"/><path d="M5 20c1-3.5 4-5.5 7-5.5s6 2 7 5.5" stroke="#009bff" stroke-width="1.5" stroke-linecap="round"/></svg>',
  number: '<svg viewBox="0 0 24 24" fill="none"><path d="M9 3.5L7 20.5M17 3.5L15 20.5" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><path d="M4 8.5h16M3.5 15.5h16" stroke="#009bff" stroke-width="1.4" stroke-linecap="round"/></svg>',
  dropdown: '<svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="6.5" width="17" height="11" rx="2" stroke="#fff" stroke-width="1.6"/><path d="M9 12l3 2.5 3-2.5" stroke="#009bff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  multiple_choice: '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="7.5" stroke="#fff" stroke-width="1.6"/><circle cx="12" cy="12" r="3.2" fill="#009bff"/></svg>',
  checkboxes: '<svg viewBox="0 0 24 24" fill="none"><rect x="4.5" y="4.5" width="15" height="15" rx="3" stroke="#fff" stroke-width="1.6"/><path d="M8 12.3l2.6 2.6L16.5 9" stroke="#009bff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  date: '<svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5.5" width="17" height="15" rx="2" stroke="#fff" stroke-width="1.6"/><path d="M3.5 10h17" stroke="#fff" stroke-width="1.6"/><path d="M8 3.5v4M16 3.5v4" stroke="#009bff" stroke-width="1.6" stroke-linecap="round"/></svg>',
  statement: '<svg viewBox="0 0 24 24" fill="none"><path d="M4 5.5h16v10H9.5L5 19v-3.5H4v-10Z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/><path d="M7.5 9h9M7.5 12h6" stroke="#009bff" stroke-width="1.4" stroke-linecap="round"/></svg>',
  page_break: '<svg viewBox="0 0 24 24" fill="none"><path d="M4 12h5M20 12h-5" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><path d="M12 5v14" stroke="#009bff" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 3"/></svg>',
  ellipsis: '<svg viewBox="0 0 24 24" fill="none"><circle cx="6" cy="12" r="1.6" fill="#fff"/><circle cx="12" cy="12" r="1.6" fill="#fff"/><circle cx="18" cy="12" r="1.6" fill="#009bff"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none"><path d="M5 7h14M9.5 7V5a1.5 1.5 0 0 1 1.5-1.5h2A1.5 1.5 0 0 1 14.5 5v2" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><path d="M6.5 7l1 12.5a2 2 0 0 0 2 1.8h5a2 2 0 0 0 2-1.8L17.5 7" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 11v6M14 11v6" stroke="#009bff" stroke-width="1.5" stroke-linecap="round"/></svg>',
  grip: '<svg viewBox="0 0 24 24" fill="none"><circle cx="9" cy="6" r="1.5" fill="#fff"/><circle cx="15" cy="6" r="1.5" fill="#009bff"/><circle cx="9" cy="12" r="1.5" fill="#009bff"/><circle cx="15" cy="12" r="1.5" fill="#fff"/><circle cx="9" cy="18" r="1.5" fill="#fff"/><circle cx="15" cy="18" r="1.5" fill="#009bff"/></svg>',
  logic: '<svg viewBox="0 0 24 24" fill="none"><circle cx="6" cy="6" r="2" stroke="#fff" stroke-width="1.5"/><circle cx="6" cy="18" r="2" stroke="#fff" stroke-width="1.5"/><circle cx="18" cy="12" r="2" stroke="#009bff" stroke-width="1.5"/><path d="M8 6.5C12 6.5 12 12 16.5 12M8 17.5C12 17.5 12 12 16.5 12" stroke="#fff" stroke-width="1.4"/></svg>',
};

const FIELD_META = {
  short_text: { label: 'Short Text', icon: ICONS.short_text },
  long_text: { label: 'Long Text', icon: ICONS.long_text },
  email: { label: 'Email', icon: ICONS.email },
  phone: { label: 'Phone', icon: ICONS.phone },
  first_name: { label: 'First Name', icon: ICONS.person },
  last_name: { label: 'Last Name', icon: ICONS.person },
  number: { label: 'Number', icon: ICONS.number },
  dropdown: { label: 'Dropdown', icon: ICONS.dropdown, hasOptions: true },
  multiple_choice: { label: 'Multiple Choice', icon: ICONS.multiple_choice, hasOptions: true },
  checkboxes: { label: 'Checkboxes', icon: ICONS.checkboxes, hasOptions: true },
  date: { label: 'Date', icon: ICONS.date },
  statement: { label: 'Statement', icon: ICONS.statement },
  page_break: { label: 'Page Break', icon: ICONS.page_break },
};
const NO_REQUIRE = ['statement', 'page_break'];
const LOGIC_OPS = [
  { value: 'equals', label: 'equals' },
  { value: 'not_equals', label: 'does not equal' },
  { value: 'contains', label: 'contains' },
  { value: 'is_answered', label: 'is answered' },
  { value: 'is_empty', label: 'is empty' },
];

const formId = new URLSearchParams(location.search).get('id');
let form = null, allStatuses = [], allTags = [], allLists = [];
let saveTimer, expandedIdx = new Set(), dragFromIdx = null;

async function loadRefs() {
  const [statusesRes, tagsRes, listsRes] = await Promise.all([fetch('/api/statuses'), fetch('/api/tags'), fetch('/api/lists')]);
  allStatuses = (await statusesRes.json()).statuses;
  allTags = (await tagsRes.json()).tags;
  allLists = (await listsRes.json()).lists;
}

async function loadForm() {
  const r = await fetch('/api/forms/' + formId);
  if (!r.ok) { document.getElementById('formName').value = 'Form not found'; return; }
  form = (await r.json()).form;
  render();
}

function saveDebounced() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveForm, 400);
}
async function saveForm() {
  const r = await fetch('/api/forms/' + form.id, {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: form.name, status: form.status, fields: form.fields, settings: form.settings, theme: form.theme }),
  });
  if (r.ok) document.getElementById('savedMsg').textContent = 'Saved at ' + new Date().toLocaleTimeString();
}

// ── Build tab ────────────────────────────────────────────────────────────
function renderLogicRule(field, rule, fi, ri) {
  const needsValue = !['is_answered', 'is_empty'].includes(rule.op);
  const valueInput = FIELD_META[field.type].hasOptions
    ? `<select class="pra-select" data-logic-value-idx="${fi}" data-logic-value-ri="${ri}">${field.options.map(o => `<option value="${escapeHtml(o.label)}" ${rule.value === o.label ? 'selected' : ''}>${escapeHtml(o.label)}</option>`).join('')}</select>`
    : `<input class="pra-input" data-logic-value-idx="${fi}" data-logic-value-ri="${ri}" value="${escapeHtml(rule.value || '')}" placeholder="value"/>`;
  return `
    <div class="logic-rule">
      <span class="pra-muted" style="font-size:.78rem;white-space:nowrap">If this answer</span>
      <select class="pra-select" data-logic-op-idx="${fi}" data-logic-op-ri="${ri}">
        ${LOGIC_OPS.map(o => `<option value="${o.value}" ${rule.op === o.value ? 'selected' : ''}>${o.label}</option>`).join('')}
      </select>
      ${needsValue ? valueInput : ''}
      <span class="pra-muted" style="font-size:.78rem;white-space:nowrap">then</span>
      <select class="pra-select" data-logic-action-idx="${fi}" data-logic-action-ri="${ri}">
        <option value="hide_next" ${rule.action === 'hide_next' ? 'selected' : ''}>Hide Next button</option>
        <option value="redirect" ${rule.action === 'redirect' ? 'selected' : ''}>Redirect when Next is clicked</option>
      </select>
      ${rule.action === 'redirect' ? `<input class="pra-input fill" data-logic-url-idx="${fi}" data-logic-url-ri="${ri}" value="${escapeHtml(rule.redirectUrl || '')}" placeholder="https://..."/>` : ''}
      <button class="icon-btn icon-btn-sm" data-logic-del-idx="${fi}" data-logic-del-ri="${ri}" title="Delete rule">${ICONS.trash}</button>
    </div>
  `;
}

function renderFieldList() {
  const list = document.getElementById('fieldList');
  if (!form.fields.length) { list.innerHTML = '<div class="pra-muted" style="padding:16px 0">No fields yet — add one below.</div>'; }
  else list.innerHTML = form.fields.map((f, i) => {
    const meta = FIELD_META[f.type];
    const requireApplicable = !NO_REQUIRE.includes(f.type);
    const logicApplicable = !NO_REQUIRE.includes(f.type);
    return `
    <div class="field-card" draggable="true" data-idx="${i}">
      <div class="field-card-row">
        <span class="drag-handle">${ICONS.grip}</span>
        <span class="field-type-badge"><span class="field-icon">${meta.icon}</span>${meta.label}</span>
        ${f.type === 'page_break' ? '<span class="pra-muted" style="flex:1;font-size:.82rem">Splits the form into a new step here</span>' :
          `<input class="field-label-input" data-label-idx="${i}" value="${escapeHtml(f.label)}" placeholder="Question label"/>`}
        ${requireApplicable ? `<label class="req-toggle"><input type="checkbox" data-req-idx="${i}" ${f.required ? 'checked' : ''}/> Required</label>` : ''}
        <button class="icon-btn icon-btn-sm" data-expand-idx="${i}" title="More options">${ICONS.ellipsis}</button>
        <button class="icon-btn icon-btn-sm" data-del-idx="${i}" title="Delete">${ICONS.trash}</button>
      </div>
      <div class="field-detail ${expandedIdx.has(i) ? 'open' : ''}" id="detail-${i}">
        ${f.type !== 'statement' && f.type !== 'page_break' ? `<div class="field"><label class="pra-label">Placeholder</label><input class="pra-input" data-placeholder-idx="${i}" value="${escapeHtml(f.placeholder || '')}"/></div>` : ''}
        ${f.type !== 'page_break' ? `<div class="field"><label class="pra-label">Help text</label><input class="pra-input" data-help-idx="${i}" value="${escapeHtml(f.helpText || '')}"/></div>` : ''}
        ${meta.hasOptions ? `
          <div class="pra-label" style="margin-bottom:6px">Options</div>
          <div id="options-${i}">
            ${f.options.map((o, oi) => `
              <div class="option-row">
                <input class="pra-input" data-opt-idx="${i}" data-opt-oi="${oi}" value="${escapeHtml(o.label)}"/>
                <button class="icon-btn icon-btn-sm" data-opt-del-idx="${i}" data-opt-del-oi="${oi}">${ICONS.trash}</button>
              </div>
            `).join('')}
          </div>
          <button class="pra-btn pra-btn-ghost pra-btn-sm" data-opt-add-idx="${i}">+ Add option</button>
        ` : ''}
        ${logicApplicable ? `
          <div class="section-label"><span class="field-icon">${ICONS.logic}</span><span class="pra-label" style="margin:0">Logic</span></div>
          <div id="logic-${i}">${(f.logic || []).map((rule, ri) => renderLogicRule(f, rule, i, ri)).join('') || '<div class="pra-muted" style="font-size:.8rem;margin-bottom:8px">No rules — the Next button always advances normally.</div>'}</div>
          <button class="pra-btn pra-btn-ghost pra-btn-sm" data-logic-add-idx="${i}">+ Add Rule</button>
        ` : ''}
      </div>
    </div>`;
  }).join('');

  list.querySelectorAll('[data-label-idx]').forEach(el => el.addEventListener('input', e => { form.fields[+e.target.dataset.labelIdx].label = e.target.value; saveDebounced(); }));
  list.querySelectorAll('[data-req-idx]').forEach(el => el.addEventListener('change', e => { form.fields[+e.target.dataset.reqIdx].required = e.target.checked; saveDebounced(); }));
  list.querySelectorAll('[data-placeholder-idx]').forEach(el => el.addEventListener('input', e => { form.fields[+e.target.dataset.placeholderIdx].placeholder = e.target.value; saveDebounced(); }));
  list.querySelectorAll('[data-help-idx]').forEach(el => el.addEventListener('input', e => { form.fields[+e.target.dataset.helpIdx].helpText = e.target.value; saveDebounced(); }));
  list.querySelectorAll('[data-opt-idx]').forEach(el => el.addEventListener('input', e => {
    form.fields[+e.target.dataset.optIdx].options[+e.target.dataset.optOi].label = e.target.value; saveDebounced();
  }));
  list.querySelectorAll('[data-expand-idx]').forEach(btn => btn.onclick = () => {
    const i = +btn.dataset.expandIdx;
    expandedIdx.has(i) ? expandedIdx.delete(i) : expandedIdx.add(i);
    renderFieldList();
  });
  list.querySelectorAll('[data-del-idx]').forEach(btn => btn.onclick = () => {
    form.fields.splice(+btn.dataset.delIdx, 1);
    saveDebounced(); renderFieldList();
  });
  list.querySelectorAll('[data-opt-add-idx]').forEach(btn => btn.onclick = () => {
    const i = +btn.dataset.optAddIdx;
    form.fields[i].options.push({ id: uid(), label: 'Option ' + (form.fields[i].options.length + 1) });
    saveDebounced(); renderFieldList();
  });
  list.querySelectorAll('[data-opt-del-idx]').forEach(btn => btn.onclick = () => {
    const i = +btn.dataset.optDelIdx, oi = +btn.dataset.optDelOi;
    form.fields[i].options.splice(oi, 1);
    saveDebounced(); renderFieldList();
  });

  // ── Logic rules ──────────────────────────────────────────────────────
  list.querySelectorAll('[data-logic-add-idx]').forEach(btn => btn.onclick = () => {
    const i = +btn.dataset.logicAddIdx;
    form.fields[i].logic = form.fields[i].logic || [];
    form.fields[i].logic.push({ id: uid(), op: 'equals', value: '', action: 'hide_next', redirectUrl: '' });
    saveDebounced(); renderFieldList();
  });
  list.querySelectorAll('[data-logic-op-idx]').forEach(el => el.addEventListener('change', e => {
    form.fields[+e.target.dataset.logicOpIdx].logic[+e.target.dataset.logicOpRi].op = e.target.value;
    saveDebounced(); renderFieldList();
  }));
  list.querySelectorAll('[data-logic-value-idx]').forEach(el => ['input', 'change'].forEach(evt => el.addEventListener(evt, e => {
    form.fields[+e.target.dataset.logicValueIdx].logic[+e.target.dataset.logicValueRi].value = e.target.value; saveDebounced();
  })));
  list.querySelectorAll('[data-logic-action-idx]').forEach(el => el.addEventListener('change', e => {
    form.fields[+e.target.dataset.logicActionIdx].logic[+e.target.dataset.logicActionRi].action = e.target.value;
    saveDebounced(); renderFieldList();
  }));
  list.querySelectorAll('[data-logic-url-idx]').forEach(el => el.addEventListener('input', e => {
    form.fields[+e.target.dataset.logicUrlIdx].logic[+e.target.dataset.logicUrlRi].redirectUrl = e.target.value; saveDebounced();
  }));
  list.querySelectorAll('[data-logic-del-idx]').forEach(btn => btn.onclick = () => {
    form.fields[+btn.dataset.logicDelIdx].logic.splice(+btn.dataset.logicDelRi, 1);
    saveDebounced(); renderFieldList();
  });

  // Native HTML5 drag-and-drop reordering.
  list.querySelectorAll('.field-card').forEach(card => {
    card.addEventListener('dragstart', () => { dragFromIdx = +card.dataset.idx; card.classList.add('dragging'); });
    card.addEventListener('dragend', () => card.classList.remove('dragging'));
    card.addEventListener('dragover', e => e.preventDefault());
    card.addEventListener('drop', e => {
      e.preventDefault();
      const toIdx = +card.dataset.idx;
      if (dragFromIdx === null || dragFromIdx === toIdx) return;
      const [moved] = form.fields.splice(dragFromIdx, 1);
      form.fields.splice(toIdx, 0, moved);
      dragFromIdx = null;
      saveDebounced(); renderFieldList();
    });
  });
}

function addField(type) {
  const field = { id: uid(), type, label: type === 'page_break' ? undefined : FIELD_META[type].label, placeholder: '', required: false, helpText: '' };
  if (FIELD_META[type].hasOptions) field.options = [{ id: uid(), label: 'Option 1' }];
  if (type === 'page_break') { delete field.placeholder; delete field.required; delete field.helpText; delete field.label; }
  form.fields.push(field);
  saveDebounced(); renderFieldList();
}

function renderAddFieldRow() {
  document.getElementById('addFieldRow').innerHTML = Object.entries(FIELD_META).map(([type, meta]) =>
    `<button class="pra-btn pra-btn-ghost" data-add-type="${type}"><span class="field-icon">${meta.icon}</span>${meta.label}</button>`
  ).join('');
  document.querySelectorAll('[data-add-type]').forEach(btn => btn.onclick = () => addField(btn.dataset.addType));
}

// ── Settings tab ─────────────────────────────────────────────────────────
function renderPicker(kind, allItems, selectedIds, addElId, chipsElId, onChange) {
  const addSel = document.getElementById(addElId);
  const available = allItems.filter(item => !selectedIds.includes(item.id));
  addSel.innerHTML = `<option value="">+ Add ${kind}…</option>` + available.map(item => `<option value="${item.id}">${escapeHtml(item.name)}</option>`).join('');
  addSel.onchange = () => {
    if (!addSel.value) return;
    onChange([...selectedIds, addSel.value]);
  };
  const chips = document.getElementById(chipsElId);
  chips.innerHTML = selectedIds.map(id => {
    const item = allItems.find(x => x.id === id);
    return `<span class="chip-option on removable" data-remove-id="${id}">${escapeHtml(item?.name || '?')}<span class="chip-x">✕</span></span>`;
  }).join('') || `<span class="pra-muted" style="font-size:.8rem">None yet</span>`;
  chips.querySelectorAll('[data-remove-id]').forEach(chip => chip.onclick = () => {
    onChange(selectedIds.filter(x => x !== chip.dataset.removeId));
  });
}

function renderSettings() {
  document.getElementById('setSubmitText').value = form.settings.submitButtonText || '';
  document.getElementById('setConfirmMsg').value = form.settings.confirmationMessage || '';
  document.getElementById('setRedirectUrl').value = form.settings.redirectUrl || '';
  const statusSel = document.getElementById('setDefaultStatus');
  statusSel.innerHTML = '<option value="">(none)</option>' + allStatuses.map(s => `<option value="${escapeHtml(s.label)}">${escapeHtml(s.label)}</option>`).join('');
  statusSel.value = form.settings.defaultStatus || '';

  renderPicker('tag', allTags, form.settings.addTagIds, 'setTagAdd', 'setTagsChips', ids => { form.settings.addTagIds = ids; saveDebounced(); renderSettings(); });
  renderPicker('list', allLists, form.settings.addListIds, 'setListAdd', 'setListsChips', ids => { form.settings.addListIds = ids; saveDebounced(); renderSettings(); });
}
['setSubmitText', 'setConfirmMsg', 'setRedirectUrl'].forEach(id => {
  document.getElementById(id).addEventListener('input', e => {
    const key = { setSubmitText: 'submitButtonText', setConfirmMsg: 'confirmationMessage', setRedirectUrl: 'redirectUrl' }[id];
    form.settings[key] = e.target.value; saveDebounced();
  });
});
document.getElementById('setDefaultStatus').addEventListener('change', e => { form.settings.defaultStatus = e.target.value; saveDebounced(); });

// ── Share tab ────────────────────────────────────────────────────────────
function renderShare() {
  const url = `${location.origin}/f/${form.id}`;
  document.getElementById('shareLink').textContent = url;
  document.getElementById('shareEmbed').textContent = `<iframe src="${url}" width="100%" height="700" style="border:none"></iframe>`;
  document.getElementById('shareWarning').style.display = form.status === 'published' ? 'none' : 'block';
  document.getElementById('viewLink').href = url;
}

// ── Responses tab ────────────────────────────────────────────────────────
async function loadResponses() {
  const wrap = document.getElementById('responsesList');
  const r = await fetch(`/api/forms/${form.id}/responses`);
  if (!r.ok) { wrap.innerHTML = '<div class="pra-muted" style="padding:16px 0">Could not load responses.</div>'; return; }
  const { responses } = await r.json();
  if (!responses.length) { wrap.innerHTML = '<div class="pra-muted" style="padding:16px 0">No submissions yet.</div>'; return; }
  wrap.innerHTML = responses.map((resp, i) => `
    <div class="resp-row" data-resp-idx="${i}">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span>${resp.contact ? escapeHtml(`${resp.contact.first} ${resp.contact.last}`.trim() || resp.contact.email) : '<span class="pra-muted">Unmatched</span>'}</span>
        <span class="pra-muted" style="font-size:.78rem">${new Date(resp.submittedAt).toLocaleString()}</span>
      </div>
      <div class="resp-answers">
        ${form.fields.filter(f => f.type !== 'statement' && f.type !== 'page_break').map(f => {
          const val = resp.answers[f.id];
          if (val === undefined || val === '' || (Array.isArray(val) && !val.length)) return '';
          return `<div class="qa"><div class="q">${escapeHtml(f.label || f.type)}</div><div>${escapeHtml(Array.isArray(val) ? val.join(', ') : val)}</div></div>`;
        }).join('')}
      </div>
    </div>
  `).join('');
  wrap.querySelectorAll('[data-resp-idx]').forEach(row => row.onclick = () => row.classList.toggle('open'));
}

// ── Header + tabs ────────────────────────────────────────────────────────
function render() {
  document.getElementById('formName').value = form.name;
  const statusBtn = document.getElementById('statusToggle');
  statusBtn.textContent = form.status === 'published' ? 'Published' : 'Draft';
  statusBtn.className = 'status-toggle-btn' + (form.status === 'published' ? ' published' : '');
  renderFieldList();
  renderAddFieldRow();
  renderSettings();
  renderShare();
}

document.getElementById('formName').addEventListener('input', e => { form.name = e.target.value; saveDebounced(); });
document.getElementById('statusToggle').onclick = () => {
  form.status = form.status === 'published' ? 'draft' : 'published';
  render(); saveDebounced();
};

document.querySelectorAll('.tab-btn').forEach(btn => btn.onclick = () => {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  if (btn.dataset.tab === 'responses') loadResponses();
});

(async function init() {
  await loadRefs();
  await loadForm();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Agents — CRM</title>
<link rel="stylesheet" href="/crm-design-system.css"/>
<style>
  .toolbar { display: flex; align-items: center; margin-bottom: 18px; }
  .agent-active-pill { font-size: .68rem; text-transform: uppercase; padding: 3px 10px; border-radius: 10px; }
  .agent-on { background: rgba(0,155,255,0.15); color: var(--pra-blue); }
  .agent-off { background: rgba(255,255,255,0.1); color: #fff; }
</style>
</head>
<body>
<div class="pra-root">
  <div class="app-shell">
    <div class="app-sidebar" id="appSidebar"></div>
    <div class="app-main">
      <div class="mobile-sticky-header">
        <div class="toolbar">
          <div class="pra-h1" style="flex:1">AI Agents</div>
          <button class="pra-btn" id="newAgentBtn">+ New Agent</button>
        </div>
        <div class="pra-muted" style="font-size:.82rem">AI Assist drafts replies for you to review in the Inbox. AI Active independently works a batch of leads you choose and pick to review. Both start OFF until you deliberately turn them on.</div>
      </div>
      <div class="pra-panel" style="overflow-x:auto">
        <table class="data-table">
          <thead><tr>
            <th>Name</th><th>Status</th><th>Targeting</th><th>Last Updated</th><th></th>
          </tr></thead>
          <tbody id="agentsBody"><tr><td colspan="5" class="pra-muted">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="/crm-nav.js"></script>
<script>
function escapeHtml(s) { const d = document.createElement('div'); d.textContent = String(s ?? ''); return d.innerHTML; }
function fmtDate(iso) { return iso ? new Date(iso).toLocaleString() : ''; }

async function loadAgents() {
  const r = await fetch('/api/ai-agents');
  const body = document.getElementById('agentsBody');
  if (!r.ok) { body.innerHTML = '<tr><td colspan="5" class="pra-muted">Could not load agents.</td></tr>'; return; }
  const { agents } = await r.json();
  if (!agents.length) { body.innerHTML = '<tr><td colspan="5" class="pra-muted">No agents yet — click "+ New Agent" to create one.</td></tr>'; return; }
  const sorted = [...agents].sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
  body.innerHTML = sorted.map(a => {
    const targeting = [];
    if (a.targeting?.programTypes?.length) targeting.push(a.targeting.programTypes.join('/'));
    if (a.targeting?.statuses?.length) targeting.push(a.targeting.statuses.length + ' status(es)');
    if (a.targeting?.coverForUserIds?.length) targeting.push('covers ' + a.targeting.coverForUserIds.length + ' user(s)');
    return `
    <tr>
      <td class="clickable" style="cursor:pointer;color:var(--pra-blue)" data-edit="${a.id}">${escapeHtml(a.name)}</td>
      <td><span class="agent-active-pill ${a.active ? 'agent-on' : 'agent-off'}">${a.active ? 'AI Active' : 'Off'}</span>${a.aiAssist ? '<span class="agent-active-pill agent-on" style="margin-left:4px">AI Assist</span>' : ''}</td>
      <td class="pra-muted" style="font-size:.8rem">${targeting.length ? escapeHtml(targeting.join(' · ')) : 'All leads'}</td>
      <td class="pra-muted">${fmtDate(a.updatedAt)}</td>
      <td style="white-space:nowrap">
        <button class="pra-btn pra-btn-ghost pra-btn-sm" data-edit="${a.id}">Edit</button>
        <button class="pra-btn pra-btn-sm pra-btn-danger" data-del="${a.id}">Delete</button>
      </td>
    </tr>`;
  }).join('');
  body.querySelectorAll('[data-edit]').forEach(el => el.addEventListener('click', () => { location.href = '/ai-agent-editor.html?id=' + el.dataset.edit; }));
  body.querySelectorAll('[data-del]').forEach(el => el.addEventListener('click', async (e) => {
    e.stopPropagation();
    if (!confirm('Delete this agent? This cannot be undone.')) return;
    await fetch(`/api/ai-agents/${el.dataset.del}`, { method: 'DELETE' });
    loadAgents();
  }));
}

document.getElementById('newAgentBtn').addEventListener('click', async () => {
  const r = await fetch('/api/ai-agents', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: 'New Agent' }) });
  const { agent } = await r.json();
  if (r.ok) location.href = '/ai-agent-editor.html?id=' + agent.id;
});

loadAgents();
</script>
</body>
</html>

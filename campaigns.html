<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Email Campaigns — CRM</title>
<link rel="stylesheet" href="/crm-design-system.css"/>
<style>
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; margin-bottom: 18px; gap: 8px; }
  .status-pill { font-size: .68rem; text-transform: uppercase; padding: 3px 10px; border-radius: 10px; }
  .status-draft { background: rgba(255,255,255,0.1); color: #fff; }
  .status-scheduled { background: rgba(255,193,7,0.15); color: #ffc107; }
  .status-sending { background: rgba(0,155,255,0.15); color: var(--pra-blue); }
  .status-sent { background: rgba(57,255,20,0.15); color: var(--pra-green); }
  .toolbar input { max-width: 320px; margin-right: 12px; }
  th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
  th.sortable:hover { color: var(--pra-white); }
  th.sortable .sort-arrow { font-size: .7rem; margin-left: 3px; opacity: .5; }
  th.sortable.sorted .sort-arrow { opacity: 1; }
</style>
</head>
<body>
<div class="pra-root">
  <div class="app-shell">
    <div class="app-sidebar" id="appSidebar"></div>
    <div class="app-main">
      <div class="mobile-sticky-header">
        <div class="toolbar">
          <div class="pra-h1" style="flex:1">Email Campaigns</div>
          <input class="pra-input" id="campaignSearch" placeholder="Search name, subject, or content..."/>
          <button class="pra-btn" id="newCampaignBtn">+ New Campaign</button>
        </div>
      </div>
      <div class="pra-panel" style="overflow-x:auto">
        <table class="data-table">
          <thead><tr>
            <th class="sortable" data-sort="name">Name</th>
            <th class="sortable" data-sort="status">Status</th>
            <th>Subject</th>
            <th class="sortable" data-sort="sent">Sent</th>
            <th class="sortable" data-sort="opened">Opened</th>
            <th class="sortable" data-sort="clicked">Clicked</th>
            <th class="sortable" data-sort="updatedAt">Last Updated</th>
            <th></th>
          </tr></thead>
          <tbody id="campaignsBody"><tr><td colspan="8" class="pra-muted">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<script src="/crm-nav.js"></script>
<script>
function escapeHtml(s) { const d = document.createElement('div'); d.textContent = String(s ?? ''); return d.innerHTML; }
function fmtDate(iso) { return iso ? new Date(iso).toLocaleString() : ''; }

let allCampaigns = [];
let campaignSort = { field: 'updatedAt', dir: -1 };
function campaignSearchText(c) {
  const blockText = (c.blocks || []).map(b => b.html || b.text || '').join(' ');
  return `${c.name} ${c.subject || ''} ${blockText}`.replace(/<[^>]+>/g, ' ').toLowerCase();
}
function renderCampaignsTable() {
  const q = document.getElementById('campaignSearch').value.trim().toLowerCase();
  let rows = allCampaigns.filter(c => !q || campaignSearchText(c).includes(q));
  const { field, dir } = campaignSort;
  rows = [...rows].sort((a, b) => {
    let av, bv;
    if (field === 'sent') { av = a.stats?.sent ?? 0; bv = b.stats?.sent ?? 0; }
    else if (field === 'opened') { av = a.stats?.opened ?? 0; bv = b.stats?.opened ?? 0; }
    else if (field === 'clicked') { av = a.stats?.clicked ?? 0; bv = b.stats?.clicked ?? 0; }
    else if (field === 'updatedAt') { av = a.updatedAt || ''; bv = b.updatedAt || ''; }
    else { av = (a[field] || '').toString().toLowerCase(); bv = (b[field] || '').toString().toLowerCase(); }
    return av < bv ? -dir : av > bv ? dir : 0;
  });
  document.querySelectorAll('th.sortable').forEach(th => {
    th.classList.toggle('sorted', th.dataset.sort === field);
    const existing = th.querySelector('.sort-arrow'); if (existing) existing.remove();
    if (th.dataset.sort === field) th.insertAdjacentHTML('beforeend', `<span class="sort-arrow">${dir === 1 ? '▲' : '▼'}</span>`);
  });
  const body = document.getElementById('campaignsBody');
  if (!rows.length) { body.innerHTML = '<tr><td colspan="8" class="pra-muted">No campaigns match.</td></tr>'; return; }
  body.innerHTML = rows.map(c => `
    <tr>
      <td class="clickable" onclick="location.href='/campaign-builder.html?id=${c.id}'" style="cursor:pointer">${escapeHtml(c.name)}</td>
      <td><span class="status-pill status-${c.status}">${c.status}</span></td>
      <td class="pra-muted">${escapeHtml(c.subject || '')}</td>
      <td>${c.stats?.sent ?? 0}</td>
      <td>${c.stats?.opened ?? 0}</td>
      <td>${c.stats?.clicked ?? 0}</td>
      <td class="pra-muted">${fmtDate(c.updatedAt)}</td>
      <td style="white-space:nowrap">
        <a class="pra-btn pra-btn-ghost pra-btn-sm" href="/campaign-report.html?id=${c.id}" onclick="event.stopPropagation()">View Report</a>
        <button class="pra-btn pra-btn-ghost pra-btn-sm" data-dup="${c.id}">Copy</button>
        <button class="pra-btn pra-btn-sm pra-btn-danger" data-del="${c.id}">Delete</button>
      </td>
    </tr>
  `).join('');
  document.querySelectorAll('[data-dup]').forEach(btn => btn.onclick = async (e) => {
    e.stopPropagation();
    const r = await fetch(`/api/campaigns/${btn.dataset.dup}/duplicate`, { method: 'POST' });
    const d = await r.json();
    if (r.ok) location.href = '/campaign-builder.html?id=' + d.campaign.id;
  });
  document.querySelectorAll('[data-del]').forEach(btn => btn.onclick = async (e) => {
    e.stopPropagation();
    if (!confirm('Delete this campaign?')) return;
    await fetch('/api/campaigns/' + btn.dataset.del, { method: 'DELETE' });
    loadCampaigns();
  });
}
async function loadCampaigns() {
  const r = await fetch('/api/campaigns');
  if (!r.ok) { document.getElementById('campaignsBody').innerHTML = '<tr><td colspan="8" class="pra-muted">Could not load campaigns.</td></tr>'; return; }
  allCampaigns = (await r.json()).campaigns;
  renderCampaignsTable();
}
document.getElementById('campaignSearch').addEventListener('input', () => { clearTimeout(window._cst); window._cst = setTimeout(renderCampaignsTable, 200); });
document.querySelectorAll('th.sortable').forEach(th => th.addEventListener('click', () => {
  if (campaignSort.field === th.dataset.sort) campaignSort.dir *= -1;
  else campaignSort = { field: th.dataset.sort, dir: 1 };
  renderCampaignsTable();
}));

document.getElementById('newCampaignBtn').onclick = async () => {
  const r = await fetch('/api/campaigns', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: 'Untitled Campaign' }) });
  const d = await r.json();
  if (r.ok) location.href = '/campaign-builder.html?id=' + d.campaign.id;
};

loadCampaigns();
</script>
</body>
</html>

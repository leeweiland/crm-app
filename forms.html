<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Forms — CRM</title>
<link rel="stylesheet" href="/crm-design-system.css"/>
<style>
  .toolbar { display: flex; align-items: center; margin-bottom: 18px; }
  .status-pill { font-size: .68rem; text-transform: uppercase; padding: 3px 10px; border-radius: 10px; }
  .status-draft { background: rgba(255,255,255,0.1); color: #fff; }
  .status-published { background: rgba(57,255,20,0.15); color: var(--pra-green); }
  .data-table th[data-sort] { cursor: pointer; user-select: none; }
  .data-table th[data-sort]:hover { color: var(--pra-white); }
  .data-table th[data-sort].sort-asc::after { content: ' \25B2'; font-size: .7em; }
  .data-table th[data-sort].sort-desc::after { content: ' \25BC'; font-size: .7em; }
</style>
</head>
<body>
<div class="pra-root">
  <div class="app-shell">
    <div class="app-sidebar" id="appSidebar"></div>
    <div class="app-main">
      <div class="mobile-sticky-header">
        <div class="toolbar">
          <div class="pra-h1" style="flex:1">Forms</div>
          <button class="pra-btn" id="newFormBtn">+ New Form</button>
        </div>
        <div class="pra-muted" style="font-size:.82rem">Build lead-capture forms, publish them, and every submission lands in Contacts and can trigger automations/workflows.</div>
      </div>
      <div class="pra-panel" style="overflow-x:auto">
        <table class="data-table">
          <thead><tr>
            <th data-sort="name">Name</th><th data-sort="status">Status</th><th data-sort="responses">Responses</th><th data-sort="updatedAt">Last Updated</th><th></th>
          </tr></thead>
          <tbody id="formsBody"><tr><td colspan="5" class="pra-muted">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<script src="/crm-nav.js"></script>
<script>
function escapeHtml(s) { const d = document.createElement('div'); d.textContent = String(s ?? ''); return d.innerHTML; }
function fmtDate(iso) { return iso ? new Date(iso).toLocaleString() : ''; }

let formsCache = [];
let formsSort = { key: 'updatedAt', dir: 'desc' };
const FORM_SORT_ACCESSORS = {
  name: f => (f.name || '').toLowerCase(),
  status: f => f.status || '',
  responses: f => f.responseCount || 0,
  updatedAt: f => new Date(f.updatedAt).getTime() || 0,
};
document.querySelectorAll('[data-sort]').forEach(th => th.onclick = () => {
  const key = th.dataset.sort;
  formsSort = { key, dir: formsSort.key === key && formsSort.dir === 'desc' ? 'asc' : 'desc' };
  renderFormsTable();
});

async function loadForms() {
  const r = await fetch('/api/forms');
  const body = document.getElementById('formsBody');
  if (!r.ok) { body.innerHTML = '<tr><td colspan="5" class="pra-muted">Could not load forms.</td></tr>'; return; }
  formsCache = (await r.json()).forms;
  renderFormsTable();
}

function renderFormsTable() {
  const body = document.getElementById('formsBody');
  document.querySelectorAll('[data-sort]').forEach(th => {
    th.classList.remove('sort-asc', 'sort-desc');
    if (th.dataset.sort === formsSort.key) th.classList.add('sort-' + formsSort.dir);
  });
  if (!formsCache.length) { body.innerHTML = '<tr><td colspan="5" class="pra-muted">No forms yet — click "+ New Form" to build one.</td></tr>'; return; }
  const acc = FORM_SORT_ACCESSORS[formsSort.key];
  const factor = formsSort.dir === 'asc' ? 1 : -1;
  const sorted = [...formsCache].sort((a, b) => { const av = acc(a), bv = acc(b); return av < bv ? -factor : av > bv ? factor : 0; });
  body.innerHTML = sorted.map(f => `
    <tr>
      <td class="clickable" onclick="location.href='/form-builder.html?id=${f.id}'" style="cursor:pointer">${escapeHtml(f.name)}</td>
      <td><span class="status-pill status-${f.status}">${f.status}</span></td>
      <td>${f.responseCount}</td>
      <td class="pra-muted">${fmtDate(f.updatedAt)}</td>
      <td style="white-space:nowrap">
        <a class="pra-btn pra-btn-ghost pra-btn-sm" href="/form-builder.html?id=${f.id}" onclick="event.stopPropagation()">Edit</a>
        <button class="pra-btn pra-btn-sm pra-btn-danger" data-del="${f.id}">Delete</button>
      </td>
    </tr>
  `).join('');
  document.querySelectorAll('[data-del]').forEach(btn => btn.onclick = async (e) => {
    e.stopPropagation();
    if (!confirm('Delete this form and all its responses?')) return;
    await fetch('/api/forms/' + btn.dataset.del, { method: 'DELETE' });
    loadForms();
  });
}

document.getElementById('newFormBtn').onclick = async () => {
  const r = await fetch('/api/forms', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: 'Untitled Form' }) });
  const d = await r.json();
  if (r.ok) location.href = '/form-builder.html?id=' + d.form.id;
};

loadForms();
</script>
</body>
</html>

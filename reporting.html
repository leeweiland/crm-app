<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Reporting — CRM</title>
<link rel="stylesheet" href="/crm-design-system.css"/>
</head>
<body>
<div class="pra-root">
  <div class="app-shell">
    <div class="app-sidebar" id="appSidebar"></div>
    <div class="app-main">
      <div class="pra-h1" style="margin-bottom:20px">Reporting</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px" id="statsGrid"></div>
      <div class="pra-muted" style="font-size:.85rem">
        Email reporting is live. SMS, automations, and workflow reporting land in later phases,
        all reading from the same activity log this already uses.
      </div>
    </div>
  </div>
</div>
<script src="/crm-nav.js"></script>
<script>
const LABELS = { sent: 'Sent', delivered: 'Delivered', opened: 'Opened', clicked: 'Clicked', bounced: 'Bounced', complained: 'Complained', failed: 'Failed' };
(async function load() {
  const r = await fetch('/api/reporting/overview');
  const grid = document.getElementById('statsGrid');
  if (!r.ok) { grid.innerHTML = '<div class="pra-muted">Could not load reporting.</div>'; return; }
  const { email } = await r.json();
  grid.innerHTML = Object.entries(LABELS).map(([key, label]) => `
    <div class="pra-card" style="padding:18px"><div class="pra-label">${label}</div><div class="pra-h1">${email[key] ?? 0}</div></div>
  `).join('');
})();
</script>
</body>
</html>

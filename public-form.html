<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Form</title>
<script>
// Set as early as possible (before first paint) so the embedded-vs-standalone
// CSS rules below apply from the very first frame instead of flashing the
// wrong one. See the .pf-embedded rules in <style> and reportHeightToParent
// further down for why embedded mode skips the forced 100vh height.
try { if (window.self !== window.top) document.documentElement.classList.add('pf-embedded'); } catch (e) { document.documentElement.classList.add('pf-embedded'); }
</script>
<link rel="stylesheet" href="/crm-design-system.css"/>
<style>
  body { background: var(--pra-black-soft); }
  .pf-wrap { display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
  /* Only force full-viewport height (for nice vertical centering) when
     this page is opened directly, not embedded -- inside an iframe embed
     it self-reports its real content height to the parent (see
     reportHeightToParent below) so the embed's box can shrink-to-fit
     instead of always being at least one viewport tall, which would
     never let the box shrink back down between steps. */
  html:not(.pf-embedded) .pf-wrap { min-height: 100vh; min-height: 100dvh; }
  /* crm-design-system.css's .pra-root carries its own min-height:100vh for
     the CRM's normal full-page screens -- this page reuses that class for
     its shared styling but needs it to NOT force a full viewport height
     while embedded, for the same shrink-to-fit reason as .pf-wrap above. */
  html.pf-embedded .pra-root { min-height: 0; }
  /* No max-width cap -- the card fills whatever container it's placed in
     (a wide desktop viewport, a narrow iframe embed, anything in between)
     instead of floating as a fixed-size box with dead space around it. */
  .pf-card { width: 100%; padding: 40px 36px; border-radius: var(--pf-radius, 12px); box-sizing: border-box; }
  /* Below ~560px (phones, and any narrow embed container) the floating
     card + gutters just reads as wasted space -- go edge-to-edge like a
     native app screen instead of a postage stamp. */
  @media (max-width: 560px) {
    .pf-wrap { padding: 0; align-items: flex-start; }
    .pf-card { border-radius: 0; padding: 28px 20px; }
    html:not(.pf-embedded) .pf-card { min-height: 100vh; min-height: 100dvh; }
    /* The calendar has its own card, shadow, and padding -- .pf-card's own
       20px text-reading padding on top of that is redundant width lost on
       a screen where every pixel matters. Negative-margin just this field
       back out to the true edge instead of shrinking the calendar inside it. */
    .pf-field:has(.scheduling-inline-widget) { margin-left: -20px; margin-right: -20px; }
  }
  .pf-card .pra-input, .pf-card .pra-select, .pf-card .pra-textarea, .pf-card .pra-btn, .pf-choice-row { border-radius: calc(var(--pf-radius, 12px) * .65); }
  .pf-progress { display: flex; gap: 6px; margin-bottom: 24px; }
  .pf-progress span { flex: 1; height: 3px; border-radius: 2px; background: var(--pra-border); }
  .pf-progress span.done { background: var(--pra-blue); }
  .pf-field { margin-bottom: 20px; }
  .pf-label { font-family: var(--font-primary); font-weight: 700; font-size: 1.05rem; margin-bottom: 4px; }
  .pf-required { color: var(--pra-blue); margin-left: 3px; }
  .pf-help { font-family: var(--font-secondary); color: var(--pra-dim); font-size: .8rem; margin-bottom: 10px; }
  .pf-statement { font-family: var(--font-secondary); font-size: .95rem; line-height: 1.5; color: var(--pra-white); }
  .pf-headline { font-family: var(--font-primary); font-weight: 800; font-size: 1.6rem; line-height: 1.25; color: var(--pra-white); }
  .pf-image img { max-width: 100%; border-radius: calc(var(--pf-radius, 12px) * .5); display: block; }
  .pf-video-embed { position: relative; width: 100%; padding-top: 56.25%; border-radius: calc(var(--pf-radius, 12px) * .5); overflow: hidden; background: #000; }
  .pf-video-embed iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  /* Wistia's own embed code manages its own sizing (the newer
     <wistia-player> is responsive via its own aspect attribute), so it's
     not wrapped in the 56.25%-padding iframe trick above. */
  .pf-raw-embed { border-radius: calc(var(--pf-radius, 12px) * .5); overflow: hidden; }
  .pf-choice-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--pra-border); border-radius: 8px; margin-bottom: 8px; cursor: pointer; }
  .pf-choice-row:hover { border-color: var(--pra-blue); }
  .pf-choice-row input { accent-color: var(--pra-blue); }
  .pf-error { color: var(--pra-red); font-size: .8rem; margin-top: 6px; min-height: 1.2em; }
  .pf-nav { display: flex; gap: 10px; margin-top: 8px; }
  .pf-confirm { text-align: center; padding: 20px 0; }
  .pf-confirm .big { margin-bottom: 12px; }
  .pf-confirm .big svg { width: 48px; height: 48px; overflow: visible; }
</style>
</head>
<body>
<div class="pra-root">
  <div class="pf-wrap">
    <div class="pra-panel pf-card" id="pfCard">
      <div class="pra-muted">Loading…</div>
    </div>
  </div>
</div>
<script>
function escapeHtml(s) { const d = document.createElement('div'); d.textContent = String(s ?? ''); return d.innerHTML; }

// ── Auto-height for the inline embed ────────────────────────────────────
// forms-widget.js's iframe starts at a fixed fallback height; without this,
// any step taller than that fallback gets its own ugly inner scrollbar
// instead of the embed's box just growing (and shrinking back down on a
// shorter step). Posts the real content height any time it changes --
// target origin is '*' since the embedding page can be on any domain and
// there's nothing sensitive in a pixel count. ResizeObserver covers most
// changes near-instantly, but a cheap poll is kept as a fallback -- it's
// what actually catches the layout settling after fonts/images/the video
// embed load in, which don't reliably fire a resize callback everywhere.
let lastReportedHeight = 0;
function reportHeightToParent() {
  if (window.self === window.top) return;
  const h = Math.ceil(document.documentElement.getBoundingClientRect().height);
  if (h === lastReportedHeight) return;
  lastReportedHeight = h;
  window.parent.postMessage({ type: 'pf-resize', height: h }, '*');
}
if (window.self !== window.top) {
  if ('ResizeObserver' in window) new ResizeObserver(reportHeightToParent).observe(document.body);
  window.addEventListener('load', reportHeightToParent);
  setInterval(reportHeightToParent, 400);
}
// Same two-tone (white linework + #009bff accent) icon convention as
// chat-app/chat.html and form-builder.html.
const CHECK_ICON = '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#fff" stroke-width="1.6"/><path d="M7.5 12.5l3 3 6-6.5" stroke="#009bff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

// ── Theme — same font/color/radius system as form-builder.html's Design
// panel. Overrides the CSS custom properties crm-design-system.css already
// defines and uses everywhere, scoped to the whole page since this page IS
// the form (no surrounding CRM chrome to protect from re-theming).
const FONT_OPTIONS = {
  default: { stack: "'Century Gothic','Poppins','Trebuchet MS',sans-serif", googleFont: null },
  aldrich: { stack: "'Aldrich',sans-serif", googleFont: null },
  poppins: { stack: "'Poppins',sans-serif", googleFont: null },
  inter: { stack: "'Inter',sans-serif", googleFont: 'Inter:wght@400;600;700' },
  roboto: { stack: "'Roboto',sans-serif", googleFont: 'Roboto:wght@400;500;700' },
  montserrat: { stack: "'Montserrat',sans-serif", googleFont: 'Montserrat:wght@400;600;700' },
  playfair: { stack: "'Playfair Display',serif", googleFont: 'Playfair+Display:wght@400;600;700' },
  lora: { stack: "'Lora',serif", googleFont: 'Lora:wght@400;600;700' },
  georgia: { stack: "Georgia,'Times New Roman',serif", googleFont: null },
  arial: { stack: "Arial,Helvetica,sans-serif", googleFont: null },
};
const RADIUS_OPTIONS = { sharp: '3px', rounded: '14px', pill: '32px' };
const THEME_DEFAULTS = { accentColor: '#009bff', backgroundColor: '#0a0a0d', cardBackground: '#101014', textColor: '#ffffff', fontFamily: 'default', secondaryFontFamily: 'aldrich', borderRadius: 'rounded' };
function hexToRgba(hex, alpha) {
  const h = (hex || '#009bff').replace('#', '');
  const r = parseInt(h.slice(0, 2), 16) || 0, g = parseInt(h.slice(2, 4), 16) || 0, b = parseInt(h.slice(4, 6), 16) || 0;
  return `rgba(${r},${g},${b},${alpha})`;
}
// slot distinguishes the primary vs secondary font's <link>, since both can
// independently point at a different Google Font at the same time.
function loadGoogleFont(spec, slot) {
  if (!spec) return;
  const link = document.createElement('link');
  link.id = 'themeGoogleFont-' + slot;
  link.rel = 'stylesheet';
  link.href = `https://fonts.googleapis.com/css2?family=${spec}&display=swap`;
  document.head.appendChild(link);
}
// Accepts a full Wistia URL or a bare media ID — same helper as
// form-builder.html's Design canvas, duplicated since this is a fully
// independent static page.
function wistiaIdFromInput(v) {
  const s = String(v || '').trim();
  if (!s) return null;
  const urlMatch = s.match(/wistia\.(?:com|net)\/(?:medias|embed\/iframe)\/([a-z0-9]+)/i);
  if (urlMatch) return urlMatch[1];
  if (/^[a-z0-9]{6,15}$/i.test(s)) return s;
  return null;
}
// The plain iframe URL doesn't work for every Wistia video (channels,
// password/domain-restricted ones, the newer <wistia-player> embed) --
// pasting Wistia's own "HTML Embed" code sidesteps that. Same helper as
// form-builder.html's Design canvas.
function isHtmlEmbed(v) {
  return /<[a-z][\s\S]*>/i.test(String(v || '').trim());
}

function applyTheme(theme) {
  const t = { ...THEME_DEFAULTS, ...(theme || {}) };
  const root = document.documentElement.style;
  root.setProperty('--pra-blue', t.accentColor);
  root.setProperty('--pra-blue-dim', hexToRgba(t.accentColor, 0.12));
  root.setProperty('--pra-blue-glow', hexToRgba(t.accentColor, 0.55));
  root.setProperty('--pra-panel', t.cardBackground);
  root.setProperty('--pra-black-soft', t.backgroundColor);
  root.setProperty('--pra-white', t.textColor);
  const font = FONT_OPTIONS[t.fontFamily] || FONT_OPTIONS.default;
  root.setProperty('--font-primary', font.stack);
  loadGoogleFont(font.googleFont, 'primary');
  const secondaryFont = FONT_OPTIONS[t.secondaryFontFamily] || FONT_OPTIONS.aldrich;
  root.setProperty('--font-secondary', secondaryFont.stack);
  loadGoogleFont(secondaryFont.googleFont, 'secondary');
  root.setProperty('--pf-radius', RADIUS_OPTIONS[t.borderRadius] || RADIUS_OPTIONS.rounded);
}

const formId = location.pathname.split('/').filter(Boolean).pop();
let form = null, steps = [], stepIndex = 0, answers = {};
// Single-choice auto-advance (see bindStepInputs) schedules a delayed click
// on #pfNext -- if the visitor manually clicks Next themselves before that
// timer fires, the stale timer still goes off later and clicks whatever
// #pfNext now refers to on the step they've since moved to, silently
// triggering that step's validation before they've touched it. Tracked
// here so every fresh renderStep() can cancel any leftover timer first.
let autoAdvanceTimer = null;

// Same split as form-builder.html/forms_backend.js's ANSWERABLE_TYPES.
const NON_ANSWERABLE_TYPES = ['statement', 'headline', 'image', 'video', 'calendar', 'page_break'];
// Same map as form-builder.html's VIDEO_ASPECT_PADDING, for the same field.videoAspect value set there.
const VIDEO_ASPECT_PADDING = { '16:9': '56.25%', '9:16': '177.78%', '1:1': '100%', '4:3': '75%' };

// Calendly-style handoff into the embedded booking widget: anything the
// form already collected on an earlier step -- name/email/phone via
// book.html's own prefill params (so it isn't asked a second time), every
// other answer via formAnswers as one flattened blob (so it ends up on the
// actual calendar event/notes, not just this form's own submission
// record), AND the same answers again as formAnswersJson -- individually
// labeled, like forms_backend.js's own labeledAnswers -- so a Flow
// triggered off booking_created can reference {{payload.Career}} etc.
// individually instead of only the one combined Notes blob. This is the
// only path those ever reach a Flow at all when the form itself has no
// email/phone field of its own (upsertContactFromSubmission needs one to
// create/match a contact, so form_submitted never fires without it).
function bookingWidgetUrl(f) {
  const url = new URL(`${location.origin}/book/${encodeURIComponent(f.eventTypeSlug)}`);
  // Tells book.html to hide its own "Confirm Booking" button -- this
  // form's own Next/Submit button drives booking instead (see
  // bookCalendarStep/the message listener below).
  url.searchParams.set('formEmbed', '1');
  const emailField = form.fields.find(ff => ff.type === 'email');
  const phoneField = form.fields.find(ff => ff.type === 'phone');
  const firstField = form.fields.find(ff => ff.type === 'first_name');
  const lastField = form.fields.find(ff => ff.type === 'last_name');
  const name = [firstField, lastField].map(ff => ff && answers[ff.id]).filter(Boolean).join(' ');
  if (name) url.searchParams.set('prefillName', name);
  if (emailField && answers[emailField.id]) url.searchParams.set('prefillEmail', answers[emailField.id]);
  if (phoneField && answers[phoneField.id]) url.searchParams.set('prefillPhone', answers[phoneField.id]);
  const carriedIds = new Set([emailField?.id, phoneField?.id, firstField?.id, lastField?.id, f.id]);
  const extraFields = form.fields.filter(ff => !NON_ANSWERABLE_TYPES.includes(ff.type) && !carriedIds.has(ff.id));
  const extraQA = [];
  const labeledAnswers = {};
  extraFields.forEach(ff => {
    const v = answers[ff.id];
    if (v === undefined || v === '') return;
    const flat = Array.isArray(v) ? v.join(', ') : v;
    extraQA.push(`${ff.label}: ${flat}`);
    labeledAnswers[ff.label] = flat;
  });
  if (extraQA.length) url.searchParams.set('formAnswers', extraQA.join('\n'));
  if (Object.keys(labeledAnswers).length) url.searchParams.set('formAnswersJson', JSON.stringify(labeledAnswers));
  return url.toString();
}

function buildSteps(fields) {
  const out = [[]];
  for (const f of fields) {
    if (f.type === 'page_break') { out.push([]); continue; }
    out[out.length - 1].push(f);
  }
  return out.filter(s => s.length);
}

function renderProgress() {
  if (steps.length <= 1) return '';
  return `<div class="pf-progress">${steps.map((_, i) => `<span class="${i <= stepIndex ? 'done' : ''}"></span>`).join('')}</div>`;
}

function renderField(f) {
  const req = f.required ? '<span class="pf-required">*</span>' : '';
  if (f.type === 'statement') {
    return `<div class="pf-field"><div class="pf-statement">${escapeHtml(f.label)}</div>${f.helpText ? `<div class="pf-help">${escapeHtml(f.helpText)}</div>` : ''}</div>`;
  }
  if (f.type === 'headline') {
    return `<div class="pf-field"><div class="pf-headline">${escapeHtml(f.label)}</div></div>`;
  }
  if (f.type === 'image') {
    if (!f.src) return '';
    const img = `<img src="${escapeHtml(f.src)}" alt="${escapeHtml(f.alt || '')}"/>`;
    return `<div class="pf-field pf-image">${f.link ? `<a href="${escapeHtml(f.link)}" target="_blank" rel="noopener">${img}</a>` : img}</div>`;
  }
  if (f.type === 'video') {
    const width = f.videoWidth || 100;
    const align = f.videoAlign || 'center';
    const sizeStyle = `width:${width}%;${align === 'right' ? 'margin-left:auto' : align === 'center' ? 'margin-left:auto;margin-right:auto' : ''}`;
    if (isHtmlEmbed(f.videoUrl)) return `<div class="pf-field"><div style="${sizeStyle}"><div class="pf-raw-embed">${f.videoUrl}</div></div></div>`;
    const wistiaId = wistiaIdFromInput(f.videoUrl);
    if (!wistiaId) return '';
    const padTop = VIDEO_ASPECT_PADDING[f.videoAspect] || VIDEO_ASPECT_PADDING['16:9'];
    return `<div class="pf-field"><div style="${sizeStyle}"><div class="pf-video-embed" style="padding-top:${padTop}"><iframe src="https://fast.wistia.net/embed/iframe/${wistiaId}" allow="autoplay; fullscreen" allowfullscreen></iframe></div></div></div>`;
  }
  if (f.type === 'calendar') {
    if (!f.eventTypeSlug) return '';
    // Fixed 650px forced an inner scrollbar on any screen where the real
    // card (rendered inside this iframe) needed more room -- clamp to the
    // viewport instead so it actually fits the device, desktop or mobile.
    return `<div class="pf-field"><div class="scheduling-inline-widget" data-url="${escapeHtml(bookingWidgetUrl(f))}" style="min-width:280px;height:clamp(560px, 78vh, 820px)"></div></div>`;
  }
  // "country" never asks the visitor anything -- its answer is filled in
  // silently (see detectCountryForStep below) from their IP, so a Logic
  // rule on it (equals/contains -> hide_next or redirect) works as a
  // country screen through the exact same mechanism as every other field.
  if (f.type === 'country') return '';
  const label = `<div class="pf-label">${escapeHtml(f.label)}${req}</div>${f.helpText ? `<div class="pf-help">${escapeHtml(f.helpText)}</div>` : ''}`;
  const val = answers[f.id];
  if (f.type === 'long_text') {
    return `<div class="pf-field">${label}<textarea class="pra-textarea" rows="4" data-field="${f.id}" placeholder="${escapeHtml(f.placeholder || '')}">${escapeHtml(val || '')}</textarea><div class="pf-error" id="err-${f.id}"></div></div>`;
  }
  if (f.type === 'dropdown') {
    return `<div class="pf-field">${label}<select class="pra-select" data-field="${f.id}">
      <option value="">Select…</option>
      ${f.options.map(o => `<option value="${escapeHtml(o.label)}" ${val === o.label ? 'selected' : ''}>${escapeHtml(o.label)}</option>`).join('')}
    </select><div class="pf-error" id="err-${f.id}"></div></div>`;
  }
  if (f.type === 'multiple_choice') {
    return `<div class="pf-field">${label}${f.options.map(o => `
      <label class="pf-choice-row"><input type="radio" name="f-${f.id}" data-field="${f.id}" value="${escapeHtml(o.label)}" ${val === o.label ? 'checked' : ''}/> ${escapeHtml(o.label)}</label>
    `).join('')}<div class="pf-error" id="err-${f.id}"></div></div>`;
  }
  if (f.type === 'checkboxes') {
    const arr = Array.isArray(val) ? val : [];
    return `<div class="pf-field">${label}${f.options.map(o => `
      <label class="pf-choice-row"><input type="checkbox" data-field="${f.id}" value="${escapeHtml(o.label)}" ${arr.includes(o.label) ? 'checked' : ''}/> ${escapeHtml(o.label)}</label>
    `).join('')}<div class="pf-error" id="err-${f.id}"></div></div>`;
  }
  const inputType = f.type === 'email' ? 'email' : f.type === 'phone' ? 'tel' : f.type === 'number' ? 'number' : f.type === 'date' ? 'date' : 'text';
  return `<div class="pf-field">${label}<input class="pra-input" type="${inputType}" data-field="${f.id}" placeholder="${escapeHtml(f.placeholder || '')}" value="${escapeHtml(val || '')}"/><div class="pf-error" id="err-${f.id}"></div></div>`;
}

// ── AI screening -- an ai_disqualify logic rule (built right in the SAME
// "If this answer ___ then ___" rule editor as every other condition, not
// a separate mechanism) gets its field's answer checked against the
// admin's own (server-side-only) criteria a moment after it settles; a
// FAIL matches the rule's condition the same way equals/contains would.
// Debounced per field so a still-typing text answer doesn't fire a Claude
// call on every keystroke. Fails OPEN (pass:true) on any network/server
// hiccup -- a real visitor should never get stuck over an outage.
let aiScreenResults = {}, aiScreenTimers = {};
function aiRuleFor(field) { return (field?.logic || []).find(r => r.op === 'ai_disqualify'); }
async function runAiScreen(fieldId) {
  const stepAtStart = stepIndex; // may navigate away during the round trip below
  const val = answers[fieldId];
  if (val === undefined || val === '' || (Array.isArray(val) && !val.length)) { delete aiScreenResults[fieldId]; updateNextVisibility(); return; }
  aiScreenResults[fieldId] = 'pending';
  updateNextVisibility();
  try {
    const r = await fetch(`/api/public/forms/${formId}/ai-screen`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fieldId, answer: val }) });
    const d = await r.json();
    aiScreenResults[fieldId] = r.ok ? !!d.pass : true;
  } catch {
    aiScreenResults[fieldId] = true;
  }
  if (stepIndex !== stepAtStart) return; // Back/Next already moved on while this was in flight
  updateNextVisibility();
  // Deliberately no auto-advance here, unlike a radio/select answer -- an
  // AI-screened field is always a typing box (short_text/long_text), and a
  // visitor who's still mid-thought when the PASS comes back shouldn't get
  // yanked to the next question out from under them. They click Next
  // themselves; the button just stops being disabled once this resolves.
}

// "country" never renders a visible input (see renderField above) -- its
// answer is filled in here, silently, from the real request IP, as soon
// as a step containing one renders. Same reasoning as the AI screen for
// re-running per step rather than once globally: Back/Next can revisit a
// step, and a fresh detect-country call is cheap (server-cached per IP).
async function detectCountryForStep(fields) {
  const countryField = fields.find(f => f.type === 'country');
  if (!countryField) return;
  try {
    const r = await fetch(`/api/public/forms/${formId}/detect-country`);
    const d = await r.json();
    if (r.ok) answers[countryField.id] = d.country || '';
  } catch { /* no location signal for this visit -- rules against it just won't match */ }
  updateNextVisibility();
}

function bindStepInputs() {
  const dataFieldEls = document.querySelectorAll('[data-field]');
  // A single multiple-choice question's options all share the SAME
  // data-field (the question's id, not one per option), so this correctly
  // collapses to 1 for the common Typeform-style one-question-per-step
  // layout even though there are multiple <input> elements.
  const singleQuestionStep = new Set(Array.from(dataFieldEls).map(el => el.dataset.field)).size === 1;
  dataFieldEls.forEach(el => {
    const id = el.dataset.field;
    const field = steps[stepIndex].find(f => f.id === id);
    const hasAiRule = !!aiRuleFor(field);
    const handler = () => {
      if (el.type === 'checkbox') {
        const checked = document.querySelectorAll(`[data-field="${id}"]:checked`);
        answers[id] = Array.from(checked).map(c => c.value);
      } else if (el.type === 'radio') {
        answers[id] = el.value;
      } else {
        answers[id] = el.value;
      }
      updateNextVisibility();
      // Clears a "This field is required." error the moment it's actually
      // fixed -- without this it just sat there stale (still reading
      // "required" even once answered) until the next click on Next
      // re-ran validateStep and finally cleared it.
      const errEl = document.getElementById('err-' + id);
      if (errEl && errEl.textContent) {
        const val = answers[id];
        const empty = field?.type === 'checkboxes' ? !Array.isArray(val) || !val.length : val === undefined || val === null || String(val).trim() === '';
        if (!empty) errEl.textContent = '';
      }
      if (hasAiRule) {
        clearTimeout(aiScreenTimers[id]);
        aiScreenTimers[id] = setTimeout(() => runAiScreen(id), 800);
      }
      // A single-choice answer (radio or dropdown) on a step with nothing
      // else to answer advances right away instead of making the visitor
      // find and click Next themselves -- checkboxes (multi-pick) and
      // text-ish inputs (still typing) never auto-advance. The short delay
      // is just so the selected state is visible for a moment first. Reuses
      // pfNext's own click handler (not a separate path), so every existing
      // check -- redirect rules, hide_next, validation, submit-on-last-step
      // -- still applies exactly as a manual click would.
      if (singleQuestionStep && (el.type === 'radio' || el.tagName === 'SELECT') && !hasAiRule) {
        autoAdvanceTimer = setTimeout(() => document.getElementById('pfNext')?.click(), 300);
      }
    };
    el.addEventListener('input', handler);
    el.addEventListener('change', handler);
  });
}

// ── Conditional logic — each field can carry rules evaluated against its
// OWN answer (Tally-style per-question logic). "hide_next" toggles whether
// the step's Next/Submit button is even clickable; "redirect" is checked at
// click-time and, when matched, navigates away instead of advancing.
// ai_disqualify can't be evaluated synchronously (it's a server round trip)
// -- it reads whatever runAiScreen last cached instead of the raw answer. ──
function evalCondition(rule, value, fieldId) {
  if (rule.op === 'ai_disqualify') return aiScreenResults[fieldId] === false;
  if (rule.op === 'is_answered') return Array.isArray(value) ? value.length > 0 : !!String(value || '').trim();
  if (rule.op === 'is_empty') return Array.isArray(value) ? value.length === 0 : !String(value || '').trim();
  const target = rule.value;
  if (rule.op === 'equals') return Array.isArray(value) ? value.includes(target) : String(value || '') === target;
  if (rule.op === 'not_equals') return Array.isArray(value) ? !value.includes(target) : String(value || '') !== target;
  if (rule.op === 'contains') return Array.isArray(value) ? value.includes(target) : String(value || '').includes(target);
  return false;
}
function matchingRule(fields, action) {
  for (const f of fields) {
    for (const rule of f.logic || []) {
      if (rule.action === action && evalCondition(rule, answers[f.id], f.id)) return rule;
    }
  }
  return null;
}
function updateNextVisibility() {
  const btn = document.getElementById('pfNext');
  if (!btn) return;
  const fields = steps[stepIndex];
  const hiddenByRule = !!matchingRule(fields, 'hide_next');
  const aiPending = fields.some(f => aiRuleFor(f) && aiScreenResults[f.id] === 'pending');
  btn.style.display = hiddenByRule ? 'none' : '';
  // Still silently disabled while an AI check is in flight (so a click
  // can't race ahead of the result), just without a visible "checking"
  // message -- the button simply isn't clickable for a moment.
  btn.disabled = aiPending;
  // A hide_next match is always a deliberate screening/gating rule the form
  // creator set on a specific answer -- an AI disqualification, or an
  // ordinary "Later" -> hide_next choice, same thing either way. It's never
  // an "unfinished form" state (an unanswered required field doesn't match
  // any rule, so it never sets hiddenByRule -- that's validateStep's job,
  // on click), so there's no path back to re-answer around it and no
  // "Complete this step to continue" message implying they just need to
  // finish something -- they answered, in full, and were screened out.
  const backBtn = document.getElementById('pfBack');
  if (backBtn) backBtn.style.display = hiddenByRule ? 'none' : '';
}

function validateStep(fields) {
  let ok = true;
  for (const f of fields) {
    if (f.type === 'statement' || !f.required) continue;
    const val = answers[f.id];
    const empty = f.type === 'checkboxes' ? !Array.isArray(val) || !val.length : val === undefined || val === null || String(val).trim() === '';
    const errEl = document.getElementById('err-' + f.id);
    if (empty) { if (errEl) errEl.textContent = 'This field is required.'; ok = false; }
    else if (errEl) errEl.textContent = '';
  }
  return ok;
}

// scheduling_backend.js's /widget.js only auto-scans for
// .scheduling-inline-widget divs once, on its own load -- fine for a
// static page, but this is a multi-step form where a later step's
// calendar div doesn't exist in the DOM yet the first time the script
// would run. Re-appending a fresh <script> tag each time a step with a
// calendar field renders makes it re-scan and pick up the new div; the
// data-scheduling-initialized guard on the widget side keeps it from
// double-embedding one that's already there (e.g. after Back then Next).
function loadCalendarWidgetsForStep(fields) {
  if (!fields.some(f => f.type === 'calendar' && f.eventTypeSlug)) return;
  const s = document.createElement('script');
  s.src = '/widget.js';
  s.async = true;
  document.body.appendChild(s);
}

// <script> tags inserted via .innerHTML never execute -- browsers ignore
// them for exactly that reason. Wistia's HTML embed code needs its script
// to actually run to initialize the player, so every one inside a raw
// embed gets swapped for a freshly-created (and therefore live) copy.
function activateRawEmbeds(root) {
  root.querySelectorAll('.pf-raw-embed script').forEach(old => {
    const s = document.createElement('script');
    for (const a of old.attributes) s.setAttribute(a.name, a.value);
    s.textContent = old.textContent;
    old.replaceWith(s);
  });
}

// ── Calendar step: the outer Next/Submit button drives the actual booking
// (book.html hides its own "Confirm Booking" button when embedded here --
// see bookingWidgetUrl's formEmbed param) via postMessage, since a form
// answer's already-collected data needs to reach the booking before it's
// made, and the whole point is one button instead of two. Only one
// calendar field is ever on-screen at a time (it's always its own step in
// practice), so a single pending resolver is enough -- no per-field id
// correlation needed. ──────────────────────────────────────────────────
let pendingBookResolve = null;
window.addEventListener('message', e => {
  if (e.origin !== location.origin || e.data?.type !== 'pf-booked' || !pendingBookResolve) return;
  const resolve = pendingBookResolve; pendingBookResolve = null;
  resolve(e.data);
});
function bookCalendarStep() {
  return new Promise(resolve => {
    const iframe = document.querySelector('.scheduling-inline-widget iframe');
    if (!iframe) { resolve({ success: false, error: 'Calendar failed to load — please refresh and try again.' }); return; }
    pendingBookResolve = resolve;
    iframe.contentWindow.postMessage({ type: 'pf-book-now' }, location.origin);
  });
}

function renderStep() {
  clearTimeout(autoAdvanceTimer);
  const fields = steps[stepIndex];
  const isLast = stepIndex === steps.length - 1;
  const card = document.getElementById('pfCard');
  card.innerHTML = `
    ${renderProgress()}
    ${fields.map(renderField).join('')}
    <div class="pf-error" id="pfBookError" style="display:none;margin-bottom:8px"></div>
    <div class="pf-nav">
      ${stepIndex > 0 ? `<button class="pra-btn pra-btn-ghost" id="pfBack">Back</button>` : ''}
      <button class="pra-btn" id="pfNext" style="flex:1">${isLast ? (form.settings.submitButtonText || 'Submit') : 'Next'}</button>
    </div>
  `;
  bindStepInputs();
  updateNextVisibility();
  activateRawEmbeds(card);
  loadCalendarWidgetsForStep(fields);
  detectCountryForStep(fields);
  if (stepIndex > 0) document.getElementById('pfBack').onclick = () => { stepIndex--; renderStep(); };
  document.getElementById('pfNext').onclick = async () => {
    const redirect = matchingRule(fields, 'redirect');
    if (redirect) { location.href = redirect.redirectUrl; return; }
    if (matchingRule(fields, 'hide_next')) return; // safety net -- button should already be hidden
    if (!validateStep(fields)) return;
    const calendarField = fields.find(f => f.type === 'calendar' && f.eventTypeSlug);
    if (calendarField) {
      const btn = document.getElementById('pfNext');
      const errEl = document.getElementById('pfBookError');
      btn.disabled = true; btn.textContent = 'Booking…';
      const result = await bookCalendarStep();
      btn.disabled = false; btn.textContent = isLast ? (form.settings.submitButtonText || 'Submit') : 'Next';
      if (!result.success) { errEl.textContent = result.error || 'Could not book that time — please try again.'; errEl.style.display = 'block'; return; }
      errEl.style.display = 'none';
    }
    if (!isLast) { stepIndex++; renderStep(); return; }
    await submit();
  };
}

async function submit() {
  const btn = document.getElementById('pfNext');
  btn.disabled = true; btn.textContent = 'Submitting…';
  try {
    const r = await fetch(`/api/public/forms/${formId}/submit`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ answers }),
    });
    const d = await r.json();
    if (!r.ok) { btn.disabled = false; btn.textContent = form.settings.submitButtonText || 'Submit'; alert(d.error || 'Something went wrong — please try again.'); return; }
    // This page is itself in an iframe on the CRM's own origin -- a cookie
    // set from this fetch's response would never be visible to
    // document.cookie on the parent Framer page (different origin). Hand
    // the contact id to the parent instead; track.js (running on the
    // Framer page) listens for this and sets the identity cookie itself.
    if (d.contactId) window.parent.postMessage({ type: 'pf-identify', contactId: d.contactId }, '*');
    if (d.redirectUrl) { location.href = d.redirectUrl; return; }
    document.getElementById('pfCard').innerHTML = `<div class="pf-confirm"><div class="big">${CHECK_ICON}</div><div>${escapeHtml(d.confirmationMessage || 'Thanks!')}</div></div>`;
  } catch {
    btn.disabled = false; btn.textContent = form.settings.submitButtonText || 'Submit';
    alert('Network error — please try again.');
  }
}

(async function init() {
  const r = await fetch(`/api/public/forms/${formId}`);
  if (!r.ok) { document.getElementById('pfCard').innerHTML = '<div class="pra-muted">This form isn\'t available.</div>'; return; }
  form = (await r.json()).form;
  document.title = form.name;
  applyTheme(form.theme);
  steps = buildSteps(form.fields);
  if (!steps.length) { document.getElementById('pfCard').innerHTML = '<div class="pra-muted">This form has no fields yet.</div>'; return; }
  renderStep();
})();
</script>
</body>
</html>

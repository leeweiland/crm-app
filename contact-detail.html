<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Contact — CRM</title>
<link rel="stylesheet" href="/crm-design-system.css"/>
<style>
  .detail-grid { display: flex; align-items: stretch; gap: 0; }
  .detail-col-left { width: var(--details-width, 360px); flex-shrink: 0; min-width: 260px; max-width: 640px; }
  .detail-resize-handle { width: 13px; margin: 0 -6px; flex-shrink: 0; cursor: col-resize; position: relative; z-index: 2; }
  .detail-resize-handle::after { content: ''; position: absolute; left: 6px; top: 0; bottom: 0; width: 2px; background: var(--pra-border); }
  .detail-resize-handle:hover::after, .detail-resize-handle.dragging::after { background: var(--pra-blue); }
  .detail-col-right { flex: 1; min-width: 0; }
  .tag-pill { display: inline-flex; align-items: center; gap: 6px; font-size: .74rem; padding: 4px 10px; border-radius: 14px; background: var(--pra-blue-dim); color: var(--pra-blue); margin: 0 6px 6px 0; }
  .tag-pill button { background: none; border: none; color: inherit; cursor: pointer; font-size: .8rem; padding: 0; }
  /* Mobile: stacked, Details on top then Conversation underneath (DOM
     order), full width, resize handle makes no sense on a single column. */
  @media (max-width: 900px) {
    .detail-grid { flex-direction: column; }
    .detail-col-left { width: 100% !important; max-width: none; }
    .detail-resize-handle { display: none; }
  }
  .track-badge { display: inline-flex; align-items: center; gap: 3px; font-size: .66rem; font-weight: 700; padding: 2px 8px; border-radius: 9px; background: rgba(255,255,255,0.05); color: var(--pra-dim); }
  .track-badge.on { background: rgba(57,255,20,0.16); color: #39ff14; box-shadow: 0 0 6px rgba(57,255,20,0.35); }
  .track-summary { display: flex; align-items: center; gap: 12px; padding: 8px 18px; border-bottom: 1px solid var(--pra-border); font-size: .74rem; color: var(--pra-dim); flex-shrink: 0; }
  .track-summary b { color: var(--pra-white); }
  .track-summary .on { color: #39ff14; }

  /* ── Conversation panel (ported from inbox.html's chat panel) ── */
  /* 195px, not 170px -- .mobile-sticky-header (wrapping the back-links +
     name/status row) adds ~28px of padding/margin the original 170px
     estimate predates. dvh wins over vh when supported (real visible
     viewport, not mobile's "largest possible" 100vh). */
  .convo-panel { display: flex; flex-direction: column; height: calc(100vh - 195px); height: calc(100dvh - 195px); min-height: 460px; }
  .convo-panel-title { padding: 16px 18px 0; }
  .chat-thread { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .bubble-row { display: flex; }
  .bubble-row.outbound { justify-content: flex-end; }
  .bubble-row.inbound { justify-content: flex-start; }
  .bubble-content { max-width: 82%; }
  .sms-bubble { max-width: 100%; padding: 9px 13px; border-radius: 14px; font-size: .87rem; font-weight: 400; line-height: 1.4; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bubble-row.outbound .sms-bubble { background: var(--pra-blue); color: #fff; border-bottom-right-radius: 3px; }
  .bubble-row.inbound .sms-bubble { background: var(--pra-panel-2); color: var(--pra-dim); border: 1px solid var(--pra-border); border-bottom-left-radius: 3px; }
  .bubble-time { font-size: .64rem; color: var(--pra-dim); margin-top: 3px; }
  .bubble-row.outbound .bubble-time { text-align: right; }

  .email-bubble { width: 100%; max-width: 96%; border: 1px solid var(--pra-border); border-radius: 10px; overflow: hidden; cursor: pointer; }
  .bubble-row.outbound .email-bubble { margin-left: auto; border-color: rgba(0,155,255,0.4); }
  .email-bubble-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--pra-panel-2); }
  .email-bubble-icon { flex-shrink: 0; }
  .email-bubble-subject { font-weight: 700; font-size: .85rem; color: var(--pra-dim); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .email-bubble-preview { font-size: .8rem; font-weight: 400; color: var(--pra-dim); padding: 8px 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .email-bubble.expanded .email-bubble-preview { display: none; }
  .email-bubble-body { display: none; background: #fff; }
  .email-bubble.expanded .email-bubble-body { display: block; }
  .email-bubble-body iframe { width: 100%; min-height: 260px; border: none; display: block; }
  .email-bubble-meta { display: flex; align-items: center; gap: 10px; padding: 6px 14px; font-size: .68rem; font-weight: 400; color: var(--pra-dim); border-top: 1px solid var(--pra-border); flex-wrap: wrap; }

  .note-bubble { border: 1px solid var(--pra-border); border-radius: 10px; overflow: hidden; }
  .note-bubble-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--pra-panel-2); font-weight: 700; font-size: .85rem; }
  .note-bubble-body { font-size: .8rem; color: var(--pra-dim); padding: 8px 14px; white-space: pre-wrap; overflow-wrap: anywhere; border-top: 1px solid var(--pra-border); }
  .note-bubble .bubble-time { padding: 0 14px 10px; }

  .compose-bar { border-top: 1px solid var(--pra-border); padding: 12px 16px; flex-shrink: 0; }
  .compose-channel-toggle { display: inline-flex; border: 1px solid var(--pra-border); border-radius: 8px; overflow: hidden; margin-bottom: 8px; }
  .compose-channel-toggle button { background: none; border: none; color: var(--pra-dim); font-size: .76rem; font-weight: 700; padding: 5px 12px; cursor: pointer; }
  .compose-channel-toggle button.active { background: var(--pra-blue-dim); color: var(--pra-blue); }
  .compose-row { display: flex; gap: 8px; align-items: flex-end; }
  .compose-row textarea { flex: 1; resize: none; min-height: 40px; max-height: 140px; }
  .compose-hint { font-size: .74rem; color: var(--pra-red); margin-top: 4px; }
  .contact-header { display: flex; align-items: center; gap: 12px; margin: 10px 0 20px; }
  .sub-section-label { font-family: var(--font-secondary); font-size: .66rem; text-transform: uppercase; letter-spacing: .06em; color: var(--pra-dim); margin: 16px 0 8px; }
</style>
</head>
<body>
<div class="pra-root">
  <div class="app-shell">
    <div class="app-sidebar" id="appSidebar"></div>
    <div class="app-main">
      <div class="mobile-sticky-header">
        <a class="pra-link" href="/contacts.html">&larr; Back to Contacts</a>
        <a class="pra-link" id="backToChatLink" style="margin-left:16px">&larr; Back to Chat</a>
        <div class="contact-header">
          <div>
            <div style="display:flex;align-items:center;gap:10px">
              <span id="contactTypeBadge"></span>
              <div class="pra-h1" id="contactName">Loading…</div>
              <span id="contactOwnerField"></span>
            </div>
            <div style="display:flex;align-items:center;gap:8px;margin-top:8px">
              <select class="status-pill-select" id="fStatus"></select>
              <span id="optOutBadges" style="display:flex;gap:6px"></span>
            </div>
          </div>
        </div>
      </div>

      <div class="detail-grid" id="detailGrid">
        <div class="detail-col-left" id="detailColLeft">
          <div class="pra-panel" style="padding:22px;margin-bottom:16px">
            <div class="pra-h2" style="margin-bottom:14px;display:flex;align-items:center;gap:8px">Details <span id="detailsTypeBadge"></span></div>
            <div class="field-row">
              <div class="field"><label class="pra-label">First name</label><input class="pra-input" id="fFirst"/></div>
              <div class="field"><label class="pra-label">Last name</label><input class="pra-input" id="fLast"/></div>
            </div>
            <div class="field"><label class="pra-label">Account / Company</label><input class="pra-input" id="fAccount"/></div>
            <div class="field-row">
              <div class="field"><label class="pra-label">Email</label><input class="pra-input" type="email" id="fEmail"/></div>
              <div class="field"><label class="pra-label">Phone</label>
                <div style="display:flex;gap:6px;align-items:center">
                  <input class="pra-input" id="fPhone"/>
                  <a class="pra-tel-link" id="fPhoneDial" title="Call" style="display:none;flex-shrink:0"><svg viewBox="0 0 24 24" fill="none"><path d="M6.5 3.5h3l1.5 4-2 1.5a11 11 0 0 0 5.5 5.5l1.5-2 4 1.5v3a1.5 1.5 0 0 1-1.6 1.5C11.5 18.2 5.8 12.5 5 5.1A1.5 1.5 0 0 1 6.5 3.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></a>
                </div>
              </div>
            </div>

            <div class="sub-section-label" style="display:flex;align-items:center;gap:8px">Tags <span id="tagsToggleSlot"></span></div>
            <div id="tagsWrap"></div>
            <select class="pra-select" id="addTagSelect" style="margin-top:8px"><option value="">+ Add a tag...</option></select>

            <div class="sub-section-label" style="display:flex;align-items:center;gap:8px">Hyros Tags <span id="hyrosTagsToggleSlot"></span></div>
            <div id="hyrosTagsWrap"></div>

            <div class="sub-section-label" style="display:flex;align-items:center;gap:8px">Hyros URLs <span id="hyrosUrlsToggleSlot"></span></div>
            <div id="hyrosUrlsWrap"></div>

            <div class="sub-section-label" style="display:flex;align-items:center;gap:8px">Lists <span id="listsToggleSlot"></span></div>
            <div id="listsWrap"></div>
            <select class="pra-select" id="addListSelect" style="margin-top:8px"><option value="">+ Add to a list...</option></select>

            <div class="field-row" style="margin:16px 0 0">
              <label class="pra-label" style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="fEmailOptOut"/> Email opt-out</label>
              <label class="pra-label" style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="fSmsOptOut"/> SMS opt-out</label>
            </div>
            <div class="field-row" style="margin:8px 0 0">
              <label class="pra-label" style="display:flex;align-items:center;gap:6px;cursor:pointer" title="Excludes this contact's sends from the Reporting dashboards (Email/SMS/Automations/Sequences) -- still sends, still logs, just doesn't count toward those numbers"><input type="checkbox" id="fTestContact"/> Test contact (exclude from Reporting)</label>
            </div>
            <div id="customFieldsWrap"></div>
            <button class="pra-btn pra-btn-danger" id="deleteBtn" style="margin-top:16px">Delete Contact</button>
          </div>
        </div>

        <div class="detail-resize-handle" id="detailResizeHandle"></div>

        <div class="detail-col-right">
          <div class="pra-panel convo-panel" style="padding:0">
            <div class="convo-panel-title"><div class="pra-h2">Conversation</div></div>
            <div id="convoPanelBody" style="flex:1;display:flex;flex-direction:column;min-height:0"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="/crm-nav.js"></script>
<script>
const contactId = new URLSearchParams(location.search).get('id');
document.getElementById('backToChatLink').href = '/inbox.html?tab=primary&contact=' + encodeURIComponent(contactId || '');
let contact = null, allTags = [], allLists = [], allStatuses = [], allFields = [];

function escapeHtml(s) { const d = document.createElement('div'); d.textContent = String(s ?? ''); return d.innerHTML; }

// Same map as inbox.html's STATUS_GLOW -- lead-stage-at-a-glance, kept in
// sync manually since these are separate static pages with no shared JS.
const STATUS_GLOW = {
  'FINISHED': '#9a9aa5',
  'POTENTIAL': '#ffffff',
  'FOLLOW UP (They have a Task / Date set)': '#f4ff00',
  'APPLICATION': '#14892b',
  'BOOKED': '#1fbf42',
  'WE CANCELLED': '#7a7a86',
  "RSVP'ed": '#2cdf2b',
  'ENROLLED': '#39ff14',
  'STOP': '#4a4a52',
  'BLACKLIST': '#4a4a52',
};
function hexToRgba(hex, alpha) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${alpha})`;
}
// A native <select>'s intrinsic width sizes to its WIDEST <option> (e.g.
// "FOLLOW UP (They have a Task / Date set)"), not the one actually
// selected -- setting width:auto in CSS doesn't fix that, it just inherits
// this same behavior. Sized explicitly here instead, in `ch` units against
// the currently selected option's own text length, so a short status like
// "ENROLLED" renders as a small pill instead of stretching to fit the
// longest status in the whole list.
function statusSelectWidthCh(status) { return (status || '').length + 8 + 'ch'; }
function applyStatusGlow(status) {
  const sel = document.getElementById('fStatus');
  const glow = STATUS_GLOW[status];
  const widthRule = `width:${statusSelectWidthCh(status)};`;
  if (!glow) { sel.setAttribute('style', widthRule); return; }
  sel.setAttribute('style', `${widthRule}--status-glow:${glow};--status-glow-soft:${glow}88;background:${hexToRgba(glow, 0.15)};color:${glow}`);
}

async function loadRefs() {
  const [tagsRes, listsRes, statusesRes, fieldsRes] = await Promise.all([
    fetch('/api/tags'), fetch('/api/lists'), fetch('/api/statuses'), fetch('/api/custom-fields?entityType=contact')
  ]);
  allTags = (await tagsRes.json()).tags;
  allLists = (await listsRes.json()).lists;
  allStatuses = (await statusesRes.json()).statuses;
  allFields = (await fieldsRes.json()).fields;
}

// Shared collapse pattern for every pill list on this page (Tags, Hyros
// Tags, Hyros URLs, Lists) -- a contact pulled from Hyros/AC can carry 50+
// tags, and dumping them all flat makes the panel unreadable. The "+N
// more" toggle renders separately from the pills themselves so it can sit
// next to the section LABEL instead of trailing after the pills.
const PILLS_COLLAPSE_LIMIT = 2;
function pillsBodyHtml(pills, expanded, emptyText) {
  if (!pills.length) return `<span class="pra-muted" style="font-size:.82rem">${emptyText}</span>`;
  return (expanded ? pills : pills.slice(0, PILLS_COLLAPSE_LIMIT)).join('');
}
function toggleSlotHtml(count, expanded, toggleId) {
  if (count <= PILLS_COLLAPSE_LIMIT) return '';
  return `<button type="button" class="pra-link" id="${toggleId}" style="font-size:.78rem">${expanded ? 'Show less' : `+${count - PILLS_COLLAPSE_LIMIT} more`}</button>`;
}

let tagsExpanded = false;
function renderTags() {
  const pills = (contact.tags || []).map(tagId => {
    const t = allTags.find(x => x.id === tagId);
    if (!t) return '';
    return `<span class="tag-pill">${escapeHtml(t.name)}<button data-tag="${tagId}" class="removeTag">&times;</button></span>`;
  }).filter(Boolean);
  document.getElementById('tagsWrap').innerHTML = pillsBodyHtml(pills, tagsExpanded, 'No tags yet.');
  document.getElementById('tagsToggleSlot').innerHTML = toggleSlotHtml(pills.length, tagsExpanded, 'tagsToggle');
  document.querySelectorAll('#tagsWrap .removeTag').forEach(btn => btn.onclick = async () => {
    contact.tags = contact.tags.filter(id => id !== btn.dataset.tag);
    await saveContact();
    renderTags();
  });
  const toggle = document.getElementById('tagsToggle');
  if (toggle) toggle.onclick = () => { tagsExpanded = !tagsExpanded; renderTags(); };
  const sel = document.getElementById('addTagSelect');
  sel.innerHTML = '<option value="">+ Add a tag...</option>' + allTags.filter(t => !contact.tags.includes(t.id)).map(t => `<option value="${t.id}">${escapeHtml(t.name)}</option>`).join('');
  renderHyrosTags();
}
document.getElementById('addTagSelect').onchange = async (e) => {
  if (!e.target.value) return;
  contact.tags.push(e.target.value);
  await saveContact();
  renderTags();
  e.target.value = '';
};

let listsExpanded = false;
function renderLists() {
  const pills = (contact.listIds || []).map(listId => {
    const l = allLists.find(x => x.id === listId);
    if (!l) return '';
    return `<span class="tag-pill">${escapeHtml(l.name)}<button data-list="${listId}" class="removeList">&times;</button></span>`;
  }).filter(Boolean);
  document.getElementById('listsWrap').innerHTML = pillsBodyHtml(pills, listsExpanded, 'Not on any lists.');
  document.getElementById('listsToggleSlot').innerHTML = toggleSlotHtml(pills.length, listsExpanded, 'listsToggle');
  document.querySelectorAll('#listsWrap .removeList').forEach(btn => btn.onclick = async () => {
    contact.listIds = contact.listIds.filter(id => id !== btn.dataset.list);
    await saveContact();
    renderLists();
  });
  const toggle = document.getElementById('listsToggle');
  if (toggle) toggle.onclick = () => { listsExpanded = !listsExpanded; renderLists(); };
  const sel = document.getElementById('addListSelect');
  sel.innerHTML = '<option value="">+ Add to a list...</option>' + allLists.filter(l => !contact.listIds.includes(l.id)).map(l => `<option value="${l.id}">${escapeHtml(l.name)}</option>`).join('');
}
document.getElementById('addListSelect').onchange = async (e) => {
  if (!e.target.value) return;
  contact.listIds.push(e.target.value);
  await saveContact();
  renderLists();
  e.target.value = '';
};

function renderTypeBadge() {
  const pt = contact.programType;
  const html = pt ? `<span class="pra-badge pra-badge-${pt}">${escapeHtml(pt)}</span>` : '';
  document.getElementById('contactTypeBadge').innerHTML = html;
  document.getElementById('detailsTypeBadge').innerHTML = html;
}
function renderOptOutBadges() {
  const emailOptOut = document.getElementById('fEmailOptOut').checked;
  const smsOptOut = document.getElementById('fSmsOptOut').checked;
  const badge = (label) => `<span class="pra-badge" style="background:#3a1414;color:#ff6b6b;border:1px solid #ff6b6b55">${label}</span>`;
  document.getElementById('optOutBadges').innerHTML =
    (emailOptOut ? badge('EMAIL OPT-OUT') : '') + (smsOptOut ? badge('SMS OPT-OUT') : '');
}
function renderPhoneDialLink() {
  const link = document.getElementById('fPhoneDial');
  const digits = (contact.phone || '').replace(/[^\d+]/g, '');
  if (digits) { link.href = 'tel:' + digits; link.style.display = ''; }
  else { link.removeAttribute('href'); link.style.display = 'none'; }
}
// Hyros tag names all follow one of "@" (ad/email/keyword touch), "$"
// (purchase), or "!" (Hyros's own internal bookkeeping) -- everything else
// on a contact's flat tags array came from AC (or was added manually in
// this CRM). There's no per-tag source field in the data model to split on
// directly (see getOrCreateTag -- matches by name only, source-agnostic),
// so this is a naming-convention split, not a stored fact.
function isHyrosTagName(name) { return /^[@$!]/.test(name); }

let hyrosTagsExpanded = false;
function renderHyrosTags() {
  const tagNames = (contact.tags || []).map(id => allTags.find(t => t.id === id)?.name).filter(Boolean);
  const pills = tagNames.filter(isHyrosTagName).map(name => `<span class="tag-pill" style="cursor:default">${escapeHtml(name)}</span>`);
  document.getElementById('hyrosTagsWrap').innerHTML = pillsBodyHtml(pills, hyrosTagsExpanded, 'None.');
  document.getElementById('hyrosTagsToggleSlot').innerHTML = toggleSlotHtml(pills.length, hyrosTagsExpanded, 'hyrosTagsToggle');
  const toggle = document.getElementById('hyrosTagsToggle');
  if (toggle) toggle.onclick = () => { hyrosTagsExpanded = !hyrosTagsExpanded; renderHyrosTags(); };
}

// "First ad click"/"Last ad click" come from hyros_backend.js's
// mergeHyrosActivity() -- same thread items already loaded for the
// Conversation panel, filtered to the "activity" channel here rather than
// re-fetched. Tracked/Previous URL are CSV-only (Hyros's API doesn't
// expose them) so they're rendered when present but not expected on every
// contact. Origin Identity is Hyros's own pre-conversion-to-lead identity
// link (hyrosOriginLead), shown as its own row since it can carry a
// DIFFERENT email/phone than the contact's own -- exactly the
// split-identity case this section exists to surface.
let hyrosUrlsExpanded = false;
// Small blue pill, same size/theme as a tag -- the detail (date, source,
// full URL) lives in the title tooltip rather than a second line of large
// text, matching how Hyros Tags/Tags render right above it.
function hyrosUrlPill(label, detail, href) {
  const inner = href ? `<a href="${escapeHtml(href)}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">${escapeHtml(label)}</a>` : escapeHtml(label);
  return `<span class="tag-pill" style="cursor:default" title="${escapeHtml(detail || '')}">${inner}</span>`;
}
function renderHyrosUrls() {
  const rows = [];
  if (contact.hyrosTrackedUrl) rows.push(hyrosUrlPill('Tracked URL', contact.hyrosTrackedUrl, contact.hyrosTrackedUrl));
  if (contact.hyrosPreviousUrl) rows.push(hyrosUrlPill('Previous URL', contact.hyrosPreviousUrl, contact.hyrosPreviousUrl));
  const firstClick = threadItems.find(i => i.itemType === 'activity' && (i.subject || '').startsWith('First ad click'));
  const lastClick = threadItems.find(i => i.itemType === 'activity' && (i.subject || '').startsWith('Last ad click'));
  if (firstClick) rows.push(hyrosUrlPill(firstClick.subject, `${firstClick.body || ''} · ${fmtDate(firstClick.at)}`));
  if (lastClick) rows.push(hyrosUrlPill(lastClick.subject, `${lastClick.body || ''} · ${fmtDate(lastClick.at)}`));
  if (contact.hyrosOriginLead) {
    const o = contact.hyrosOriginLead;
    rows.push(hyrosUrlPill('Origin Identity', `${[o.firstName, o.lastName].filter(Boolean).join(' ')} ${o.email || ''} ${(o.phoneNumbers || []).join(', ')}`));
  }
  document.getElementById('hyrosUrlsWrap').innerHTML = pillsBodyHtml(rows, hyrosUrlsExpanded, 'Not captured for this contact.');
  document.getElementById('hyrosUrlsToggleSlot').innerHTML = toggleSlotHtml(rows.length, hyrosUrlsExpanded, 'hyrosUrlsToggle');
  const toggle = document.getElementById('hyrosUrlsToggle');
  if (toggle) toggle.onclick = () => { hyrosUrlsExpanded = !hyrosUrlsExpanded; renderHyrosUrls(); };
}
function renderCustomFields() {
  const wrap = document.getElementById('customFieldsWrap');
  if (!allFields.length) { wrap.innerHTML = ''; return; }
  wrap.innerHTML = allFields.map(f => `
    <div class="field"><label class="pra-label">${escapeHtml(f.label)}</label>
      <input class="pra-input custom-field-input" data-field="${f.id}" value="${escapeHtml(contact.customFields?.[f.id] || '')}"/>
    </div>
  `).join('');
  wrap.querySelectorAll('.custom-field-input').forEach(inp => inp.addEventListener('change', autoSaveDetails));
}

async function saveContact() {
  const r = await fetch('/api/contacts/' + contactId, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(contact) });
  if (!r.ok) { showToast('Could not save', true); return; }
  contact = (await r.json()).contact;
}

// No Save button -- every field change PATCHes immediately (same pattern
// tags/lists already used), fired on 'change' so text inputs save on blur
// or Enter rather than on every keystroke.
async function autoSaveDetails() {
  contact.first = document.getElementById('fFirst').value.trim();
  contact.last = document.getElementById('fLast').value.trim();
  contact.accountName = document.getElementById('fAccount').value.trim();
  contact.email = document.getElementById('fEmail').value.trim();
  contact.phone = document.getElementById('fPhone').value.trim();
  contact.status = document.getElementById('fStatus').value;
  contact.emailOptOut = document.getElementById('fEmailOptOut').checked;
  contact.smsOptOut = document.getElementById('fSmsOptOut').checked;
  contact.testContact = document.getElementById('fTestContact').checked;
  contact.customFields = contact.customFields || {};
  document.querySelectorAll('.custom-field-input').forEach(inp => { contact.customFields[inp.dataset.field] = inp.value; });
  await saveContact();
  document.getElementById('contactName').textContent = contact.first + ' ' + contact.last;
  renderPhoneDialLink();
  renderConvoPanel();
  showToast('Saved');
}
['fFirst', 'fLast', 'fAccount', 'fEmail', 'fPhone', 'fEmailOptOut', 'fSmsOptOut', 'fTestContact'].forEach(id => document.getElementById(id).addEventListener('change', autoSaveDetails));

document.getElementById('deleteBtn').onclick = async () => {
  if (!confirm('Delete this contact? This cannot be undone.')) return;
  const r = await fetch('/api/contacts/' + contactId, { method: 'DELETE' });
  if (!r.ok) { showToast('Could not delete', true); return; }
  location.href = '/contacts.html';
};

(async function init() {
  if (!contactId) { document.getElementById('contactName').textContent = 'No contact selected.'; return; }
  // ownerFieldHtml/wireOwnerFields (crm-nav.js) read window.crmMe/
  // crmTeamUsers -- those are only guaranteed populated after this resolves.
  await window.crmNavReady;
  await loadRefs();
  const statusSel = document.getElementById('fStatus');
  statusSel.innerHTML = '<option value=""></option>' + allStatuses.map(s => `<option value="${escapeHtml(s.label)}">${escapeHtml(s.label)}</option>`).join('');

  const r = await fetch('/api/contacts/' + contactId);
  if (!r.ok) { document.getElementById('contactName').textContent = 'Contact not found.'; return; }
  contact = (await r.json()).contact;
  document.getElementById('contactName').textContent = contact.first + ' ' + contact.last;
  const ownerFieldEl = document.getElementById('contactOwnerField');
  ownerFieldEl.innerHTML = ownerFieldHtml(contact);
  wireOwnerFields(ownerFieldEl, (_, ownerId) => { contact.ownerId = ownerId; });
  document.getElementById('fFirst').value = contact.first || '';
  document.getElementById('fLast').value = contact.last || '';
  document.getElementById('fAccount').value = contact.accountName || '';
  document.getElementById('fEmail').value = contact.email || '';
  document.getElementById('fPhone').value = contact.phone || '';
  statusSel.value = contact.status || '';
  applyStatusGlow(contact.status);
  statusSel.addEventListener('change', () => { applyStatusGlow(statusSel.value); autoSaveDetails(); });
  document.getElementById('fEmailOptOut').checked = !!contact.emailOptOut;
  document.getElementById('fSmsOptOut').checked = !!contact.smsOptOut;
  document.getElementById('fTestContact').checked = !!contact.testContact;
  renderOptOutBadges();
  document.getElementById('fEmailOptOut').addEventListener('change', renderOptOutBadges);
  document.getElementById('fSmsOptOut').addEventListener('change', renderOptOutBadges);
  renderTypeBadge();
  renderPhoneDialLink();
  renderCustomFields();
  renderTags();
  renderLists();
  loadThread();
})();

// ── Conversation panel -- same bubble rendering + compose bar as
// inbox.html's chat panel, ported here scoped to this one known contact
// (no conversation sidebar/selection needed, contactId is already fixed).
function fmtDate(iso) { return iso ? new Date(iso).toLocaleString() : ''; }
let threadItems = [], composeChannel = 'email';

function emailBubbleHtml(item, idx) {
  const opened = (item.statusHistory || []).find(h => h.status === 'opened');
  const clicked = (item.statusHistory || []).find(h => h.status === 'clicked');
  return `
    <div class="bubble-row ${item.direction}">
      <div class="email-bubble" data-email-toggle="${idx}">
        <div class="email-bubble-head"><span class="email-bubble-icon">📧</span><span class="email-bubble-subject">${escapeHtml(item.subject || '(no subject)')}</span></div>
        <div class="email-bubble-preview">${escapeHtml((item.bodyPreview || '').replace(/<[^>]+>/g, ' ')).trim()}</div>
        <div class="email-bubble-body"><iframe data-src="${idx}"></iframe></div>
        <div class="email-bubble-meta">
          <span>${fmtDate(item.at)}</span>
          <span>${item.status || ''}</span>
          ${item.direction === 'outbound' ? `<span class="track-badge${opened ? ' on' : ''}">${opened ? 'Opened' : 'Not opened'}</span><span class="track-badge${clicked ? ' on' : ''}">${clicked ? 'Clicked' : 'Not clicked'}</span>` : ''}
        </div>
      </div>
    </div>
  `;
}
function smsBubbleHtml(item) {
  return `
    <div class="bubble-row ${item.direction}">
      <div class="bubble-content">
        <div class="sms-bubble">${escapeHtml(item.body || item.bodyPreview || '')}</div>
        <div class="bubble-time">${fmtDate(item.at)}</div>
      </div>
    </div>
  `;
}
function noteBubbleHtml(item) {
  const icon = item.channel === 'booking' ? '📅' : item.channel === 'meeting' ? '📆' : item.channel === 'activity' ? '📈' : '📝';
  return `
    <div class="bubble-row ${item.direction}">
      <div class="bubble-content note-bubble">
        <div class="note-bubble-head"><span>${icon}</span><span class="note-bubble-subject">${escapeHtml(item.subject || '')}</span></div>
        ${item.body ? `<div class="note-bubble-body">${escapeHtml(item.body)}</div>` : ''}
        <div class="bubble-time">${fmtDate(item.at)}</div>
      </div>
    </div>
  `;
}
function emailStatsHtml(items) {
  const sent = items.filter(i => i.itemType === 'email' && i.direction === 'outbound');
  if (!sent.length) return '';
  const opened = sent.filter(i => (i.statusHistory || []).some(h => h.status === 'opened')).length;
  const clicked = sent.filter(i => (i.statusHistory || []).some(h => h.status === 'clicked')).length;
  const pct = (n) => Math.round((n / sent.length) * 100);
  return `
    <div class="track-summary">
      <span><b>${sent.length}</b> email${sent.length === 1 ? '' : 's'} sent</span>
      <span class="${opened ? 'on' : ''}"><b>${opened}</b> opened (${pct(opened)}%)</span>
      <span class="${clicked ? 'on' : ''}"><b>${clicked}</b> clicked (${pct(clicked)}%)</span>
    </div>
  `;
}
function renderConvoPanel() {
  const wrap = document.getElementById('convoPanelBody');
  const emailOk = contact.email, smsOk = contact.phone;
  const emailItems = threadItems.filter(i => i.itemType === 'email');
  wrap.innerHTML = `
    ${emailStatsHtml(emailItems)}
    <div class="chat-thread" id="chatThread"></div>
    <div class="compose-bar">
      <div class="compose-channel-toggle">
        <button type="button" data-ch="email" class="${composeChannel === 'email' ? 'active' : ''}">Send Email</button>
        <button type="button" data-ch="sms" class="${composeChannel === 'sms' ? 'active' : ''}">Send SMS</button>
      </div>
      ${composeChannel === 'email' ? `<input class="pra-input" id="composeSubject" placeholder="Subject" style="margin-bottom:8px"/>` : ''}
      <div class="compose-row">
        <textarea class="pra-textarea" id="composeBody" placeholder="${composeChannel === 'email' ? 'Write an email…' : 'Write a text message…'}"></textarea>
        <button class="pra-btn" id="composeSendBtn">Send</button>
      </div>
      ${composeChannel === 'email' && !emailOk ? '<div class="compose-hint">This contact has no email on file.</div>' : ''}
      ${composeChannel === 'sms' && !smsOk ? '<div class="compose-hint">This contact has no phone number on file.</div>' : ''}
    </div>
  `;
  const items = [...threadItems].filter(i => ['email', 'sms', 'form', 'booking', 'activity', 'meeting'].includes(i.itemType)).sort((a, b) => new Date(a.at) - new Date(b.at));
  const threadEl = document.getElementById('chatThread');
  threadEl.innerHTML = items.length ? items.map((item, idx) => item.itemType === 'email' ? emailBubbleHtml(item, idx) : item.itemType === 'sms' ? smsBubbleHtml(item) : noteBubbleHtml(item)).join('') : '<div class="pra-muted" style="text-align:center;padding:30px">No messages yet.</div>';
  threadEl.querySelectorAll('[data-email-toggle]').forEach(el => el.onclick = () => {
    const wasExpanded = el.classList.contains('expanded');
    el.classList.toggle('expanded');
    if (!wasExpanded) {
      const iframe = el.querySelector('iframe');
      const item = items[Number(el.dataset.emailToggle)];
      if (iframe && !iframe.srcdoc) iframe.srcdoc = `<style>body,*{font-family:Arial,Helvetica,sans-serif!important;}</style>${item.body || '<p style="color:#888">(no content stored)</p>'}`;
    }
  });
  threadEl.scrollTop = threadEl.scrollHeight;

  wrap.querySelectorAll('.compose-channel-toggle button').forEach(btn => btn.onclick = () => { composeChannel = btn.dataset.ch; renderConvoPanel(); });
  document.getElementById('composeSendBtn').onclick = sendComposeMessage;

  const unread = items.filter(i => i.direction === 'inbound' && !i.done);
  if (unread.length) fetch('/api/inbox/mark-done', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ids: unread.map(i => i.id), done: true }) });
}
async function loadThread() {
  const r = await fetch('/api/inbox/contact/' + contactId);
  threadItems = r.ok ? (await r.json()).items : [];
  renderConvoPanel();
  renderHyrosUrls();
}
// ── Details column: drag-to-resize, width remembered across visits ──────
(function initDetailResize() {
  const left = document.getElementById('detailColLeft');
  const handle = document.getElementById('detailResizeHandle');
  const saved = Number(localStorage.getItem('contactDetailWidth'));
  if (saved) left.style.width = saved + 'px';
  let dragging = false, startX = 0, startWidth = 0;
  handle.addEventListener('mousedown', (e) => {
    dragging = true; startX = e.clientX; startWidth = left.getBoundingClientRect().width;
    handle.classList.add('dragging');
    document.body.style.userSelect = 'none';
  });
  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const w = Math.min(640, Math.max(260, startWidth + (e.clientX - startX)));
    left.style.width = w + 'px';
  });
  window.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    handle.classList.remove('dragging');
    document.body.style.userSelect = '';
    localStorage.setItem('contactDetailWidth', parseInt(left.style.width, 10));
  });
})();

async function sendComposeMessage() {
  const body = document.getElementById('composeBody').value.trim();
  if (!body) return;
  const subject = composeChannel === 'email' ? document.getElementById('composeSubject').value.trim() : undefined;
  const btn = document.getElementById('composeSendBtn');
  btn.disabled = true; btn.textContent = 'Sending…';
  const r = await fetch('/api/inbox/send', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ contactId, channel: composeChannel, subject, body }),
  });
  const d = await r.json();
  btn.disabled = false; btn.textContent = 'Send';
  if (!r.ok) { showToast(d.error || 'Send failed', true); return; }
  showToast('Sent');
  await loadThread();
}
</script>

<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; width: 300px; background: #121722; color: #e8ecf3; font: 13px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; }
  .w { padding: 14px; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  .st { padding: 8px 10px; border-radius: 6px; background: #1a2131; margin-bottom: 10px; }
  .ok { color: #4ade80; } .bad { color: #fca5a5; }
  a { color: #7aa7ff; }
  label { display: block; color: #9aa3b8; font-size: 11px; margin-bottom: 4px; }
  input { width: 100%; box-sizing: border-box; background: #0d111a; color: #e8ecf3; border: 1px solid #2b3345; border-radius: 6px; padding: 6px 8px; font: inherit; }
  p { color: #9aa3b8; font-size: 12px; margin: 10px 0 0; }
</style></head>
<body><div class="w">
  <h1>PRA Ads Columns</h1>
  <div class="st" id="st">Checking the CRM…</div>
  <label for="url">CRM address</label>
  <input id="url" spellcheck="false">
  <p>Open Meta Ads Manager and widen the Name column; the CRM columns appear on its right. The gear in their header picks and orders columns.</p>
</div><script src="popup.js"></script></body></html>

<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; width: 300px; background: #101014; color: #fff; font: 700 13px/1.4 "Century Gothic", "Poppins", sans-serif; }
  .w { padding: 14px; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  .st { padding: 8px 10px; border-radius: 6px; background: #16161c; margin-bottom: 10px; }
  .ok { color: #39ff14; } .bad { color: #ff3b3b; }
  a { color: #009bff; }
  label { display: block; color: #9a9aa5; font-size: 11px; margin-bottom: 4px; }
  input { width: 100%; box-sizing: border-box; background: #0a0a0d; color: #e8ecf3; border: 1px solid #26262e; border-radius: 6px; padding: 6px 8px; font: inherit; }
  p { color: #9a9aa5; font-size: 12px; margin: 10px 0 0; }
</style></head>
<body><div class="w">
  <h1>PRA Ads Columns</h1>
  <div class="st" id="st">Checking the CRM…</div>
  <label for="url">CRM address</label>
  <input id="url" spellcheck="false">
  <p>Open Meta Ads Manager and widen the Name column; the CRM columns appear on its right. The gear in their header picks and orders columns.</p>
</div><script src="popup.js"></script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Workflows — CRM</title>
<link rel="stylesheet" href="/crm-design-system.css"/>
<style>
  .toolbar { display: flex; align-items: center; margin-bottom: 18px; }
  .active-toggle { width: 38px; height: 20px; border-radius: 12px; background: var(--pra-border); position: relative; cursor: pointer; display: inline-block; border: none; }
  .active-toggle.on { background: var(--pra-blue); }
  .active-toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .active-toggle.on::after { transform: translateX(18px); }
  th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
  th.sortable:hover { color: var(--pra-white); }
  th.sortable .sort-arrow { font-size: .7rem; margin-left: 3px; opacity: .5; }
  th.sortable.sorted .sort-arrow { opacity: 1; }
</style>
</head>
<body>
<div class="pra-root">
  <div class="app-shell">
    <div class="app-sidebar" id="appSidebar"></div>
    <div class="app-main">
      <div class="toolbar">
        <div class="pra-h1" style="flex:1">Workflows</div>
        <button class="pra-btn" id="newWorkflowBtn">+ New Workflow</button>
      </div>
      <div class="pra-panel" style="overflow-x:auto">
        <table class="data-table">
          <thead><tr>
            <th class="sortable" data-sort="name">Name</th>
            <th class="sortable" data-sort="steps">Steps</th>
            <th class="sortable" data-sort="active">Active</th>
            <th class="sortable" data-sort="activeEnrolled">Active Enrolled</th>
            <th class="sortable" data-sort="goalMet">Goal Met</th>
            <th class="sortable" data-sort="updatedAt">Last Edited</th>
            <th></th>
          </tr></thead>
          <tbody id="workflowsBody"><tr><td colspan="7" class="pra-muted">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<script src="/crm-nav.js"></script>
<script>
function escapeHtml(s) { const d = document.createElement('div'); d.textContent = String(s ?? ''); return d.innerHTML; }
function fmtDate(iso) { return iso ? new Date(iso).toLocaleString() : ''; }

let allWorkflows = [];
let workflowSort = { field: 'updatedAt', dir: -1 };
function renderWorkflowsTable() {
  const { field, dir } = workflowSort;
  const rows = [...allWorkflows].sort((a, b) => {
    let av, bv;
    if (field === 'steps') { av = a.steps.length; bv = b.steps.length; }
    else if (field === 'active') { av = a.active ? 1 : 0; bv = b.active ? 1 : 0; }
    else if (field === 'activeEnrolled') { av = a.stats.active; bv = b.stats.active; }
    else if (field === 'goalMet') { av = a.stats.goalMet; bv = b.stats.goalMet; }
    else if (field === 'updatedAt') { av = a.updatedAt || ''; bv = b.updatedAt || ''; }
    else { av = (a[field] || '').toString().toLowerCase(); bv = (b[field] || '').toString().toLowerCase(); }
    return av < bv ? -dir : av > bv ? dir : 0;
  });
  document.querySelectorAll('th.sortable').forEach(th => {
    th.classList.toggle('sorted', th.dataset.sort === field);
    const existing = th.querySelector('.sort-arrow'); if (existing) existing.remove();
    if (th.dataset.sort === field) th.insertAdjacentHTML('beforeend', `<span class="sort-arrow">${dir === 1 ? '▲' : '▼'}</span>`);
  });
  const body = document.getElementById('workflowsBody');
  if (!rows.length) { body.innerHTML = '<tr><td colspan="7" class="pra-muted">No workflows yet.</td></tr>'; return; }
  body.innerHTML = rows.map(w => `
    <tr>
      <td class="clickable" onclick="location.href='/workflow-detail.html?id=${w.id}'" style="cursor:pointer;color:var(--pra-blue)">${escapeHtml(w.name)}</td>
      <td class="pra-muted">${w.steps.length}</td>
      <td><button class="active-toggle${w.active ? ' on' : ''}" data-id="${w.id}" data-active="${w.active}"></button></td>
      <td>${w.stats.active}</td>
      <td>${w.stats.goalMet}</td>
      <td class="pra-muted">${fmtDate(w.updatedAt)}</td>
      <td style="white-space:nowrap">
        <button class="pra-btn pra-btn-ghost pra-btn-sm" data-dup="${w.id}">Copy</button>
        <button class="pra-btn pra-btn-sm pra-btn-danger" data-del="${w.id}">Delete</button>
      </td>
    </tr>
  `).join('');
  document.querySelectorAll('[data-dup]').forEach(btn => btn.onclick = async () => {
    const r = await fetch(`/api/workflows/${btn.dataset.dup}/duplicate`, { method: 'POST' });
    const d = await r.json();
    if (r.ok) location.href = '/workflow-detail.html?id=' + d.workflow.id;
  });
  document.querySelectorAll('[data-del]').forEach(btn => btn.onclick = async () => {
    if (!confirm('Delete this workflow?')) return;
    await fetch('/api/workflows/' + btn.dataset.del, { method: 'DELETE' });
    loadWorkflows();
  });
  document.querySelectorAll('.active-toggle').forEach(btn => btn.onclick = async () => {
    const next = btn.dataset.active !== 'true';
    await fetch(`/api/workflows/${btn.dataset.id}/active`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ active: next }) });
    loadWorkflows();
  });
}
async function loadWorkflows() {
  const r = await fetch('/api/workflows');
  if (!r.ok) { document.getElementById('workflowsBody').innerHTML = '<tr><td colspan="7" class="pra-muted">Could not load.</td></tr>'; return; }
  allWorkflows = (await r.json()).workflows;
  renderWorkflowsTable();
}
document.querySelectorAll('th.sortable').forEach(th => th.addEventListener('click', () => {
  if (workflowSort.field === th.dataset.sort) workflowSort.dir *= -1;
  else workflowSort = { field: th.dataset.sort, dir: 1 };
  renderWorkflowsTable();
}));
document.getElementById('newWorkflowBtn').onclick = async () => {
  const r = await fetch('/api/workflows', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: 'Untitled Workflow' }) });
  const d = await r.json();
  if (r.ok) location.href = '/workflow-detail.html?id=' + d.workflow.id;
};
loadWorkflows();
</script>
</body>
</html>
